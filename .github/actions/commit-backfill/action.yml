name: commit-backfill
description: Commit backfill/data (public data only) to the branch the workflow runs on, retrying around concurrent jobs.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        git config user.name "warwatch-bot"
        git config user.email "warwatch-bot@users.noreply.github.com"
        git add -A backfill 2>/dev/null || true
        git diff --cached --quiet && exit 0
        git commit -qm "backfill: ${GITHUB_JOB} $(date -u +%FT%H:%MZ)"
        for i in 1 2 3 4 5 6; do
          git pull --rebase -q -X theirs origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
          git rebase --abort 2>/dev/null || true
          sleep $((RANDOM % 20 + 5))
        done
        echo "::warning::push failed"; exit 1
