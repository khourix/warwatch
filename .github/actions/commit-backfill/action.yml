name: commit-backfill
description: Commit backfill/data (public data only) to the branch the workflow runs on, retrying around concurrent jobs.
inputs:
  paths:
    description: "what to commit (space-separated paths)"
    required: false
    default: "backfill"
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        git config user.name "warwatch-bot"
        git config user.email "warwatch-bot@users.noreply.github.com"
        git add -A ${{ inputs.paths }} 2>/dev/null || true
        git diff --cached --quiet && exit 0
        # The checkout is shallow, so a rebase over many newer commits has no merge base and fails. Jobs write disjoint
        # files: keep this job's files aside, move to the newest branch tip, put them back and commit there.
        keep="${RUNNER_TEMP}/keep"; rm -rf "$keep"; mkdir -p "$keep"
        # --no-renames: a file moved from backfill/shards/ to backfill/data/ (the merge job) is an add plus a delete, not a
        # rename that the filter would drop. Deletions are kept as a list and applied again on the new tip.
        git diff --cached --name-only --no-renames --diff-filter=AM | while read -r f; do cp --parents "$f" "$keep"; done
        gone="${RUNNER_TEMP}/gone"; git diff --cached --name-only --no-renames --diff-filter=D > "$gone"
        for i in 1 2 3 4 5 6 7 8; do
          git fetch -q --depth=1 origin "${GITHUB_REF_NAME}" || { sleep 10; continue; }
          git reset -q --hard FETCH_HEAD
          cp -r "$keep"/. .
          while read -r f; do rm -f -- "$f"; done < "$gone"
          git add -A ${{ inputs.paths }} 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "backfill: ${GITHUB_JOB} $(date -u +%FT%H:%MZ)"
          git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
          sleep $((RANDOM % 20 + 5))
        done
        echo "::warning::push failed"; exit 1
