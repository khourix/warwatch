name: lab7
# TEMPORARY, branch-only: optical history again with the fixed change measure (base outline, clear pixels, last 30 days,
# visible bands, scene-wide shift removed, brightening only, dark burns), new radar scenes, and fresh chips for all 120
# bases. Removed before the PR.
on:
  push:
    branches: [claude/hopeful-heisenberg-tpy723]
    paths: [".github/workflows/lab7.yml"]
permissions:
  contents: write
concurrency:
  group: lab7
  cancel-in-progress: false
jobs:
  bases:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      WARWATCH_CHIPS: ${{ github.workspace }}/chips
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --break-system-packages numpy scipy rasterio pillow
      - name: Restart the optical history (its measure changed)
        run: rm -f warwatch/history/basewatch_optical.csv
      - name: Sites in this shard
        run: |
          python3 -c "import json; ids = sorted(r['id'] for r in json.load(open('warwatch/data/bases.json'))); print('SITES=' + ','.join(ids[${{ matrix.shard }}::8]))" >> "$GITHUB_ENV"
      - name: Latest optical scenes and chips (harbour views for naval sites, a "before" image 25-60 days back)
        run: python3 -u warwatch/basewatch.py --site "$SITES"
      - uses: actions/upload-artifact@v4
        with:
          name: bases_${{ matrix.shard }}
          path: |
            chips
            warwatch/history/basewatch_scenes.csv
            warwatch/history/basewatch_optical.csv
            warwatch/history/cache/base_chips.csv
  merge:
    needs: [bases]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Merge shards
        run: |
          find parts -name '*.csv'
          mkdir -p warwatch/history/cache
          python3 -u - <<'EOF'
          import csv, glob, os, sys
          sys.path.insert(0, "warwatch")
          import basewatch as B
          def merge(name, out):
              head, rows = None, []
              for p in sorted(glob.glob(f"parts/bases_*/**/{name}", recursive=True)):
                  with open(p, newline="") as f:
                      r = list(csv.reader(f))
                  if r:
                      head = head or r[0]
                      rows += [x for x in r[1:] if x]
              seen = set()
              rows = [x for x in rows if not (tuple(x) in seen or seen.add(tuple(x)))]
              if head:
                  with open(out, "w", newline="") as f:
                      w = csv.writer(f, lineterminator="\n")
                      w.writerow(head)
                      w.writerows(rows)
              print(name, len(rows))
          merge("basewatch_scenes.csv", B.SCENES)
          merge("basewatch_optical.csv", B.OPTICAL)
          merge("base_chips.csv", os.path.join(B.CACHE, "base_chips.csv"))
          st = B.rebuild(B.load_bases())
          n = {}
          for v in st.values():
              n[v] = n.get(v, 0) + 1
          print("states", n)
          print("nodata:", sorted(k for k, v in st.items() if v == "nodata"))
          EOF
      - name: Commit results to this branch
        run: |
          git config user.name "warwatch-bot"
          git config user.email "warwatch-bot@users.noreply.github.com"
          for f in warwatch/history/basewatch_*.csv warwatch/history/cache/base_*.csv warwatch/history/cache/bases_*.csv \
                   warwatch/history/cache/fire_review.csv warwatch/history/cache/fire_anoms.csv warwatch/history/cache/econ_war_fires.csv; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          git status --short | head -20
          git diff --cached --quiet && { echo "nothing staged"; exit 1; }
          git commit -qm "lab7: base optical history with the fixed change measure, fresh chips"
          for i in 1 2 3 4 5; do git pull --rebase -q origin claude/hopeful-heisenberg-tpy723 && git push -q origin HEAD:claude/hopeful-heisenberg-tpy723 && exit 0; sleep $((i*10)); done
          exit 1
      - name: New base chips over the imagery branch (fire chips kept)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p chips
          git fetch --depth 1 origin imagery && git --work-tree=chips checkout FETCH_HEAD -- . && git reset -q
          for d in parts/bases_*/; do [ -d "$d/chips" ] && cp -r "$d/chips/." chips/; done
          find chips -name '*.jpg' | wc -l; du -sh chips
          cd chips
          git init -q && git checkout -q -b imagery
          git add -A
          git -c user.name=warwatch-bot -c user.email=warwatch-bot@users.noreply.github.com commit -qm "imagery $(date -u +%FT%H:%MZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" imagery
