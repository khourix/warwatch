name: lab-osm
# TEMPORARY, branch-only: why QLever answers 403 on GitHub runners. Removed before the PR.
on:
  push:
    branches: [claude/project-thread-szj3l8]
    paths: [".github/workflows/lab-osm.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe QLever and Overpass
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json
          Q = 'PREFIX osmkey: <https://www.openstreetmap.org/wiki/Key:>\nSELECT ?x WHERE { ?x osmkey:military "airfield" } LIMIT 2'
          UA = "warwatch/1.0 (https://github.com/khourix/warwatch)"
          BUA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          def go(name, url, data=None, ua=UA, acc="application/sparql-results+json"):
              h = {"Accept": acc}
              if ua: h["User-Agent"] = ua
              if data: h["Content-Type"] = "application/x-www-form-urlencoded"
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, data=data, headers=h), timeout=60)
                  print(name, r.status, r.read()[:200])
              except urllib.error.HTTPError as e:
                  print(name, e.code, dict(e.headers), e.read()[:400])
              except Exception as e:
                  print(name, "ERR", e)
          body = urllib.parse.urlencode({"query": Q}).encode()
          for host in ("https://qlever.dev/api/osm-planet", "https://qlever.cs.uni-freiburg.de/api/osm-planet"):
              go("POST ourUA " + host, host, body)
              go("POST browserUA " + host, host, body, BUA)
              go("POST noUA " + host, host, body, None)
              go("GET ourUA " + host, host + "?" + urllib.parse.urlencode({"query": Q}))
              go("GET browserUA " + host, host + "?" + urllib.parse.urlencode({"query": Q}), None, BUA)
          go("qlever.dev home", "https://qlever.dev/", None, BUA, "text/html")
          for u in ("https://overpass-api.de/api/status", "https://overpass.private.coffee/api/status", "https://maps.mail.ru/osm/tools/overpass/api/status", "https://overpass.kumi.systems/api/status"):
              go("status " + u, u, None, UA, "*/*")
          oq = urllib.parse.urlencode({"data": '[out:json][timeout:25];node["military"="airfield"](33,44,34,45);out center 2;'}).encode()
          for u in ("https://overpass-api.de/api/interpreter", "https://overpass.private.coffee/api/interpreter", "https://maps.mail.ru/osm/tools/overpass/api/interpreter", "https://overpass.kumi.systems/api/interpreter"):
              go("small " + u, u, oq, UA, "*/*")
          PY
