name: lab-osm
# TEMPORARY, branch-only: the fireref site list from Geofabrik extracts, then the replay and case checks with the new
# sites, committed to this branch. Removed before the PR.
on:
  push:
    branches: [claude/project-thread-szj3l8]
    paths: [".github/workflows/lab-osm.yml"]
permissions:
  contents: write
concurrency:
  group: lab-osm
  cancel-in-progress: false
jobs:
  fireref:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      FIRMS_ARCHIVE_CACHE: /tmp/firms-archive
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq osmium-tool
      - name: Sites (Geofabrik)
        run: python3 -u warwatch/fireref.py sites
      - name: Commit the site list now (the replay is long)
        run: |
          git config user.name "warwatch-bot"
          git config user.email "warwatch-bot@users.noreply.github.com"
          git add warwatch/data/fire_sites.csv
          git diff --cached --quiet || git commit -qm "lab-osm: fire sites from Geofabrik $(date -u +%FT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q origin claude/project-thread-szj3l8 && git push -q origin HEAD:claude/project-thread-szj3l8 && break; sleep $((i*10)); done
      - run: python3 -u warwatch/fireref.py check || true
      - name: Archive tables (fills the archive cache for the replay)
        run: python3 -u warwatch/fireref.py build
      - run: python3 -u warwatch/fireref.py cases || true
      - run: python3 -u warwatch/fireref.py replay --from 2018-01-01
      - name: Commit the replay
        run: |
          for f in backfill/data/firecls warwatch/data/fire_sites.csv; do git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -qm "lab-osm: fire replay with Geofabrik and GEM sites $(date -u +%FT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q origin claude/project-thread-szj3l8 && git push -q origin HEAD:claude/project-thread-szj3l8 && exit 0; sleep $((i*10)); done
