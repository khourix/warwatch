name: warwatch
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated series ids (blank = all)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["warwatch/**/*.py", "warwatch/page.html", ".github/workflows/warwatch.yml"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: warwatch-${{ github.event.inputs.only != '' && 'partial' || 'full' }}
  cancel-in-progress: false
env:
  WW: warwatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Basemap (Natural Earth countries, public domain)
        run: |
          mkdir -p $WW/assets
          [ -s $WW/assets/countries-50m.json ] || curl -fsSL --retry 3 -o $WW/assets/countries-50m.json \
            https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json || echo "basemap download failed; page renders without it"
      - name: Unit tests
        run: python3 $WW/tests/test_warwatch.py
      - name: Fetch, score, render
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python3 $WW/run.py --only "${{ github.event.inputs.only }}" --out site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: warwatch-dashboard
          path: site/
          retention-days: 30
      - name: Commit history (public data only)
        if: github.event.inputs.only == ''
        run: |
          git config user.name "warwatch-bot"
          git config user.email "warwatch-bot@users.noreply.github.com"
          git add $WW/history $WW/assets 2>/dev/null || true
          # history files are append-only; .gitattributes merges concurrent appends (union).
          # Best effort: a failed history push must not fail the dashboard build.
          git diff --cached --quiet || (git commit -m "history: $(date -u +%FT%H:%MZ)" && git pull --rebase -q && git push -q) || (git rebase --abort; echo "history push skipped")
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
  deploy:
    needs: build
    if: github.event.inputs.only == ''      # a partial test run must not replace the live page
    runs-on: ubuntu-latest
    continue-on-error: true      # stays green until Pages is switched on (Settings > Pages > Source: GitHub Actions)
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
