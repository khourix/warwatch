name: warwatch
on:
  schedule:
    # GitHub drops or delays most scheduled runs (top-of-the-hour slots worst): this fired every 3 to 8 hours.
    # The cadence comes from the "next" job below; this cron only restarts the chain if it ever breaks.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated series ids (blank = all)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["warwatch/**/*.py", "warwatch/page.html", "web/**", ".github/workflows/warwatch.yml"]
permissions:
  contents: write
  actions: write      # the "next" job dispatches the following run
  pages: write
  id-token: write
concurrency:
  group: warwatch-${{ github.event.inputs.only != '' && 'partial' || 'full' }}
  cancel-in-progress: false
env:
  WW: warwatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - name: Basemap (Natural Earth countries, public domain)
        run: |
          mkdir -p $WW/assets
          [ -s $WW/assets/countries-50m.json ] || curl -fsSL --retry 3 -o $WW/assets/countries-50m.json \
            https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json || echo "basemap download failed; page renders without it"
      - name: Unit tests
        run: python3 $WW/tests/test_warwatch.py
      - name: Install h3 (GPSJam cell centres)
        run: python3 -m pip install --quiet --break-system-packages h3
      - name: Live ships collected by the ais job (orphan branch; none yet is fine)
        run: git fetch -q --depth=1 origin ais && git show FETCH_HEAD:state.json > "$RUNNER_TEMP/ais_state.json" || echo "no ais state yet"
      # Node is set up here, before run.py, so the share cards get their fonts; the new app's build below uses it too.
      - uses: actions/setup-node@v6
        continue-on-error: true
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Fonts for the share cards (Switzer and Sentient from Fontshare, never committed; system fonts if this fails)
        continue-on-error: true
        timeout-minutes: 2
        run: node web/scripts/fetch-fonts.mjs
      - name: Fetch, score, render
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
          UCDP_TOKEN: ${{ secrets.UCDP_TOKEN }}
          ALERTS_IN_UA_TOKEN: ${{ secrets.ALERTS_IN_UA_TOKEN }}
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          FIRMS_MAX: "12"
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          WARWATCH_AIS_STATE: ${{ runner.temp }}/ais_state.json
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: python3 $WW/run.py --only "${{ github.event.inputs.only }}" --out site/index.html
      - uses: actions/upload-artifact@v7
        # A 30-day backup copy of the site, not the deploy: when GitHub's artifact service failed (11 Nov 2026) this step
        # skipped the history commit, the page and the deploy, and the page went two hours without an update.
        continue-on-error: true
        with:
          name: warwatch-dashboard
          # the share cards' fonts are served from the site but not handed out as files (Fontshare licence)
          path: |
            site/
            !site/og-fonts/
          retention-days: 30
      - name: Commit history (public data only)
        if: github.event.inputs.only == ''
        run: |
          git config user.name "warwatch-bot"
          git config user.email "warwatch-bot@users.noreply.github.com"
          git add $WW/history $WW/assets forward 2>/dev/null || true
          # history files are append-only; .gitattributes merges concurrent appends (union).
          # Best effort: a failed history push must not fail the dashboard build.
          git diff --cached --quiet && exit 0
          git commit -qm "history: $(date -u +%FT%H:%MZ)"
          # cache files are rewritten whole from the full history in this checkout, so on a clash this run's copy wins (-X theirs = the commit being replayed)
          for i in 1 2 3 4; do
            git pull --rebase -X theirs -q && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "history push skipped"
      - name: Imagery chips (optional; written by imagery.yml to the imagery branch)
        run: |
          mkdir -p site/img
          (git fetch --depth 1 origin imagery && git --work-tree=site/img checkout FETCH_HEAD -- . && git reset -q) || echo "no imagery yet"
      - name: Share card (og.jpg drawn from this run's data; the static card stays if this fails)
        run: |
          [ -s site/og-card.html ] || { echo "no og-card.html; keeping the static og.jpg"; exit 0; }
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --allow-file-access-from-files --force-device-scale-factor=1 \
            --window-size=1200,630 --screenshot="$PWD/site/og-new.jpg" "file://$PWD/site/og-card.html" \
            && [ -s site/og-new.jpg ] && mv site/og-new.jpg site/og.jpg || echo "share card render failed; keeping the static og.jpg"
      - name: Theatre share cards (og/<theatre>.jpg; a theatre without one shares og.jpg)
        continue-on-error: true
        run: |
          mkdir -p site/og
          for f in site/og-card-*.html; do
            [ -e "$f" ] || continue
            t=$(basename "$f" .html); t=${t#og-card-}
            timeout 60 google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --allow-file-access-from-files --force-device-scale-factor=1 \
              --window-size=1200,630 --screenshot="$PWD/site/og/$t.jpg" "file://$PWD/$f" >/dev/null 2>&1 \
              || { rm -f "site/og/$t.jpg"; echo "card for $t failed"; }
          done
          ls site/og | wc -l
      # Basemap for the new app: OpenStreetMap water, roads and towns cut from the Protomaps world build (zoom 0 to 6),
      # refreshed once a month through the cache. Optional: without it the app draws Natural Earth countries only.
      - id: month
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        continue-on-error: true
        with:
          path: basemap/basemap.pmtiles
          key: basemap-z6-${{ steps.month.outputs.m }}
      - name: Basemap tiles (optional)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s basemap/basemap.pmtiles ]; then
            mkdir -p basemap && cd basemap
            gh release download -R protomaps/go-pmtiles --pattern '*_Linux_x86_64.tar.gz' -O pm.tgz && tar xzf pm.tgz pmtiles
            build=$(curl -fsS https://build-metadata.protomaps.dev/builds.json | grep -o '[0-9]\{8\}\.pmtiles' | sort -u | tail -1)
            echo "Protomaps build: $build"
            for z in 6 5; do
              ./pmtiles extract "https://build.protomaps.com/$build" basemap.pmtiles --maxzoom=$z
              # GitHub Pages serves files up to 100 MB; a smaller zoom range is the fallback
              [ "$(stat -c %s basemap.pmtiles)" -lt 95000000 ] && break
              rm -f basemap.pmtiles
            done
            cd ..
          fi
          ls -la basemap/basemap.pmtiles && cp basemap/basemap.pmtiles site/basemap.pmtiles
      # The new app (web/, React) is the page at /warwatch/, with an address per theatre (/warwatch/iran/) and its own share card.
      # pages.py moves the old page to /warwatch/classic/ until its CLASSIC_UNTIL date. If the build or pages.py fails, site/ stays as
      # run.py wrote it, so the old page is served at /warwatch/ for that run and nothing is held back.
      - name: New app (web/ built, then written to site/ with a page per address)
        continue-on-error: true
        run: |
          cd web && npm ci --no-audit --no-fund && npm run build && cd ..
          python3 $WW/pages.py site web/dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
  deploy:
    needs: build
    if: github.event.inputs.only == ''      # a partial test run must not replace the live page
    runs-on: ubuntu-latest
    continue-on-error: true      # stays green until Pages is switched on (Settings > Pages > Source: GitHub Actions)
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v5
  next:
    # Self-scheduling: queue the next full run 30 minutes after this one started (straight away if the build ran longer).
    # A run dispatched with the workflow token is allowed to start a workflow, unlike a push made with it.
    needs: [build, deploy]
    if: always() && github.event.inputs.only == ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Start the collectors GitHub's schedule skipped
        # GitHub runs frequent schedules only now and then (ais.yml, every 30 minutes on paper, ran about 4 times a day), so this
        # chain, which does run every 30 minutes, starts each collector that is due. Their crons stay as a fallback.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          now=$(date +%s)
          for spec in ais.yml:25 news.yml:355 imagery.yml:355; do
            wf=${spec%%:*}; every=${spec##*:}
            last=$(gh run list -R "$R" -w "$wf" -L 5 --json createdAt,status \
              --jq 'if any(.[]; .status != "completed") then "busy" else (.[0].createdAt // "") end') \
              || { echo "$wf: could not read its runs, skipped this cycle"; continue; }
            if [ "$last" = "busy" ]; then echo "$wf: a run is queued or running"; continue; fi
            age=$(( (now - $(date -d "${last:-1970-01-01T00:00:00Z}" +%s)) / 60 ))
            if [ "$age" -ge "$every" ]; then echo "$wf: last run $age min ago, starting one"; gh workflow run "$wf" -R "$R" --ref main
            else echo "$wf: last run $age min ago, not due"; fi
          done
      - env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          started=$(gh api "repos/$R/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          wait=$(( $(date -d "$started" +%s) + 1800 - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          # one chain only: a cron or push run already queued or running carries it on instead
          others=$(gh run list -R "$R" -w warwatch.yml -L 20 --json databaseId,status \
            --jq '[.[] | select(.databaseId != ${{ github.run_id }} and .status != "completed")] | length')
          if [ "$others" -gt 0 ]; then echo "another run is already queued or running"; exit 0; fi
          gh workflow run warwatch.yml -R "$R" --ref main
