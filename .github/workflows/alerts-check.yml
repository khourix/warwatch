name: alerts-check
# One-off check that the alerts.in.ua token works; prints counts only. Remove after the assessment.
on:
  push:
    branches: [claude/project-thread-79411m]
    paths: [probe/alerts_check.py, .github/workflows/alerts-check.yml]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the alerts.in.ua token
        env:
          ALERTS_IN_UA_TOKEN: ${{ secrets.ALERTS_IN_UA_TOKEN }}
        run: python3 probe/alerts_check.py
