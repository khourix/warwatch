name: lab5
# TEMPORARY, branch-only: a hand run of imagery.yml with the repo secrets, before imagery.yml reaches main. Live fires
# (FIRMS_MAP_KEY) -> Sentinel-2 check of unusual fires; radar history since mid-July and the latest chips for all 120 bases
# in 8 parallel shards; one merge that commits the result CSVs to this branch and publishes the chips to the imagery
# branch. Removed before the PR.
on:
  push:
    branches: [claude/hopeful-heisenberg-tpy723]
    paths: [".github/workflows/lab5.yml"]
permissions:
  contents: write
concurrency:
  group: lab5
  cancel-in-progress: false
jobs:
  fires:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WARWATCH_CHIPS: ${{ github.workspace }}/chips
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --break-system-packages numpy scipy rasterio pillow
      - name: Live fires, classed (as the dashboard build does)
        run: |
          python3 -u - <<'EOF'
          import os, sys
          sys.path.insert(0, "warwatch")
          import config as C, firecls, osint
          assert os.environ.get("FIRMS_MAP_KEY"), "FIRMS_MAP_KEY secret missing"
          pts = osint.fetch_fires(os.environ["FIRMS_MAP_KEY"], C.FIRMS_BOX)
          firecls.save_anoms(pts)
          firecls.save_daily(pts)
          by = {}
          for p in pts:
              by.setdefault(p["box"], {}).setdefault(p["c"], 0)
              by[p["box"]][p["c"]] += 1
          print(len(pts), "map fires", by)
          EOF
      - run: python3 -u warwatch/fireref.py econ
      - run: python3 -u warwatch/firereview.py --max 40
      - uses: actions/upload-artifact@v4
        with:
          name: fires
          path: |
            chips
            warwatch/history/cache/fire_review.csv
            warwatch/history/cache/fire_anoms.csv
            warwatch/history/cache/econ_war_fires.csv
  bases:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      WARWATCH_CHIPS: ${{ github.workspace }}/chips
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --break-system-packages numpy scipy rasterio pillow
      - name: Sites in this shard
        run: |
          python3 -c "import json; ids = sorted(r['id'] for r in json.load(open('warwatch/data/bases.json'))); print('SITES=' + ','.join(ids[${{ matrix.shard }}::8]))" >> "$GITHUB_ENV"
      - name: Radar history since mid-July
        run: echo "$SITES" && python3 -u warwatch/basewatch.py --site "$SITES" --backfill-from 2026-07-15 --budget 4000 --no-optical
      - name: Latest optical scenes and chips
        run: python3 -u warwatch/basewatch.py --site "$SITES"
      - uses: actions/upload-artifact@v4
        with:
          name: bases_${{ matrix.shard }}
          path: |
            chips
            warwatch/history/basewatch_scenes.csv
            warwatch/history/basewatch_optical.csv
            warwatch/history/cache/base_chips.csv
  merge:
    needs: [fires, bases]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Merge shards
        run: |
          find parts -maxdepth 3 | head -50
          mkdir -p chips warwatch/history/cache
          for d in parts/*/; do [ -d "$d/chips" ] && cp -r "$d/chips/." chips/; done
          [ -d parts/fires/warwatch ] && cp parts/fires/warwatch/history/cache/*.csv warwatch/history/cache/ || true
          python3 -u - <<'EOF'
          import csv, glob, os, sys
          sys.path.insert(0, "warwatch")
          import basewatch as B
          def merge(name, out):
              head, rows = None, []
              for p in sorted(glob.glob(f"parts/bases_*/**/{name}", recursive=True)):
                  with open(p, newline="") as f:
                      r = list(csv.reader(f))
                  if r:
                      head = head or r[0]
                      rows += [x for x in r[1:] if x]
              if head:
                  with open(out, "w", newline="") as f:
                      w = csv.writer(f, lineterminator="\n")
                      w.writerow(head)
                      w.writerows(rows)
              print(name, len(rows))
          merge("basewatch_scenes.csv", B.SCENES)
          merge("basewatch_optical.csv", B.OPTICAL)
          merge("base_chips.csv", os.path.join(B.CACHE, "base_chips.csv"))
          st = B.rebuild(B.load_bases())
          n = {}
          for v in st.values():
              n[v] = n.get(v, 0) + 1
          print("states", n)
          EOF
          du -sh chips; find chips -name '*.jpg' | wc -l
      - name: Commit results to this branch
        run: |
          git config user.name "warwatch-bot"
          git config user.email "warwatch-bot@users.noreply.github.com"
          git add warwatch/history/basewatch_*.csv warwatch/history/cache/base_*.csv warwatch/history/cache/bases_*.csv \
                  warwatch/history/cache/fire_review.csv warwatch/history/cache/fire_anoms.csv warwatch/history/cache/econ_war_fires.csv 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "lab5: hand run of imagery.yml $(date -u +%FT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q origin claude/hopeful-heisenberg-tpy723 && git push -q origin HEAD:claude/hopeful-heisenberg-tpy723 && exit 0; sleep $((i*10)); done
      - name: Push chips to the imagery branch (overwritten, no history)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -n "$(ls -A chips 2>/dev/null)" ] || exit 0
          cd chips
          git init -q && git checkout -q -b imagery
          git add -A
          git -c user.name=warwatch-bot -c user.email=warwatch-bot@users.noreply.github.com commit -qm "imagery $(date -u +%FT%H:%MZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" imagery
