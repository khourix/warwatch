name: news
# Headline counts (Google News RSS), GDELT daily event files, extended a few days per run; a Bluesky sample (five minutes every half hour).
# First run: dispatch with max_requests=150 to backfill about 150 days for each theatre.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      max_requests:
        description: "calls per series this run (12 = daily upkeep, 150 = full backfill)"
        required: false
        default: "12"
      bsky_hours:
        description: "hours of Bluesky to sample back (Jetstream keeps about a day; 7 = daily upkeep)"
        required: false
        default: "7"
permissions:
  contents: write
concurrency:
  group: warwatch-news
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install h3 (GPSJam cell centres)
        run: python3 -m pip install --quiet --break-system-packages h3
      - name: Fetch headline counts
        env:
          WARWATCH_LIVE: "1"
          GNEWS_MAX: ${{ github.event.inputs.max_requests || '12' }}
          GPSJAM_MAX: ${{ github.event.inputs.max_requests || '25' }}
          FAA_CLIENT_ID: ${{ secrets.FAA_CLIENT_ID }}
          FAA_CLIENT_SECRET: ${{ secrets.FAA_CLIENT_SECRET }}
          GDELT_MAX: ${{ github.event.inputs.max_requests || '6' }}
          BSKY_HOURS: ${{ github.event.inputs.bsky_hours || '7' }}
        run: |
          ids=$(python3 -c "import sys; sys.path.insert(0,'warwatch'); import catalog; print(','.join(s['id'] for s in catalog.SERIES if s['id'].startswith(('news_','gdelt_','gpsjam_','notam_','bsky_'))))")
          python3 warwatch/run.py --only "$ids" --fetch-only
      - name: Commit cache (public data only)
        run: |
          git config user.name "warwatch-bot"
          git config user.email "warwatch-bot@users.noreply.github.com"
          git add warwatch/history/cache 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "news: $(date -u +%FT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -q -X theirs origin main && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            # the dashboard build pushed in between: re-apply only this job's files on top of the new head
            mkdir -p /tmp/mine && cp warwatch/history/cache/news_* warwatch/history/cache/gdelt_* warwatch/history/cache/gpsjam_* warwatch/history/cache/notam_* warwatch/history/cache/bsky_* /tmp/mine/ 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/mine/* warwatch/history/cache/ && git add warwatch/history/cache && git commit -qm "news: $(date -u +%FT%H:%MZ)" || exit 0
          done
          echo "push skipped"
