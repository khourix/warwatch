name: refit
# Monthly: extend the GDELT history, rebuild the point-in-time panel, rerun the rolling-origin validation and refit the probability model.
# Writes warwatch/data/model_weights.json and docs/MODEL.md. The model drives the live levels only while its gates pass (see docs/MODEL.md).
on:
  schedule:
    - cron: "17 4 2 * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: warwatch-refit
  cancel-in-progress: false
jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis libraries (the live build does not need them)
        run: python3 -m pip install --quiet --break-system-packages numpy pandas scipy
      - name: Unit tests
        run: |
          python3 warwatch/tests/test_warwatch.py
          python3 warwatch/tests/test_eventstudy.py
      - name: Extend GDELT history to yesterday
        run: python3 warwatch/backfill.py gdelt
      - name: Validate and refit
        run: python3 warwatch/validate.py fit
      - name: Refit the hidden armed-force shadow model (never drives the page)
        run: python3 warwatch/validate.py fit-armed
      - name: Backtest against past events (lead times, false alarms, fast feeds)
        run: |
          python3 warwatch/eventstudy.py --refresh > /dev/null
          python3 warwatch/fastfeeds.py --refresh > /dev/null
          python3 warwatch/calibrate.py > /dev/null
          python3 warwatch/improve.py > /dev/null
      - name: Score the forward record
        run: python3 warwatch/forward_score.py
      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: |
            warwatch/data/model_weights.json
            docs/MODEL.md
            docs/FORWARD.md
            docs/BACKTEST_EVENTS.md
            docs/BACKTEST_FASTFEEDS.md
            docs/CALIBRATION.md
            docs/IMPROVEMENTS.md
          retention-days: 30
      - name: Commit the refit (public data only)
        run: |
          git config user.name "warwatch-bot"
          git config user.email "warwatch-bot@users.noreply.github.com"
          git add warwatch/data/model_weights.json warwatch/data/model_weights_armed.json docs/MODEL.md docs/MODEL_ARMED.md docs/FORWARD.md docs/FORWARD_ARMED.md docs/BACKTEST_EVENTS.md docs/BACKTEST_FASTFEEDS.md docs/CALIBRATION.md docs/IMPROVEMENTS.md backtest/improvements.csv backtest/alert_rules.csv backtest/training_focus.csv backtest/family_evidence.csv backtest/weight_schemes.csv backtest/event_study.csv backtest/alert_episodes.csv backtest/fastfeeds.csv backtest/history/gdelt_country_day.csv.gz
          git diff --cached --quiet && exit 0
          git commit -qm "model refit: $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase -q -X theirs origin main && git push -q && exit 0
          done
          echo "push failed"; exit 1
