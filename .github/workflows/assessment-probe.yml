name: assessment-probe
# One-off reachability probe for the October 2026 source assessment. Runs only on
# pushes to the assessment branch that touch the probe; remove after the assessment.
on:
  push:
    branches: [claude/project-thread-79411m]
    paths: [probe/assessment_probe.py, probe/check_credentials.py, probe/routes.py, .github/workflows/assessment-probe.yml, warwatch/osint.py, warwatch/extras.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Probe sources
        if: false
        env:
          GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
        run: python3 probe/assessment_probe.py probe/results.json
      - name: Other routes to blocked sites; Tzeva Adom and Jetstream live tests
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          ROUTES_ROUND: "11"
        run: python3 probe/routes.py probe/routes11.json
      - name: China MSA back-fill and a live fetch of the new series
        if: false
        env:
          WARWATCH_LIVE: "1"
          BSKY_HOURS: "3"
        run: |
          python3 backfill/backfill.py msa || echo "::warning::msa back-fill failed"
          ids=$(python3 -c "import sys; sys.path.insert(0,'warwatch'); import catalog; print(','.join(s['id'] for s in catalog.SERIES if s['id'].startswith(('tzeva_','bsky_','crisiswatch_','jcg_','msa_','gacc_'))))")
          python3 warwatch/run.py --only "$ids" --fetch-only
          ls -la warwatch/history/cache backfill/data | grep -E "tzeva|bsky|crisiswatch|jcg|msa|gacc" || true
          wc -l warwatch/history/cache/jcg_msgs.csv warwatch/history/cache/msa_warn.csv || true; cat warwatch/history/cache/gacc_exports.csv || true
      - name: Install Google client libraries
        if: false
        run: python3 -m pip install -q google-cloud-bigquery earthengine-api
      - name: Check new account credentials
        if: false
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          ALERTS_IN_UA_TOKEN: ${{ secrets.ALERTS_IN_UA_TOKEN }}
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          SPACETRACK_USER: ${{ secrets.SPACETRACK_USER }}
          SPACETRACK_PASS: ${{ secrets.SPACETRACK_PASS }}
          BARENTSWATCH_CLIENT_ID: ${{ secrets.BARENTSWATCH_CLIENT_ID }}
          BARENTSWATCH_CLIENT_SECRET: ${{ secrets.BARENTSWATCH_CLIENT_SECRET }}
          FREIGHTOS_EMAIL: ${{ secrets.FREIGHTOS_EMAIL }}
          FREIGHTOS_PASSWORD: ${{ secrets.FREIGHTOS_PASSWORD }}
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python3 probe/check_credentials.py probe/credentials.json
      - name: Commit results
        run: |
          git config user.name "warwatch-bot"
          git config user.email "warwatch-bot@users.noreply.github.com"
          git add probe/*.json
          git add backfill/data warwatch/history/cache 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "probe: results $(date -u +%FT%H:%MZ)" && git push -q)
