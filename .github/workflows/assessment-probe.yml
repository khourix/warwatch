name: assessment-probe
# One-off reachability probe for the October 2026 source assessment. Runs only on
# pushes to the assessment branch that touch the probe; remove after the assessment.
on:
  push:
    branches: [claude/project-thread-79411m]
    paths: [probe/assessment_probe.py, probe/check_credentials.py, .github/workflows/assessment-probe.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe sources
        env:
          GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
        run: python3 probe/assessment_probe.py probe/results.json
      - name: Check new account credentials
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          ALERTS_IN_UA_TOKEN: ${{ secrets.ALERTS_IN_UA_TOKEN }}
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          SPACETRACK_USER: ${{ secrets.SPACETRACK_USER }}
          SPACETRACK_PASS: ${{ secrets.SPACETRACK_PASS }}
          BARENTSWATCH_CLIENT_ID: ${{ secrets.BARENTSWATCH_CLIENT_ID }}
          BARENTSWATCH_CLIENT_SECRET: ${{ secrets.BARENTSWATCH_CLIENT_SECRET }}
          FREIGHTOS_EMAIL: ${{ secrets.FREIGHTOS_EMAIL }}
          FREIGHTOS_PASSWORD: ${{ secrets.FREIGHTOS_PASSWORD }}
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python3 probe/check_credentials.py probe/credentials.json
      - name: Commit results
        run: |
          git config user.name "warwatch-bot"
          git config user.email "warwatch-bot@users.noreply.github.com"
          git add probe/results.json probe/credentials.json
          git diff --cached --quiet || (git commit -m "probe: results $(date -u +%FT%H:%MZ)" && git push -q)
