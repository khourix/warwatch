name: assessment-probe
# One-off reachability probe for the October 2026 source assessment. Runs only on
# pushes to the assessment branch that touch the probe; remove after the assessment.
on:
  push:
    branches: [claude/project-thread-79411m]
    paths: [probe/assessment_probe.py, .github/workflows/assessment-probe.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe sources
        env:
          GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
        run: python3 probe/assessment_probe.py probe/results.json
      - name: Commit results
        run: |
          git config user.name "warwatch-bot"
          git config user.email "warwatch-bot@users.noreply.github.com"
          git add probe/results.json
          git diff --cached --quiet || (git commit -m "probe: results $(date -u +%FT%H:%MZ)" && git push -q)
