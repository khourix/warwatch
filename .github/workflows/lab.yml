name: lab
# TEMPORARY, branch-only: runs lab/run.sh for jobs the dev sandbox cannot reach (Overpass), commits the files it lists. Removed before the PR.
on:
  push:
    branches: [claude/hopeful-heisenberg-tpy723]
    paths: ["lab/**", ".github/workflows/lab.yml"]
permissions:
  contents: write
concurrency:
  group: lab
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --break-system-packages numpy scipy rasterio pillow matplotlib
      - run: bash lab/run.sh
      - name: Commit outputs listed in lab/outputs.txt
        run: |
          git config user.name "warwatch-bot"
          git config user.email "warwatch-bot@users.noreply.github.com"
          [ -f lab/outputs.txt ] || exit 0
          xargs -a lab/outputs.txt git add -f -- 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "lab: outputs $(date -u +%FT%H:%MZ)"
          for i in 1 2 3 4; do git pull --rebase -q origin claude/hopeful-heisenberg-tpy723 && git push -q origin HEAD:claude/hopeful-heisenberg-tpy723 && exit 0; sleep $((i*5)); done
