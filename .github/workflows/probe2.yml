name: probe2
# Temporary: removed before the PR is merged.
on:
  push:
    branches: [claude/project-thread-zjnbht]
    paths: [tools/probe2.py, .github/workflows/probe2.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: python3 tools/probe2.py
