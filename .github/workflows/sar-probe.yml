name: sar-probe
on:
  push:
    branches: ["claude/project-thread-2mgl2x"]
    paths: ["tools/sar_probe.py", ".github/workflows/sar-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --break-system-packages rasterio numpy
      - run: python3 tools/sar_probe.py 2>&1 | tee probe.txt
