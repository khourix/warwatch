name: probe-sources (temporary, delete before merge)
on:
  push:
    branches: [claude/project-thread-h27h9b]
    paths: [".github/workflows/probe-sources.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: NGA daily memo files
        run: |
          for f in IV XII LAN PAC ARC; do echo "== DailyMem$f.txt"; curl -sS -m 60 -o m.txt -w 'HTTP %{http_code} %{size_download}B\n' "https://msi.nga.mil/apology_objects/DailyMem$f.txt"; head -c 1200 m.txt; echo; grep -c . m.txt; done
      - name: Chokepoints by portid
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.parse
          PW = "https://services9.arcgis.com/weJ1QsnbMYJlCHdG/arcgis/rest/services/"
          def get(svc, params):
              t = time.time()
              u = PW + svc + "/FeatureServer/0/query?" + urllib.parse.urlencode(params)
              try:
                  with urllib.request.urlopen(u, timeout=90) as r: d = json.loads(r.read())
              except Exception as e: d = {"error": str(e)}
              return d, time.time() - t
          d, s = get("PortWatch_chokepoints_database", {"where": "1=1", "outFields": "portid,portname", "returnGeometry": "false", "f": "json"})
          print([f["attributes"] for f in d.get("features", [])], d.get("error"))
          for pid in ["chokepoint6", "chokepoint4"]:
              for off in [0, 1000, 2000, 2500]:
                  d, s = get("Daily_Chokepoints_Data", {"where": f"portid = '{pid}'", "outFields": "date,portname,n_total", "returnGeometry": "false", "resultOffset": off, "f": "json"})
                  f = d.get("features", [])
                  print(pid, off, f"{s:.1f}s", len(f), (f[0]["attributes"], f[-1]["attributes"]) if f else None, d.get("exceededTransferLimit"), d.get("error"))
              d, s = get("Daily_Chokepoints_Data", {"where": f"portid = '{pid}' AND date >= DATE '2026-09-01'", "outFields": "date,portname,n_total", "returnGeometry": "false", "f": "json"})
              f = d.get("features", []); print(pid, "datefilter", f"{s:.1f}s", len(f), f[-1]["attributes"] if f else None, d.get("error"))
          PY
