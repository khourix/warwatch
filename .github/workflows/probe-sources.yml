name: probe-sources (temporary, delete before merge)
on:
  push:
    branches: [claude/project-thread-h27h9b]
    paths: [".github/workflows/probe-sources.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: NGA apology text
        run: |
          curl -sS -m 60 "https://msi.nga.mil/api/publications/smaps?output=json&status=all" > a.html || true
          python3 -c "
          import re,html;t=open('a.html').read();t=re.sub(r'(?s)<(script|style).*?</\1>',' ',t);t=re.sub(r'<[^>]+>',' ',t);print(re.sub(r'\s+',' ',html.unescape(t))[:1500])"
      - name: PortWatch
        run: |
          PW=https://services9.arcgis.com/weJ1QsnbMYJlCHdG/arcgis/rest/services
          q() { echo "== $1"; curl -sS -m 120 -o /tmp/b -w 'HTTP %{http_code} %{time_total}s %{size_download}B\n' "$1" || true; head -c 500 /tmp/b; echo; }
          C="$PW/Daily_Chokepoints_Data/FeatureServer/0/query"
          q "$C?where=portname+LIKE+%27%25Hormuz%25%27+AND+date+%3E%3D+DATE+%272026-10-01%27&outFields=date,portname,n_total&returnGeometry=false&f=json"
          q "$C?where=portname+LIKE+%27%25Hormuz%25%27+AND+date+%3E%3D+%272026-10-01%27&outFields=date,portname,n_total&returnGeometry=false&f=json"
          q "$C?where=portname+LIKE+%27%25Hormuz%25%27&outFields=date,portname,n_total&returnGeometry=false&orderByFields=date+DESC&resultRecordCount=3&f=json"
          q "$C?where=portname+LIKE+%27%25Hormuz%25%27&outFields=date,portname,n_total&returnGeometry=false&orderByFields=date+ASC&resultRecordCount=2000&f=json"
          echo; echo "--- hub catalog"
          for qq in daily ports chokepoint "port activity"; do
            curl -sS -m 60 "https://portwatch.imf.org/api/search/v1/collections/all/items?q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$qq")&limit=40" | python3 -c "
          import json,sys
          try: d=json.load(sys.stdin)
          except Exception as e: print('parse fail',e); sys.exit()
          for f in d.get('features',[]):
              p=f.get('properties',{}); print(p.get('id'),'|',p.get('type'),'|',p.get('title'),'|',p.get('url'),'|',p.get('modified'))" || true
          done
          for s in Daily_Regional_Data Daily_Trade_Data_WLD Daily_Trade_Data_REG PortWatch_ports_database portsfacts; do
            echo "== $s fields"; curl -sS -m 60 "$PW/$s/FeatureServer/0?f=json" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('name'),d.get('error'),[f['name'] for f in d.get('fields',[])][:40], d.get('editingInfo'))"
            curl -sS -m 60 "$PW/$s/FeatureServer/0/query?where=1%3D1&outFields=*&resultRecordCount=1&returnGeometry=false&f=json" | head -c 600; echo
          done
