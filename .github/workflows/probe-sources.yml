name: probe-sources (temporary, delete before merge)
on:
  push:
    branches: [claude/project-thread-h27h9b]
    paths: [".github/workflows/probe-sources.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: PortWatch country port calls
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.parse
          PW = "https://services9.arcgis.com/weJ1QsnbMYJlCHdG/arcgis/rest/services/"
          def get(svc, params):
              t = time.time()
              u = PW + svc + "/FeatureServer/0/query?" + urllib.parse.urlencode(params)
              try:
                  with urllib.request.urlopen(u, timeout=90) as r: d = json.loads(r.read())
              except Exception as e: d = {"error": str(e)}
              return d, time.time() - t
          for iso in "IRN IRQ ARE SAU QAT ISR LBN SYR YEM TWN KOR POL UKR PAK LBY VEN COD SDN PHL".split():
              d, s = get("Daily_Trade_Data_REG", {"where": f"ISO3 = '{iso}' AND date >= DATE '2026-01-05'", "outFields": "date,portcalls", "returnGeometry": "false",
                                                  "orderByFields": "date ASC", "resultRecordCount": 2000, "f": "json"})
              f = d.get("features", [])
              print(iso, f"{s:.1f}s", "n", len(f), "last", f[-1]["attributes"] if f else None, "err", d.get("error"), "more", d.get("exceededTransferLimit"))
          print("--- chokepoints")
          W = "portname LIKE '%Hormuz%'"
          for p in [{"where": W + " AND date >= DATE '2026-09-01'"},
                    {"where": W + " AND date BETWEEN DATE '2026-09-01' AND DATE '2026-12-31'"},
                    {"where": W + " AND date > '2026-09-01'"},
                    {"where": "portid = 'chokepoint6'"},
                    {"where": W, "orderByFields": "date DESC", "resultRecordCount": 120},
                    {"where": W, "resultOffset": 2000, "resultRecordCount": 2000},
                    {"where": W},
                    {"where": W, "orderByFields": "date DESC", "resultRecordCount": 120}]:
              q = {"outFields": "date,portname,n_total", "returnGeometry": "false", "f": "json"}; q.update(p)
              d, s = get("Daily_Chokepoints_Data", q)
              f = d.get("features", [])
              print(p, f"{s:.1f}s", "n", len(f), "dates", (f[0]["attributes"]["date"], f[-1]["attributes"]["date"]) if f else None, "err", d.get("error"))
          PY
