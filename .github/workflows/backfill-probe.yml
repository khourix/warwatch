name: backfill-probe
on:
  push:
    paths: [".github/workflows/backfill-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          UA="warwatch-backfill/0.1"
          for q in "status=active" "status=active&navArea=P" "status=cancelled&navArea=P&msgYear=2025" "status=all&navArea=P&msgYear=2025" "status=cancelled&navArea=P&msgYear=2024" "status=cancelled&navArea=P&msgYear=2024&msgNumber=1700" ; do
            echo "== $q"; curl -sSL -m 120 -A "$UA" "https://msi.nga.mil/api/publications/broadcast-warn?output=json&$q" | python3 -c "
          import sys,json,collections
          try: d=json.load(sys.stdin)['broadcast-warn']
          except Exception as e: print('ERR',e); sys.exit()
          c=collections.Counter((w['msgYear'],w['status']) for w in d)
          iss=sorted((w['msgYear'],w['issueDate'][-8:],w['issueDate'][:6]) for w in d)
          print(len(d), dict(c)); print(iss[:1], iss[-1:])"
          done
          echo "== other params"; curl -sS -m 60 -A "$UA" "https://msi.nga.mil/api/publications/broadcast-warn?output=json&status=cancelled&navArea=P&msgYear=2025" | head -c 300
          echo; curl -sSL -m 60 -A "$UA" "https://msi.nga.mil/api/publications/broadcast-warn?output=json&navArea=P&issueDate=2025" | head -c 300
