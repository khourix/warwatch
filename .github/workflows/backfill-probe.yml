name: backfill-probe
on:
  push:
    paths: [".github/workflows/backfill-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: probe
        continue-on-error: true
        run: |
          UA="warwatch-backfill/0.1 (public-data research; github.com/khourix/warwatch)"
          echo "=== plavis csv"; curl -sSL -A "$UA" https://raw.githubusercontent.com/ypcat/plavis/main/data/pla_activity.csv -o /tmp/pla.csv; wc -l /tmp/pla.csv; head -3 /tmp/pla.csv | cut -c1-400; tail -2 /tmp/pla.csv | cut -c1-300
          echo "=== cdx prefix"; curl -sSL -m 120 -A "$UA" "https://web.archive.org/cdx/search/cdx?url=travel.state.gov/content/travel/en/traveladvisories/traveladvisories/&matchType=prefix&output=txt&fl=original&collapse=urlkey&filter=statuscode:200&limit=400" | sed 's#.*/##' | sort -u | tr '\n' ' ' | cut -c1-3000
          echo; echo "=== cdx israel"; curl -sSL -m 120 -A "$UA" "https://web.archive.org/cdx/search/cdx?url=travel.state.gov/content/travel/en/traveladvisories/traveladvisories/israel-the-west-bank-and-gaza-travel-advisory.html&output=txt&fl=timestamp,digest&filter=statuscode:200&collapse=timestamp:6" | head -40 | tr '\n' ' '
          echo; echo "=== snapshot levels"
          for u in taiwan-travel-advisory.html; do for ts in 20190101 20220801 20240601 20260101; do curl -sSL -m 90 -A "$UA" "https://web.archive.org/web/${ts}id_/https://travel.state.gov/content/travel/en/traveladvisories/traveladvisories/$u" | python3 -c "
          import sys,re; t=sys.stdin.read(); print('$ts', len(t), re.findall(r'Level\s*[1-4]\s*:[^<\n]{0,40}', t)[:3], 'OD' if re.search('ordered departure',t,re.I) else '-')"; done; done
          echo "=== adsb tar traces"
          URL="https://github.com/adsblol/globe_history_2024/releases/download/v2024.06.15-planes-readsb-prod-0/v2024.06.15-planes-readsb-prod-0.tar.aa"
          python3 - "$URL" <<'PY'
          import sys, tarfile, gzip, json, urllib.request, time
          r = urllib.request.urlopen(sys.argv[1], timeout=120)
          t = tarfile.open(fileobj=r, mode="r|")
          n = 0; t0=time.time(); seen=0; mil=0; trace=0; kinds={}
          for m in t:
              seen+=1
              if not m.isfile():
                  kinds[m.type]=kinds.get(m.type,0)+1
                  continue
              if "trace" not in m.name:
                  continue
              trace+=1
              b = t.extractfile(m).read()
              try: b = gzip.decompress(b)
              except Exception: pass
              d = json.loads(b)
              if n < 2 or (d.get("dbFlags",0) & 1 and mil < 3):
                  print(m.name, m.size, {k:(v if k!='trace' else (len(v), v[:2])) for k,v in d.items()})
                  n += 1
              if d.get("dbFlags",0) & 1: mil+=1
              if time.time()-t0 > 100: break
          print("members", seen, "trace files", trace, "mil", mil, "nonfile types", kinds, "secs", round(time.time()-t0))
          PY
