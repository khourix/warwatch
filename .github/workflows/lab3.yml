name: lab3
# TEMPORARY, branch-only: base registry from OpenStreetMap on a GitHub runner (Overpass answers there). Removed before the PR.
on:
  push:
    branches: [claude/hopeful-heisenberg-tpy723]
    paths: ["lab/run3.sh", ".github/workflows/lab3.yml"]
permissions:
  contents: write
concurrency:
  group: lab3
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: bash lab/run3.sh
      - name: Commit the registry
        run: |
          git config user.name "warwatch-bot"
          git config user.email "warwatch-bot@users.noreply.github.com"
          git add warwatch/data/bases.json docs/BASES_REVIEW.md
          git diff --cached --quiet && exit 0
          git commit -qm "lab3: base registry from OpenStreetMap $(date -u +%FT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q origin claude/hopeful-heisenberg-tpy723 && git push -q origin HEAD:claude/hopeful-heisenberg-tpy723 && exit 0; sleep $((i*10)); done
