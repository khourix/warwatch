name: backfill
# History back-fills for the fast leading feeds (methodology review, phase 3). Public data only, written to backfill/data/.
# Dispatch with `source` = all or one of fred, nga, pla, state, firms, gfw, adsb. Safe to re-run: every job skips days it already has.
# This workflow never touches the live score. validate.py re-tests each series before it can get weight.
on:
  push:
    paths: ["backfill/run.txt"]     # a push that edits this file (one line: source [start] [end]) also starts a run; used before the workflow exists on main
  workflow_dispatch:
    inputs:
      source:
        description: "all | fred | nga | pla | wiki | forecasts | metaculus | senkaku | alerts | msa | gdeltwide | gdeltadd | history | state | firms | gfw | adsb | news"
        required: false
        default: "all"
      only:
        description: "history: comma-separated catalogue ids whose long history backtest.py fetch reads (blank = the sub-theatres'); state: one theatre group, e.g. iraq,gulf or lebanon,syria (blank = all); adsb: theatres to fill, e.g. lebanon,syria (blank = all, skipping days held); news: theatres among iraq, gulf, lebanon, syria (blank = all four)"
        required: false
        default: ""
      start:
        description: "first day (blank = each source's own default)"
        required: false
        default: ""
      end:
        description: "last day (blank = yesterday)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.p.outputs.src }}
      start: ${{ steps.p.outputs.start }}
      end: ${{ steps.p.outputs.end }}
      only: ${{ steps.p.outputs.only }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "src=${{ github.event.inputs.source || 'all' }}" >> $GITHUB_OUTPUT
            echo "start=${{ github.event.inputs.start }}" >> $GITHUB_OUTPUT
            echo "end=${{ github.event.inputs.end }}" >> $GITHUB_OUTPUT
            echo "only=${{ github.event.inputs.only }}" >> $GITHUB_OUTPUT
          else
            read -r a b c d < backfill/run.txt || true
            echo "src=${a:-all}" >> $GITHUB_OUTPUT; echo "start=$b" >> $GITHUB_OUTPUT; echo "end=$c" >> $GITHUB_OUTPUT; echo "only=$d" >> $GITHUB_OUTPUT
          fi
  quick:
    needs: plan
    env:
      START: ${{ needs.plan.outputs.start }}
      END: ${{ needs.plan.outputs.end }}
      SRC: ${{ needs.plan.outputs.src }}
    # FRED volatility indices, NGA warnings, Taiwan PLA counts, Wikipedia page views, outside forecasts, Israel alerts, China MSA warnings: minutes each
    if: contains(fromJSON('["all","fred","nga","pla","wiki","forecasts","metaculus","senkaku","alerts","msa"]'), needs.plan.outputs.src)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Back-fill
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          A=""; [ -n "$START" ] && A="$A --start $START"; [ -n "$END" ] && A="$A --end $END"
          if [ "$SRC" = senkaku ] || [ "$SRC" = all ]; then { sudo apt-get update -q >/dev/null && sudo apt-get install -y -q poppler-utils >/dev/null; } || echo "::warning::poppler-utils not installed"; fi
          for s in fred nga pla wiki forecasts metaculus senkaku alerts msa; do
            # msa reads every page of China's warning list (about an hour), so it runs only when asked for by name
            if { [ "$SRC" = all ] && [ "$s" != msa ]; } || [ "$SRC" = "$s" ]; then python3 backfill/backfill.py $s $A || echo "::warning::$s failed"; fi
          done
      - uses: ./.github/actions/commit-backfill
        if: always()
  gdeltwide:
    needs: plan
    # wider GDELT event types (docs/GDELTWIDE_PLAN.md): one year of daily files per job; only when asked for by name
    if: needs.plan.outputs.src == 'gdeltwide'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        year: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - name: Back-fill
        run: python3 backfill/backfill.py gdeltwide --start ${{ matrix.year }}-01-01 --end ${{ matrix.year }}-12-31
      - uses: ./.github/actions/commit-backfill
        if: always()
  gdeltadd:
    needs: plan
    # GDELT counts for countries added to config.GDELT_CC after the history file was built (Iraq and the Gulf states; Syria):
    # one year of daily files per job into backfill/data/gdelt_add/, then folded into the history file; only when asked for by name
    if: needs.plan.outputs.src == 'gdeltadd'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        year: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - name: Back-fill the added countries
        run: python3 warwatch/backfill.py gdelt-add "" ${{ matrix.year }}-01-01 ${{ matrix.year }}-12-31
      - uses: ./.github/actions/commit-backfill
        if: always()
  gdeltadd-merge:
    needs: [plan, gdeltadd]
    if: always() && !cancelled() && needs.plan.outputs.src == 'gdeltadd'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          git pull -q --rebase origin "$GITHUB_REF_NAME" || true
          python3 warwatch/backfill.py gdelt-merge
      - uses: ./.github/actions/commit-backfill
        with:
          paths: backtest/history/gdelt_country_day.csv.gz
  history:
    needs: plan
    # long histories (backtest/history) of catalogue series added after the last backtest fetch; blank `only` = the sub-theatres'
    if: needs.plan.outputs.src == 'history'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fetch long histories
        env:
          ONLY: ${{ github.event.inputs.only }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          ids="$ONLY"
          [ -n "$ids" ] || ids=$(python3 -c "import sys; sys.path.insert(0,'warwatch'); import catalog, config as C; print(','.join(s['id'] for s in catalog.SERIES if s['theatre'] in C.SUBTHEATRES))")
          python3 warwatch/backtest.py fetch "$ids"
      - uses: ./.github/actions/commit-backfill
        with:
          paths: backtest/history
  state:
    needs: plan
    env:
      START: ${{ needs.plan.outputs.start }}
      END: ${{ needs.plan.outputs.end }}
      SRC: ${{ needs.plan.outputs.src }}
    if: contains(fromJSON('["all","state"]'), needs.plan.outputs.src)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        group: ["ukraine,europe_east", "iran,yemen", "israel,drc", "taiwan,scs,korea", "southasia,libya,sudan", "venezuela", "iraq,gulf", "lebanon,syria"]
    steps:
      - uses: actions/checkout@v4
      - name: Back-fill advisories via Wayback
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ "$SRC" = state ] && [ -n "$ONLY" ] && [ "$ONLY" != "${{ matrix.group }}" ]; then echo "not asked for"; exit 0; fi
          A=""; [ -n "$START" ] && A="$A --start $START"; [ -n "$END" ] && A="$A --end $END"
          python3 backfill/backfill.py state "${{ matrix.group }}" $A
      - uses: ./.github/actions/commit-backfill
        if: always()
  firms:
    needs: plan
    env:
      START: ${{ needs.plan.outputs.start }}
      END: ${{ needs.plan.outputs.end }}
      SRC: ${{ needs.plan.outputs.src }}
    if: contains(fromJSON('["all","firms"]'), needs.plan.outputs.src)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 3     # the FIRMS key allows 5000 calls per 10 minutes across all jobs
      matrix:
        theatre: [ukraine, europe_east, iran, yemen, israel, korea, libya]
    steps:
      - uses: actions/checkout@v4
      - name: Back-fill fires
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          A=""; [ -n "$START" ] && A="$A --start $START"; [ -n "$END" ] && A="$A --end $END"
          python3 backfill/backfill.py firms ${{ matrix.theatre }} $A
      - uses: ./.github/actions/commit-backfill
        if: always()
  gfw:
    needs: plan
    env:
      START: ${{ needs.plan.outputs.start }}
      END: ${{ needs.plan.outputs.end }}
      SRC: ${{ needs.plan.outputs.src }}
    if: contains(fromJSON('["all","gfw"]'), needs.plan.outputs.src)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 2     # the GFW token is rate limited across all jobs
      matrix:
        theatre: [iran, yemen, israel, ukraine, taiwan, scs, korea, venezuela]
    steps:
      - uses: actions/checkout@v4
      - name: Back-fill vessel presence
        env:
          GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
        run: |
          A=""; [ -n "$START" ] && A="$A --start $START"; [ -n "$END" ] && A="$A --end $END"
          python3 backfill/backfill.py gfw ${{ matrix.theatre }} $A
      - uses: ./.github/actions/commit-backfill
        if: always()
  adsb:
    needs: plan
    env:
      START: ${{ needs.plan.outputs.start }}
      END: ${{ needs.plan.outputs.end }}
      SRC: ${{ needs.plan.outputs.src }}
      ONLY: ${{ needs.plan.outputs.only }}
    if: contains(fromJSON('["all","adsb"]'), needs.plan.outputs.src)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        # one job per quarter; each streams about 90 daily archives of ~2 GB without storing them
        period:
          - "2023-01-01 2023-03-31"
          - "2023-04-01 2023-06-30"
          - "2023-07-01 2023-09-30"
          - "2023-10-01 2023-12-31"
          - "2024-01-01 2024-03-31"
          - "2024-04-01 2024-06-30"
          - "2024-07-01 2024-09-30"
          - "2024-10-01 2024-12-31"
          - "2025-01-01 2025-03-31"
          - "2025-04-01 2025-06-30"
          - "2025-07-01 2025-09-30"
          - "2025-10-01 2025-12-31"
          - "2026-01-01 2026-03-31"
          - "2026-04-01 2026-06-30"
          - "2026-07-01 2026-12-31"
    steps:
      - uses: actions/checkout@v4
      - name: Back-fill military aircraft counts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -- ${{ matrix.period }}
          S="${START:-$1}"; E="${END:-$2}"
          # an explicit range runs only in the quarters it touches, clipped to them
          [[ "$S" < "$1" ]] && S="$1"; [[ "$E" > "$2" ]] && E="$2"
          if [[ "$S" > "$E" ]]; then echo "outside this quarter"; exit 0; fi
          export BACKFILL_DATA="$PWD/backfill/shards/$1"
          # ONLY (e.g. iraq,gulf) re-reads the archive for theatres added later; blank = every theatre, skipping days already held
          python3 -m pip install --quiet --break-system-packages orjson || true   # faster trace parsing for the flights pass; json works without it
          python3 backfill/backfill.py adsb "$ONLY" --start "$S" --end "$E"
      - uses: ./.github/actions/commit-backfill
        if: always()
  news:
    needs: plan
    env:
      START: ${{ needs.plan.outputs.start }}
      END: ${{ needs.plan.outputs.end }}
      ONLY: ${{ needs.plan.outputs.only }}
    # Google News headline counts per day for theatres whose live series keeps 150 days; one job per year and theatre, only when asked for by name
    if: needs.plan.outputs.src == 'news'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        theatre: [iraq, gulf, lebanon, syria]
        year: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - name: Back-fill headline counts
        run: |
          if [ -n "$ONLY" ] && [[ ",$ONLY," != *",${{ matrix.theatre }},"* ]]; then echo "not asked for"; exit 0; fi
          S="${START:-${{ matrix.year }}-01-01}"; E="${END:-${{ matrix.year }}-12-31}"
          [[ "$S" < "${{ matrix.year }}-01-01" ]] && S="${{ matrix.year }}-01-01"; [[ "$E" > "${{ matrix.year }}-12-31" ]] && E="${{ matrix.year }}-12-31"
          if [[ "$S" > "$E" ]]; then echo "outside this year"; exit 0; fi
          export BACKFILL_DATA="$PWD/backfill/shards/news-${{ matrix.theatre }}-${{ matrix.year }}"
          python3 backfill/backfill.py news ${{ matrix.theatre }} --start "$S" --end "$E"
      - uses: ./.github/actions/commit-backfill
        if: always()
  merge:
    # folds the quarter shards into backfill/data and writes backfill/COVERAGE.md
    needs: [plan, quick, state, firms, gfw, adsb, news]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          git pull -q --rebase origin "$GITHUB_REF_NAME" || true
          python3 backfill/backfill.py merge
          python3 backfill/backfill.py coverage > /dev/null
      - uses: ./.github/actions/commit-backfill
