name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe round 3
        run: |
          cat > p.py <<'PY'
          import json, re, time, urllib.request, urllib.parse
          H = {"User-Agent": "Mozilla/5.0 (compatible; warwatch research)"}
          def get(u, params=None, t=25):
              if params:
                  u += "?" + urllib.parse.urlencode(params)
              try:
                  return urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=t).read().decode("utf-8", "replace")
              except Exception as e:
                  return "ERR %s" % e
          print("=== PW services")
          t = get("https://services9.arcgis.com/weJ1QsnbMYJlCHdG/arcgis/rest/services", {"f": "json"})
          try:
              print([s["name"] for s in json.loads(t)["services"] if "ort" in s["name"] or "Chokepoint" in s["name"]])
          except Exception:
              print(t[:150])
          print("=== GNEWS variants")
          for q in ["Ukraine mobilization", "Ukraine mobilization when:7d", "Ukraine mobilization after:2026-09-01 before:2026-09-08"]:
              x = get("https://news.google.com/rss/search", {"q": q, "hl": "en-US", "gl": "US", "ceid": "US:en"})
              print(repr(q), len(re.findall("<item>", x)), re.findall("<pubDate>(.*?)</pubDate>", x)[:2], x[:60] if x.startswith("ERR") else "")
              time.sleep(4)
          print("=== BING news rss")
          x = get("https://www.bing.com/news/search", {"q": "Ukraine mobilization", "format": "rss"})
          print(len(re.findall("<item>", x)), re.findall("<pubDate>(.*?)</pubDate>", x)[:3], x[:80] if x.startswith("ERR") else "")
          print("=== EASA json")
          x = get("https://www.easa.europa.eu/en/domains/air-operations/czibs/export-json?page&_format=json")
          try:
              d = json.loads(x)
              print(type(d).__name__, len(d))
              rows = d if isinstance(d, list) else list(d.values())[0]
              print(json.dumps(rows[0])[:600] if rows else "")
              print(json.dumps(rows[1])[:300] if len(rows) > 1 else "")
          except Exception:
              print(x[:200])
          print("=== ADSB point")
          x = get("https://api.adsb.lol/v2/point/50.45/30.5/250")
          try:
              d = json.loads(x)
              ac = d["ac"]
              print(len(ac), d.get("total"), sum(1 for a in ac if "nac_p" in a), [a.get("nac_p") for a in ac[:10]])
          except Exception:
              print(x[:120])
          print("=== NGA dates sample")
          x = json.loads(get("https://msi.nga.mil/api/publications/broadcast-warn", {"output": "json", "status": "active", "navArea": "A"}))["broadcast-warn"]
          print(sorted(w["issueDate"][-8:] for w in x)[-8:])
          print([ (w["msgNumber"], w["msgYear"], w["subregion"]) for w in x[:3]])
          PY
          python3 p.py
