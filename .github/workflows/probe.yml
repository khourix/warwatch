name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe round 6
        run: |
          cat > p.py <<'PY'
          import csv, io, json, re, time, urllib.request, urllib.parse, datetime as dt, ssl
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def raw(u, params=None, data=None, t=40, hdr=None, ctx=None):
              if params:
                  u += "?" + urllib.parse.urlencode(params)
              h = {"User-Agent": UA, "Accept": "*/*"}; h.update(hdr or {})
              try:
                  return urllib.request.urlopen(urllib.request.Request(u, headers=h, data=data), timeout=t, context=ctx).read()
              except Exception as e:
                  return ("ERR %s" % e).encode()
          def txt(*a, **k):
              return raw(*a, **k).decode("utf-8", "replace")
          def sec(n): print("=== " + n, flush=True)
          sec("IODA structure")
          now = int(time.time())
          for days in (3, 14, 30, 60, 90):
              t = txt("https://api.ioda.inetintel.cc.gatech.edu/v2/signals/raw/country/IR", {"from": now - 86400 * days, "until": now, "datasource": "bgp"})
              try:
                  d = json.loads(t); print(days, "OK", len(t), str(d["data"])[:100])
                  if days == 3:
                      s0 = d["data"][0][0]; print({k: (v if k != "values" else (len(v), v[:4])) for k, v in s0.items()})
              except Exception as e:
                  print(days, "ERR", t[:120])
          for ds in ("ping-slash24", "merit-nt"):
              t = txt("https://api.ioda.inetintel.cc.gatech.edu/v2/signals/raw/country/IR", {"from": now - 86400 * 30, "until": now, "datasource": ds}); print(ds, len(t), t[:80])
          sec("GDELT verify")
          import zipfile, io
          from collections import Counter
          day = (dt.date.today() - dt.timedelta(days=3)).strftime("%Y%m%d")
          b = raw("http://data.gdeltproject.org/events/%s.export.CSV.zip" % day, t=90)
          z = zipfile.ZipFile(io.BytesIO(b)); rows = list(csv.reader(io.TextIOWrapper(z.open(z.namelist()[0]), encoding="utf-8", errors="replace"), delimiter="\t"))
          print(len(rows), rows[0][:4], rows[0][26:34], rows[0][49:57])
          c = Counter((r[51], r[28]) for r in rows if len(r) > 51 and r[51] in ("UP", "IR", "IS", "YM", "LE", "PL", "RS"))
          print(sorted((k, v) for k, v in c.items() if k[1] in ("15", "19", "13", "18")))
          print("older day", raw("http://data.gdeltproject.org/events/20260301.export.CSV.zip", t=90)[:4], len(raw("http://data.gdeltproject.org/events/20260301.export.CSV.zip", t=90)))
          sec("FRANKFURTER")
          for u in ["https://api.frankfurter.dev/v1/2026-09-01..?from=EUR&to=ILS,PLN,TRY,CZK", "https://api.frankfurter.app/2026-09-01..?from=EUR&to=ILS,PLN"]:
              t = txt(u); print(u, t[:200])
          sec("MARITIME")
          for u in ["https://www.ukmto.org/recent-incidents", "https://www.maritimeglobalsecurity.org/", "https://www.maritime.dot.gov/msci-advisories",
                    "https://www.ukmto.org/api/incidents", "https://gcaptain.com/feed/", "https://www.icc-ccs.org/index.php/piracy-reporting-centre/live-piracy-report"]:
              t = txt(u); print(u, len(t), t[:100].replace("\n", " "))
          PY
          python3 p.py
