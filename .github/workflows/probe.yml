name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
      ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe round 14
        run: |
          cat > p.py <<'PY'
          import os, sys, time
          sys.path.insert(0, "warwatch")
          import osint
          for name, boxes in {"gulf": [(22, 30, 48, 60)], "world": [(-85, 85, -179, 179)]}.items():
              try:
                  sh = osint.fetch_aisstream(os.environ["AISSTREAM_API_KEY"], boxes, seconds=25)
                  print("AIS", name, len(sh), [(s["n"], s["type"]) for s in list(sh.values())[:4]], "mil", [(s["n"], s["mmsi"]) for s in sh.values() if int(s["type"] or 0) in (35, 55)][:5])
              except Exception as e: print("AIS", name, "fail", e)
          PY
          python3 p.py
