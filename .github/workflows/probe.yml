name: probe
# Temporary (data-coverage Phase 1): checks live endpoints from a GitHub runner. Removed before the PR.
on:
  push:
    branches: [claude/project-thread-tuwdsd]
    paths: [probe/**, .github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Probe APIs
        env:
          GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 probe/phase1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: probe/*.json
