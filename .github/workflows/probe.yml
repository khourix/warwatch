name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: GDELT variants
        run: |
          set +e
          g() { echo "== $1"; sleep 8; curl -sL -m 60 -G "https://api.gdeltproject.org/api/v2/doc/doc" --data-urlencode "query=$2" --data-urlencode "mode=$3" --data-urlencode "format=json" --data-urlencode "timespan=$4" | head -c 500; echo; }
          g A 'Ukraine' timelinevolraw 3months
          g B '(Ukraine OR Kyiv OR Kharkiv) (mobilization OR offensive OR missile)' timelinevolraw 3months
          g C '(Ukraine OR Kyiv OR Kharkiv) (mobilization OR offensive OR missile)' timelinevol 3months
          g D 'Ukraine mobilization' timelinevolraw 1months
          g E 'Ukraine sourcelang:eng' timelinevolraw 3months
