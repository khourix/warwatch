name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe round 2
        run: |
          set +e
          H='User-Agent: Mozilla/5.0 (compatible; warwatch research)'
          echo "=== PORTWATCH ports"
          curl -sL -m 40 -G 'https://services9.arcgis.com/weJ1QsnbMYJlCHdG/arcgis/rest/services/Daily_Ports_Data/FeatureServer/0/query' --data-urlencode "where=portname LIKE '%Novorossiysk%'" --data-urlencode "outFields=*" --data-urlencode "resultRecordCount=2" --data-urlencode "orderByFields=date DESC" --data-urlencode "f=json" | python3 -c "
import sys,json
d=json.load(sys.stdin)
print([f['name'] for f in d.get('fields',[])])
for f in d.get('features',[])[:2]: print(f['attributes'])
"
          for n in Odesa Haifa 'Bandar Abbas' Sevastopol Eilat Aqaba Gdansk Klaipeda Tartus Latakia; do echo "-- $n"; curl -sL -m 30 -G 'https://services9.arcgis.com/weJ1QsnbMYJlCHdG/arcgis/rest/services/Daily_Ports_Data/FeatureServer/0/query' --data-urlencode "where=portname LIKE '%$n%'" --data-urlencode "outFields=portname,date" --data-urlencode "resultRecordCount=1" --data-urlencode "orderByFields=date DESC" --data-urlencode "f=json" | python3 -c "
import sys,json
d=json.load(sys.stdin); print([ (f['attributes']['portname'], f['attributes']['date']) for f in d.get('features',[])])"; done
          echo "=== NGA"
          for a in A P 12 4; do curl -sL -m 40 -H "$H" "https://msi.nga.mil/api/publications/broadcast-warn?output=json&status=active&navArea=$a" | python3 -c "
import sys,json
d=json.load(sys.stdin)['broadcast-warn']
print('area $a', len(d))
if d:
    print(sorted(d[0].keys()))
    import re
    for w in d[:60]:
        t=w.get('text','')
        if re.search(r'MISSILE|ROCKET|FIRING|GUNNERY|EXERCISE|GPS|MILITARY', t, re.I): print(w.get('navArea'),w.get('subregion'),w.get('issueDate'),t[:170].replace(chr(10),' '))
" | head -14; done
          echo "=== GOOGLE NEWS after/before"
          curl -sL -m 40 -H "$H" 'https://news.google.com/rss/search?q=Ukraine+mobilization+after:2026-09-01+before:2026-09-02&hl=en-US&gl=US&ceid=US:en' | python3 -c "
import sys,re
x=sys.stdin.read(); print(len(re.findall('<item>',x)), re.findall('<pubDate>(.*?)</pubDate>',x)[:3])"
          echo "=== EASA"
          curl -sL -m 40 -H "$H" 'https://www.easa.europa.eu/en/domains/air-operations/czibs' | python3 -c "
import sys,re
x=sys.stdin.read()
for m in re.findall(r'<a[^>]+href=\"(/en/document-library/czibs/[^\"]+)\"[^>]*>(.*?)</a>',x,re.S)[:12]: print(m[0], re.sub(r'<.*?>|\s+',' ',m[1]).strip()[:90])
print(len(x))"
          echo "=== POLY events"
          curl -sL -m 40 -H "$H" 'https://gamma-api.polymarket.com/public-search?q=Iran&limit_per_type=4&events_status=active' | python3 -c "
import sys,json
d=json.load(sys.stdin)
for e in d.get('events',[])[:4]:
    print(e.get('title'), e.get('closed'), e.get('endDate'))
    for m in e.get('markets',[])[:2]: print('   ',m.get('question'), m.get('outcomePrices'), m.get('closed'), m.get('volume'))"
