name: probe-history
on:
  push:
    branches: [claude/project-thread-2mgl2x]
    paths: [tools/probe_history.py, .github/workflows/probe.yml]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe_history.py
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
