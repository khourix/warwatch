name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Substack archive
        run: |
          set +e
          H='User-Agent: Mozilla/5.0 (compatible; warwatch)'
          curl -sL -m 40 -H "$H" "https://ajsignalnotnoise.substack.com/api/v1/archive?sort=new&limit=50" > a.json
          python3 - <<'PY'
          import json
          try: a=json.load(open('a.json'))
          except Exception as e: print("ERR",e); print(open('a.json').read()[:500]); raise SystemExit
          for p in a: print(p.get('post_date','')[:10], p.get('slug'), '|', p.get('title'), '|', (p.get('subtitle') or '')[:120])
          PY
