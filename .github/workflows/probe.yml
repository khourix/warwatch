name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe round 2
        run: |
          cat > p.py <<'PY'
          import json, re, urllib.request, urllib.parse
          H = {"User-Agent": "Mozilla/5.0 (compatible; warwatch research)"}
          def get(u, params=None):
              if params:
                  u += "?" + urllib.parse.urlencode(params)
              try:
                  return urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=40).read().decode("utf-8", "replace")
              except Exception as e:
                  return "ERR %s" % e
          PW = "https://services9.arcgis.com/weJ1QsnbMYJlCHdG/arcgis/rest/services/Daily_Ports_Data/FeatureServer/0/query"
          print("=== PORTWATCH")
          d = json.loads(get(PW, {"where": "portname LIKE '%Novorossiysk%'", "outFields": "*", "resultRecordCount": 2, "orderByFields": "date DESC", "f": "json"}))
          print([f["name"] for f in d.get("fields", [])])
          for f in d.get("features", [])[:2]:
              print(f["attributes"])
          for n in ["Odesa", "Haifa", "Bandar Abbas", "Sevastopol", "Eilat", "Aqaba", "Gdansk", "Klaipeda", "Tartus", "Latakia", "Ashdod", "Jebel Ali", "Constanta"]:
              d = json.loads(get(PW, {"where": "portname LIKE '%%%s%%'" % n, "outFields": "portname,date", "resultRecordCount": 1, "orderByFields": "date DESC", "f": "json"}))
              print(n, [(f["attributes"]["portname"], f["attributes"]["date"]) for f in d.get("features", [])])
          print("=== NGA")
          for a in ["A", "P", "12", "4", "N", "S"]:
              t = get("https://msi.nga.mil/api/publications/broadcast-warn", {"output": "json", "status": "active", "navArea": a})
              try:
                  w = json.loads(t)["broadcast-warn"]
              except Exception:
                  print(a, t[:100]); continue
              print("area", a, len(w), sorted(w[0].keys()) if w else "")
              k = 0
              for x in w:
                  tx = x.get("text", "")
                  if re.search(r"MISSILE|ROCKET|FIRING|GUNNERY|EXERCISE|GPS|MILITARY|MINE", tx, re.I) and k < 4:
                      k += 1
                      print("  ", x.get("subregion"), x.get("issueDate"), tx[:150].replace("\n", " "))
          print("=== GNEWS")
          x = get("https://news.google.com/rss/search", {"q": "Ukraine mobilization after:2026-09-01 before:2026-09-02", "hl": "en-US", "gl": "US", "ceid": "US:en"})
          print(len(re.findall("<item>", x)), re.findall("<pubDate>(.*?)</pubDate>", x)[:3], x[:120] if "ERR" in x[:5] else "")
          print("=== EASA")
          x = get("https://www.easa.europa.eu/en/domains/air-operations/czibs")
          for m in re.findall(r'<a[^>]+href="([^"]*czib[^"]*)"[^>]*>(.*?)</a>', x, re.S | re.I)[:12]:
              print(m[0], re.sub(r"<.*?>|\s+", " ", m[1]).strip()[:90])
          print("=== POLY")
          d = json.loads(get("https://gamma-api.polymarket.com/public-search", {"q": "Iran", "limit_per_type": 4}))
          for e in d.get("events", [])[:4]:
              print(e.get("title"), e.get("closed"), e.get("endDate"))
              for m in e.get("markets", [])[:2]:
                  print("   ", m.get("question"), m.get("outcomePrices"), m.get("closed"), m.get("volume"))
          PY
          python3 p.py
