name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
      ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
    steps:
      - name: Probe round 7
        run: |
          cat > p.py <<'PY'
          import gzip, json, re, time, urllib.request, urllib.parse, urllib.error
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def rawb(u, params=None, data=None, t=40, hdr=None):
              if params: u += "?" + urllib.parse.urlencode(params)
              h = {"User-Agent": UA, "Accept": "*/*"}; h.update(hdr or {})
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers=h, data=data), timeout=t); b = r.read()
                  return gzip.decompress(b) if b[:2] == b"\x1f\x8b" else b
              except urllib.error.HTTPError as e:
                  return ("HTTP %s %s" % (e.code, e.read()[:300])).encode()
              except Exception as e:
                  return ("ERR %s" % str(e)[:150]).encode()
          def txt(*a, **k): return rawb(*a, **k).decode("utf-8", "replace")
          def sec(n): print("=== " + n, flush=True)
          sec("UKMTO chunks")
          t = txt("https://www.ukmto.org/recent-incidents")
          srcs = re.findall(r'<script[^>]+src="(https://www.ukmto.org/_next/static/chunks/[^"]+)"', t)
          for u in srcs:
              c = txt(u)
              hits = sorted(set(re.findall(r'["\'`]((?:https?:)?//[^"\'`\s]*|/[a-zA-Z0-9_./-]*(?:api|incident|Incident|search|json)[a-zA-Z0-9_./?=&-]*)["\'`]', c)))
              hits = [h for h in hits if "w3.org" not in h and "reactjs" not in h and "github" not in h][:15]
              print(u.rsplit("/", 1)[-1], len(c), hits, "RecentIncident" in c)
          sec("war.gov article")
          for u in ["https://www.war.gov/News/Contracts/Contract/Article/4619270/contracts-for-oct-5-2026/", "https://www.defense.gov/News/Contracts/Contract/Article/4619270/contracts-for-oct-5-2026/"]:
              c = txt(u); print(u[:40], len(c), c[:150].replace("\n", " "))
          sec("routeset")
          d = json.loads(txt("https://api.adsb.lol/v2/sqk/7700"))
          print(len(d["ac"]))
          for a in d["ac"][:2]:
              body = json.dumps({"planes": [{"callsign": a.get("flight", "").strip(), "lat": a["lat"], "lng": a["lon"]}]}).encode()
              print(txt("https://api.adsb.lol/api/0/routeset", data=body, hdr={"Content-Type": "application/json"})[:300])
          sec("digitraffic gzip")
          t = txt("https://meri.digitraffic.fi/api/ais/v1/locations", hdr={"Accept-Encoding": "gzip", "Digitraffic-User": "warwatch"}); print(len(t), t[:200])
          v = txt("https://meri.digitraffic.fi/api/ais/v1/vessels", hdr={"Accept-Encoding": "gzip", "Digitraffic-User": "warwatch"}); print(len(v), v[:300])
          sec("gnews incident sample")
          x = txt("https://news.google.com/rss/search", {"q": "UKMTO when:14d", "hl": "en-US", "gl": "US", "ceid": "US:en"})
          its = re.findall(r"<item>.*?</item>", x, re.S); print(len(its)); print(its[0][:900] if its else x[:300])
          sec("OpenSky owner sample / adsb civil")
          t = txt("https://api.adsb.lol/v2/point/32/35/250"); print(len(t))
          PY
          python3 p.py
