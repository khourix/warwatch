name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
      ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
    steps:
      - name: Probe round 7
        run: |
          cat > p.py <<'PY'
          import json, os, re, time, urllib.request, urllib.parse, urllib.error
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def raw(u, params=None, data=None, t=40, hdr=None):
              if params: u += "?" + urllib.parse.urlencode(params)
              h = {"User-Agent": UA, "Accept": "*/*"}; h.update(hdr or {})
              try:
                  return urllib.request.urlopen(urllib.request.Request(u, headers=h, data=data), timeout=t).read()
              except urllib.error.HTTPError as e:
                  return ("HTTP %s %s" % (e.code, e.read()[:400])).encode()
              except Exception as e:
                  return ("ERR %s" % str(e)[:150]).encode()
          def txt(*a, **k): return raw(*a, **k).decode("utf-8", "replace")
          def sec(n): print("=== " + n, flush=True)
          sec("ACLED")
          em, pw = os.environ["ACLED_EMAIL"], os.environ["ACLED_PASSWORD"]
          r = txt("https://acleddata.com/oauth/token", data=urllib.parse.urlencode({"username": em, "password": pw, "grant_type": "password", "client_id": "acled"}).encode(), hdr={"Content-Type": "application/x-www-form-urlencoded"})
          tok = json.loads(r); at = tok["access_token"]; print("expires", tok.get("expires_in"))
          H = {"Authorization": "Bearer " + at, "Accept": "application/json"}
          for u, q in [("https://acleddata.com/api/acled/read", {"country": "Ukraine", "limit": 2}),
                       ("https://acleddata.com/api/acled/read", {"_format": "json", "limit": 2}),
                       ("https://acleddata.com/api/acled/read?_format=json&country=Ukraine&limit=2", None),
                       ("https://api.acleddata.com/acled/read", {"country": "Ukraine", "limit": 2}),
                       ("https://acleddata.com/api/acled/cast/read", {"limit": 2}),
                       ("https://acleddata.com/api/user/me", None)]:
              print(u, q, txt(u, q, hdr=H)[:400].replace("\n", " "))
          sec("UKMTO NEXT_DATA incident search")
          t = txt("https://www.ukmto.org/recent-incidents")
          m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', t, re.S); nd = m.group(1)
          print(len(nd)); print(sorted(set(re.findall(r'"componentName":"([^"]+)"', nd))))
          for k in ("incident", "Incident", "hodeidah", "2026"):
              for mm in list(re.finditer(k, nd))[:4]: print(k, nd[max(0, mm.start() - 150):mm.start() + 250].replace("\n", " "))
          bid = re.search(r'"buildId":"([^"]+)"', nd); print("buildId", bid and bid.group(1))
          print(sorted(set(re.findall(r'"(?:url|href|src)":"([^"]+)"', nd)))[:30])
          sec("UKMTO sitecore")
          for u in ["https://www.ukmto.org/sitecore/api/layout/render/jss?item=/recent-incidents&sc_lang=en&sc_apikey=", "https://www.ukmto.org/api/search", "https://www.ukmto.org/_next/data/%s/en/recent-incidents.json" % (bid.group(1) if bid else "x")]:
              print(u, txt(u)[:300].replace("\n", " "))
          t = txt("https://www.ukmto.org/_next/static/chunks/pages/%5B%5B...path%5D%5D-b606e86c9f7b2d2d.js")
          print(len(t), sorted(set(re.findall(r'["\'](/?[a-zA-Z0-9_/.-]*(?:api|incident)[a-zA-Z0-9_/.?=&-]*)["\']', t)))[:30])
          sec("MGS page")
          t = txt("https://www.maritimeglobalsecurity.org/"); print(re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", t))[:800])
          sec("USAspending POP totals")
          for loc in ("POL", "ISR", "JOR", "KWT", "QAT", "BHR", "ARE", "ROU", "LTU", "DJI", "OMN", "SAU", "TUR", "DEU"):
              f = {"time_period": [{"start_date": "2023-01-01", "end_date": "2026-10-01"}], "award_type_codes": ["A", "B", "C", "D"], "place_of_performance_locations": [{"country": loc}], "agencies": [{"type": "awarding", "tier": "toptier", "name": "Department of Defense"}]}
              t = txt("https://api.usaspending.gov/api/v2/search/spending_over_time/", data=json.dumps({"group": "month", "filters": f}).encode(), hdr={"Content-Type": "application/json"})
              try:
                  r = json.loads(t)["results"]; v = [round(x["aggregated_amount"] / 1e6, 1) for x in r]; print(loc, len(r), sum(v), v[-14:])
              except Exception: print(loc, t[:200])
          sec("DoD RSS")
          t = txt("https://www.defense.gov/DesktopModules/ArticleCS/RSS.ashx?ContentType=400&Site=945&max=10")
          print(re.findall(r"<title>(.*?)</title>", t)[:10]); print(re.sub(r"<[^>]+>", " ", t)[600:1800])
          sec("USNI middle east lines")
          t = txt("https://news.usni.org/category/fleet-tracker/feed")
          items = re.findall(r"<item>.*?</item>", t, re.S)
          print([re.findall(r"<title>(.*?)</title>", it)[0] for it in items[:6]])
          b = re.sub(r"<[^>]+>", " ", items[0]); b = re.sub(r"\s+", " ", b)
          for mm in re.finditer(r"In the ([A-Z][A-Za-z ]+?) (?=[A-Z])", b): print(mm.group(0)[:60])
          print([x for x in re.findall(r"USS +[A-Z][A-Za-z. ]+\([A-Z]+-\d+\)", b)][:30])
          for mm in list(re.finditer(r"(Arabian Sea|Mediterranean|Red Sea|Persian Gulf|Gulf of Oman|Baltic|North Sea)", b))[:8]: print("..." + b[max(0, mm.start() - 120):mm.start() + 160])
          sec("Digitraffic")
          t = txt("https://meri.digitraffic.fi/api/ais/v1/locations", hdr={"Accept": "application/json", "Digitraffic-User": "warwatch"}); print(len(t), t[:200])
          sec("GNEWS ukmto")
          t = txt("https://news.google.com/rss/search", {"q": "UKMTO incident vessel", "hl": "en-US", "gl": "US", "ceid": "US:en"})
          print([re.sub(r"<!\[CDATA\[|\]\]>", "", x)[:110] for x in re.findall(r"<title>(.*?)</title>", t)[:8]])
          PY
          python3 p.py
