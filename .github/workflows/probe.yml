name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe round 5
        run: |
          cat > p.py <<'PY'
          import csv, io, json, re, time, urllib.request, urllib.parse, datetime as dt, ssl
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def raw(u, params=None, data=None, t=40, hdr=None, ctx=None):
              if params:
                  u += "?" + urllib.parse.urlencode(params)
              h = {"User-Agent": UA, "Accept": "*/*"}; h.update(hdr or {})
              try:
                  return urllib.request.urlopen(urllib.request.Request(u, headers=h, data=data), timeout=t, context=ctx).read()
              except Exception as e:
                  return ("ERR %s" % e).encode()
          def txt(*a, **k):
              return raw(*a, **k).decode("utf-8", "replace")
          def sec(n): print("=== " + n, flush=True)
          sec("IODA structure")
          now = int(time.time())
          for cc in ("IR", "YE", "IL", "UA"):
              t = txt("https://api.ioda.inetintel.cc.gatech.edu/v2/signals/raw/country/%s" % cc, {"from": now - 86400 * 160, "until": now, "datasource": "bgp"})
              try:
                  d = json.loads(t); s = d["data"][0][0]
                  print(cc, {k: (v if k != "values" else (len(v), v[:6], v[-3:])) for k, v in s.items()})
              except Exception as e:
                  print(cc, "ERR", e, t[:300])
          sec("ASAM")
          for u in ["https://msi.nga.mil/api/publications/asam", "https://msi.nga.mil/api/publications/asam?output=json", "https://msi.nga.mil/api/publications/asam?output=json&sort=date&dateMin=2026-06-01",
                    "https://msi.nga.mil/api/publications/asam?output=json&dateMin=2026-06-01&dateMax=2026-10-06&navArea=A",
                    "https://msi.nga.mil/swagger/v1/swagger.json", "https://msi.nga.mil/api/swagger/v1/swagger.json", "https://msi.nga.mil/api/swagger.json"]:
              t = txt(u); print(u, len(t), t[:200].replace("\n", " "))
          sec("NOTAM")
          ctx = ssl.create_default_context(); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE
          for u in ["https://pilotweb.nas.faa.gov/PilotWeb/notamRetrievalByICAOAction.do?method=displayByICAOs&reportType=RAW&formatType=ICAO&retrieveLocId=OIIX&actionType=notamRetrievalByICAOs",
                    "https://notams.aim.faa.gov/notamSearch/", "https://safeairspace.net/iran/", "https://www.safeairspace.net/iran/",
                    "https://www.easa.europa.eu/en/domains/air-operations/czibs/czib-2026-09"]:
              t = txt(u, ctx=ctx); print(u[:90], len(t), t[:160].replace("\n", " "))
          sec("YAHOO")
          for s in ["LMT", "RHM.DE", "ILS=X", "UAH=X", "GC=F", "ITA", "^TA125.TA"]:
              t = txt("https://query1.finance.yahoo.com/v8/finance/chart/" + urllib.parse.quote(s), {"range": "3mo", "interval": "1d"})
              try:
                  r = json.loads(t)["chart"]["result"][0]; c = r["indicators"]["quote"][0]["close"]; print(s, len(c), c[-3:])
              except Exception:
                  print(s, t[:120].replace("\n", " "))
          sec("KALSHI market keys")
          d = json.loads(txt("https://api.elections.kalshi.com/trade-api/v2/events", {"limit": 200, "status": "open", "with_nested_markets": "true"}))
          for e in d["events"]:
              if re.search(r"Iran|Ukraine|Israel|Houthi|Russia|Taiwan|war|strike", e["title"], re.I):
                  m = e["markets"][0]; print(e["title"][:60], {k: m[k] for k in m if k in ("last_price", "last_price_dollars", "yes_bid", "yes_bid_dollars", "volume", "volume_fp", "liquidity")})
                  break
          sec("PIZZINT")
          d = json.loads(txt("https://www.pizzint.watch/api/dashboard-data"))
          print(list(d.keys())); x = d["data"]; print(len(x)); print({k: (v if k != "address" else "...") for k, v in x[0].items()})
          print({k: str(v)[:120] for k, v in d.items() if k != "data"})
          sec("TZEVAADOM")
          d = json.loads(txt("https://api.tzevaadom.co.il/alerts-history"))
          ts = [a["time"] for g in d for a in g["alerts"]]
          print(len(d), len(ts), dt.datetime.utcfromtimestamp(min(ts)), dt.datetime.utcfromtimestamp(max(ts)))
          PY
          python3 p.py
