name: probe
# Temporary (data-coverage Phase 1): checks live endpoints and new collectors from a GitHub runner. Removed before the PR.
on:
  push:
    branches: [claude/project-thread-tuwdsd]
    paths: [probe/**, .github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash probe/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: probe/out
