name: lab2
# TEMPORARY, branch-only: OSM fire sites on a GitHub runner (Overpass answers there). Removed before the PR.
on:
  push:
    branches: [claude/hopeful-heisenberg-tpy723]
    paths: ["lab/run2.sh", ".github/workflows/lab2.yml"]
permissions:
  contents: write
concurrency:
  group: lab2
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: bash lab/run2.sh
      - name: Commit fire_sites.csv
        run: |
          git config user.name "warwatch-bot"
          git config user.email "warwatch-bot@users.noreply.github.com"
          git add warwatch/data/fire_sites.csv
          git diff --cached --quiet && exit 0
          git commit -qm "lab2: fire sites with OpenStreetMap $(date -u +%FT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q origin claude/hopeful-heisenberg-tpy723 && git push -q origin HEAD:claude/hopeful-heisenberg-tpy723 && exit 0; sleep $((i*10)); done
