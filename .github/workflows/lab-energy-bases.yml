name: lab-energy-bases
# TEMPORARY (removed before the PR): energy-site fire replay and the base-watch radar backfill, run on this branch only.
on:
  push:
    branches: [claude/project-thread-szj3l8]
    paths: [.github/workflows/lab-energy-bases.yml]
permissions:
  contents: write
jobs:
  fires:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      FIRMS_ARCHIVE_CACHE: /tmp/firms-archive
    steps:
      - uses: actions/checkout@v4
      - run: python3 warwatch/fireref.py build
      - run: python3 warwatch/fireref.py cases 2>&1 | tee lab_cases.txt
      - run: python3 warwatch/fireref.py replay --from 2018-01-01
      - name: Commit replay and case log to the branch
        run: |
          git config user.name "warwatch-bot"; git config user.email "warwatch-bot@users.noreply.github.com"
          mkdir -p lab && mv lab_cases.txt lab/fire_cases.txt
          git add backfill/data/firecls lab
          git commit -qm "lab: energy-site fire replay"
          git reset -q --hard HEAD     # the rebuilt fire tables differ only in gzip timestamps
          for i in 1 2 3 4 5 6; do git pull --rebase -q origin claude/project-thread-szj3l8 && git push -q origin HEAD:claude/project-thread-szj3l8 && break; sleep $((i * 7)); done
