<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock">
<title>WarWatch: war early-warning dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9.5' fill='none' stroke='%235ad1f0' stroke-width='1.8' opacity='.6'/%3E%3Ccircle cx='12' cy='12' r='5' fill='none' stroke='%235ad1f0' stroke-width='1.8'/%3E%3Cpath d='M12 12L19 5' stroke='%235ad1f0' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16.6' cy='8.6' r='2' fill='%237ef0c0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:oklch(0.15 0 0); --panel:oklch(0.185 0.004 260); --panel2:oklch(0.225 0.005 260); --panel3:oklch(0.265 0.006 260);
  --line:oklch(0.3 0.006 260); --line2:oklch(0.4 0.01 255); --ink:oklch(0.96 0.004 250); --mute:oklch(0.74 0.01 255); --dim:oklch(0.6 0.01 255);
  --sel:oklch(0.27 0.03 215); --accent:oklch(0.83 0.13 205); --accent-ink:#04222b;
  --ocean:#0b0d11; --land:url(#gLand); --land-th:url(#gLandTh); --border:#3d4853; --border-th:#8fa1b0;
  --normal:#46c28a; --watch:#e5c04b; --elevated:#f08a3c; --critical:#f2545b; --na:#6b7280;
  --glass:rgba(22,24,28,.95);
  --mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --dh:200px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:14px;height:14px}
#app{display:flex;height:100%}
#col{flex:1;min-width:0;display:flex;flex-direction:column}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.lv{display:inline-flex;align-items:center;border-radius:999px;padding:1px 8px;font:600 10.5px/1.5 var(--sans);letter-spacing:.06em;color:#0b0b0c;background:var(--c);white-space:nowrap}
.info{display:inline-flex;width:15px;height:15px;border-radius:50%;border:1px solid var(--line2);color:var(--dim);font:600 9.5px/1 var(--sans);align-items:center;justify-content:center;cursor:help;flex:none;font-style:normal;text-transform:none;letter-spacing:0}
.info:hover{color:var(--ink);border-color:var(--accent)}
.hint{color:var(--mute);font-size:12px;line-height:1.5}
.up{color:var(--elevated)}.dn{color:var(--normal)}
.sp{flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:12.5px;background:var(--panel2);text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{padding:3px 10px;font-size:12px;color:var(--mute);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--sel);color:var(--ink)}
.chip{height:28px;border:1px solid var(--line);border-radius:999px;padding:0 11px;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);background:var(--panel2);white-space:nowrap}
.chip:hover{border-color:var(--line2);color:var(--ink)}
.chip.on{border-color:var(--accent);color:var(--ink);background:var(--sel)}
.chip b{font:500 10.5px var(--mono);color:var(--dim)}
.ty{font-size:10.5px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.ty.ld{border-color:oklch(0.55 0.1 205);color:var(--accent)}
.sh{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin:6px 0;display:flex;align-items:center;gap:6px}
.sh small{margin-left:auto;text-transform:none;letter-spacing:0;font-size:11px}
.empty{color:var(--mute);padding:14px 8px;font-size:12.5px}
.empty a{cursor:pointer}
.kv{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:5px 0;font-size:12.5px}
.kv span{color:var(--mute)}
.kv b{font-weight:600;text-align:right}

/* sidebar */
#sb{width:58px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:width .2s ease;position:relative;z-index:35}
#sb.open{width:224px}
.brand{height:52px;display:flex;align-items:center;gap:10px;padding:0 17px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;cursor:pointer;flex:none}
.brand svg{flex:none}
.brand b{font-weight:700;letter-spacing:.2em;font-size:12.5px}
.brand b span{color:var(--accent)}
#sb:not(.open) .brand b,#sb:not(.open) .tx,#sb:not(.open) .grp,#sb:not(.open) .sc,#sb:not(.open) .kids{display:none}
#sbnav{flex:1;min-height:0;padding:8px;display:flex;flex-direction:column;gap:2px;overflow:hidden auto;scrollbar-width:none}
.ni{display:flex;align-items:center;gap:10px;height:34px;padding:0 9px;border-radius:8px;color:var(--mute);white-space:nowrap;width:100%;text-align:left;position:relative;flex:none}
.ni:hover{background:var(--panel2);color:var(--ink)}
.ni.on{background:var(--sel);color:var(--accent)}
.ni .tx{flex:1;overflow:hidden;text-overflow:ellipsis}
.ni .sc{font:500 11px var(--mono);color:var(--dim)}
.ni .alarm{position:absolute;left:24px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--critical);border:1.5px solid var(--panel)}
#sb.open .ni .alarm{left:auto;right:10px;top:13px}
.code{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--c);display:flex;align-items:center;justify-content:center;font:600 8.5px var(--mono);letter-spacing:.02em;color:var(--ink);flex:none}
#sb.open .code{width:9px;height:9px;border-radius:50%;background:var(--c);font-size:0;border:0;margin:0 6px 0 7px}
.grp{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:10px 10px 3px;white-space:nowrap}
.kids{margin:0 0 4px 22px;border-left:1px solid var(--line);padding-left:6px;display:flex;flex-direction:column;gap:1px}
.kids .ni{height:28px;font-size:12.5px}
.sbf{border-top:1px solid var(--line);padding:8px;flex:none}
#sbtip{position:fixed;z-index:60;background:#0a0b0d;border:1px solid var(--line2);border-radius:7px;padding:4px 9px;font-size:12px;white-space:nowrap;display:none;pointer-events:none}

/* top bar */
header#top{height:52px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:30}
.ttl{min-width:0;max-width:240px}
.ttl h1{margin:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gti{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);flex:none}
.gti:hover,.gti.on{border-color:var(--line2);background:var(--panel3)}
.gti small{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:block;line-height:1.1;text-align:left}
.gti b{font:600 17px/1.2 var(--mono);display:block;text-align:left}
.gti .us{color:var(--dim);font-size:11.5px;white-space:nowrap}
#search{position:relative;width:250px;flex:none}
#search input{width:100%;height:34px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:0 30px 0 32px;outline:none}
#search input:focus{border-color:var(--accent)}
#search input::-webkit-search-cancel-button{display:none}
#search .ic{position:absolute;left:10px;top:10px;color:var(--dim)}
#search kbd{position:absolute;right:8px;top:8px;font:11px var(--mono);color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 5px;pointer-events:none}
#search input:focus+kbd,#search input:not(:placeholder-shown)+kbd{display:none}
#results{position:absolute;right:0;top:42px;width:440px;max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:10px;display:none;z-index:45;box-shadow:0 12px 40px #000a}
#results h6{margin:0;padding:8px 12px 3px;font-size:10.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
#results .r{padding:6px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
#results .r:hover,#results .r.on{background:var(--panel2)}
#results .r small{color:var(--dim);white-space:nowrap}
.upd{font-size:11px;color:var(--dim);text-align:right;line-height:1.3;white-space:nowrap}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;justify-content:center;position:relative;color:var(--mute);flex:none}
.iconbtn:hover,.iconbtn.on{color:var(--ink);border-color:var(--line2)}
.badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:10px;background:var(--critical);color:#fff;font:700 10.5px/15px var(--mono);text-align:center;padding:0 4px;border:2px solid var(--panel)}
.demo{background:#5b1e1e;color:#ffd6d6;border-radius:4px;padding:1px 7px;font-weight:700;font-size:11px}

/* pop-ups and tooltips */
#pop{position:fixed;z-index:50;background:var(--glass);border:1px solid var(--line2);border-radius:12px;box-shadow:0 18px 50px #000b;backdrop-filter:blur(8px);display:none;max-height:calc(100vh - 70px);flex-direction:column;overflow:hidden}
#pop.on{display:flex}
.ph{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;gap:10px;flex:none}
.ph h4{margin:0;font-size:13.5px;font-weight:600}
.ph small{color:var(--dim)}
.pb{padding:0 14px 12px;overflow:auto;scrollbar-width:thin}
.pf{border-top:1px solid var(--line);padding:8px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex:none}
.tabsm{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);flex:none}
.tabsm button{padding:7px 8px;font-size:12px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabsm button.on{color:var(--ink);border-color:var(--accent)}
.nl{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:9px 14px;border-top:1px solid var(--line);align-items:start;cursor:pointer}
.nl:hover{background:var(--panel2)}
.nl .ib{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:color-mix(in oklab,var(--c) 22%,transparent);color:var(--c)}
.nl b{font-weight:500;font-size:12.5px;display:block}
.nl.read b{color:var(--mute)}
.nl small{color:var(--dim);font-size:11.5px;display:block}
.nl time{font-size:11px;color:var(--dim);white-space:nowrap;text-align:right}
.nl time span{display:block;color:var(--mute)}
.unread{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;margin:0 6px 1px 0}
.wf{display:grid;grid-template-columns:minmax(0,1fr) 120px 52px;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.wf>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf .bar{height:8px;background:var(--panel3);border-radius:3px;position:relative;overflow:hidden}
.wf .bar i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--elevated)}
.wf b{text-align:right;font:600 12px var(--mono)}
.wf.t{border-top:1px solid var(--line);margin-top:4px;padding-top:7px;font-weight:600}
#tip{position:fixed;z-index:70;pointer-events:none;background:#0a0b0d;border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.45;max-width:320px;display:none;box-shadow:0 6px 18px #000a;color:#d6dbe0}
#tip b{color:var(--ink)}

/* map */
main{flex:1;min-height:0;display:flex;position:relative}
#mapwrap{position:relative;flex:1;min-width:0;background:var(--ocean);overflow:hidden}
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none}
#map.drag{cursor:grabbing}
.c{fill:var(--land);stroke:var(--border);stroke-width:.8px;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer}
.c.th{fill:var(--land-th);stroke:var(--border-th);stroke-width:1.4px}
.c:hover{fill:url(#gHover)}
.c.a2{fill:url(#pA2)}.c.a3{fill:url(#pA3)}.c.a4{fill:url(#pA4)}
.c.th.a2{fill:url(#pTA2)}.c.th.a3{fill:url(#pTA3)}.c.th.a4{fill:url(#pTA4)}
.lab{font-weight:600;fill:#b9c3cc;paint-order:stroke;stroke:url(#gInk);stroke-linejoin:round;pointer-events:none;text-anchor:middle;letter-spacing:.01em}
.lab.city{text-anchor:start;fill:#e6d9ae;font-weight:500}
.lab.sea{fill:#5f7b93;font-style:italic;font-weight:500}
.cityd{fill:#e6d9ae;stroke:url(#gInk);stroke-width:1.5px}
.mk{cursor:pointer}
.mk:hover .sc{filter:brightness(1.5)}
.hub{fill:none;stroke:#5fb4d8;stroke-width:1.2px;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:visibleStroke;cursor:pointer;opacity:.8}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
.pulse{animation:pulse 1.9s ease-out infinite;transform-box:fill-box;transform-origin:center}
#pins{position:absolute;inset:0;pointer-events:none;z-index:5}
.pdot{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--c);border:2px solid #0b0d11;pointer-events:auto;cursor:pointer}
.pdot.w{animation:pd 2s ease-out infinite}
@keyframes pd{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--c) 70%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.plab{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:999px;background:rgba(14,16,19,.93);border:1px solid var(--c);white-space:nowrap;font-size:12px;pointer-events:auto;cursor:pointer;box-shadow:0 2px 10px #0008}
.plab:hover,.plab.hl{background:#1d2228;box-shadow:0 0 0 3px color-mix(in oklab,var(--c) 35%,transparent);z-index:2}
.plab b{font:600 12.5px var(--mono)}
.plab span{color:var(--mute)}
.pline{position:absolute;left:0;top:0;height:1px;background:var(--c);transform-origin:0 50%;opacity:.7}
#hcard{position:absolute;z-index:20;width:350px;background:var(--glass);border:1px solid var(--line2);border-radius:12px;box-shadow:0 18px 50px #000b;backdrop-filter:blur(8px);padding:12px 14px;display:none}
#hcard .top{display:flex;align-items:center;gap:8px}
#hcard h3{margin:0;font-size:15px;flex:1}
.big{display:flex;align-items:baseline;gap:8px;margin:6px 0 2px;flex-wrap:wrap}
.big b{font:600 26px var(--mono)}
.big small{color:var(--mute)}
#hcard p{margin:6px 0;color:#c3c9cf;font-size:12.5px}
.mini{display:grid;grid-template-columns:1fr auto auto;gap:3px 12px;font-size:12px;margin:8px 0;align-items:center}
.mini .h{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.mini .r{text-align:right}
.drv{margin:4px 0;display:grid;gap:4px}
.drv div{display:grid;grid-template-columns:minmax(0,1fr) 80px;gap:8px;align-items:center;font-size:12px;color:#c9cfd5}
.drv span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drv u{display:block;height:6px;border-radius:3px;background:var(--panel3);position:relative;overflow:hidden;text-decoration:none}
.drv u i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.rail{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:8}
.rail button{width:38px;height:38px;border-radius:10px;background:var(--glass);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mute);position:relative}
.rail button:hover,.rail button.on{color:var(--ink);border-color:var(--line2)}
.rail .cnt{position:absolute;right:-5px;top:-5px;background:var(--accent);color:var(--accent-ink);font:700 9.5px/14px var(--mono);border-radius:7px;padding:0 4px}
.rail .sepr{height:1px;background:var(--line);margin:2px 6px}
.zoom{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:8}
.zoom button{width:34px;height:34px;border-radius:9px;background:var(--glass);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--mute)}
.zoom button:hover{color:var(--ink);border-color:var(--line2)}
.lrow{display:grid;grid-template-columns:20px 1fr auto 30px;gap:8px;align-items:center;padding:5px 14px;font-size:12.5px;cursor:pointer}
.lrow:hover{background:var(--panel2)}
.lrow small{color:var(--dim);font:11px var(--mono)}
.lrow.dis{opacity:.45}
.tog{width:28px;height:16px;border-radius:8px;background:var(--panel3);position:relative;border:1px solid var(--line)}
.tog:after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--dim);transition:left .15s}
.tog.on{background:color-mix(in oklab,var(--accent) 40%,var(--panel3));border-color:var(--accent)}
.tog.on:after{left:14px;background:var(--ink)}
.lgrp{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:8px 14px 2px}
.lkey{display:grid;grid-template-columns:20px 1fr;gap:5px 8px;align-items:center;font-size:12px;color:var(--mute);padding:4px 14px 8px}
.lkey .off{opacity:.35;text-decoration:line-through}
.lkey [data-cls]{cursor:pointer}
.ramp{height:8px;border-radius:4px;background:linear-gradient(90deg,#fff3b0,#ffb340 25%,#ff6a2b 55%,#b3261e 80%,#5a1612);margin:6px 0 3px}
.rampl{display:flex;justify-content:space-between;font:10.5px var(--mono);color:var(--dim)}
#card{position:absolute;right:12px;top:12px;width:340px;max-height:calc(100% - 24px);overflow:auto;background:var(--glass);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;display:none;font-size:13px;z-index:15;box-shadow:0 18px 50px #000b}
#card h3{margin:0 24px 2px 0;font-size:15px}
#card .sub{color:var(--mute);font-size:12px;margin-bottom:6px;display:block}
#card .x{position:absolute;right:10px;top:6px;font-size:22px;color:var(--mute)}
#card p{margin:8px 0;color:#bcc3ca}
#card .flag{background:#3a1416;border:1px solid #8c2a2f;color:#ffc9cb;border-radius:6px;padding:4px 8px;margin:6px 0;font-weight:600}
#card .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.agebar{display:flex;align-items:center;gap:8px;margin:6px 0}
.agebar i{width:12px;height:12px;border-radius:50%;flex:none}

/* dock */
#dock{position:absolute;left:62px;right:58px;bottom:12px;z-index:9;display:none;grid-template-columns:1.05fr 1fr 1fr;gap:10px}
#dock.on{display:grid}
.dk{background:var(--glass);border:1px solid var(--line);border-radius:12px;min-width:0;display:flex;flex-direction:column;height:var(--dh)}
#dock.min .dk{height:auto}
#dock.min .dc{display:none}
.dk .dh{display:flex;align-items:center;gap:7px;padding:9px 12px 6px;font-size:12.5px;font-weight:600;flex:none}
.dk .dh small{color:var(--dim);font-weight:400;margin-left:auto;font-size:11px;white-space:nowrap}
.dk .dc{overflow:auto;padding:0 6px 8px;scrollbar-width:thin;flex:1;min-height:0}

  if (sub === 'display') {
    const seg = (k, opts, cur) => `<span class="seg">${opts.map(([v, n]) => `<button class="${String(cur) === String(v) ? 'on' : ''}" data-set="${k}" data-v="${v}">${n}</button>`).join('')}</span>`;
    const row = (n, ctl, hint) => `<div class="setrow"><span>${n}</span>${ctl}<span class="hint">${hint}</span></div>`;
    body = `<div class="setscroll">${row('Main number', seg('lead', [['p', '30-day chance'], ['score', 'Signal pressure']], pref.lead), 'The number on the map, in the sidebar and in lists.')}
      ${row('Map label size', seg('lbl', [[0.9, 'Small'], [1, 'Medium'], [1.25, 'Large']], pref.lbl), 'Country, city and ship names on the map.')}
      ${row('Time window', seg('win', [[24, '24 h'], [48, '48 h'], [168, '7 days']], pref.win), 'Fires and maritime incidents on the map.')}
      ${row('Motion', seg('rm', [['0', 'On'], ['1', 'Reduced']], document.body.classList.contains('rm') ? '1' : '0'), 'Pulses and map animation.')}
      ${row('Sidebar at start', seg('sb', [['open', 'Open'], ['min', 'Collapsed']], pref.sb || (innerWidth >= 1600 ? 'open' : 'min')), 'You can also use the button at the bottom of the sidebar.')}
      ${row('Overview panels', seg('dock', [['open', 'Open'], ['min', 'Collapsed']], pref.dock), 'The theatre, mover and market panels under the world map.')}</div>`;
  } else if (sub === 'health') {
    const ks = (t, v, s, col) => `<div class="ks"><small>${t}</small><b style="color:${col || 'var(--ink)'}">${v}</b><span>${s}</span></div>`;
    const keys = Array.from(new Set(D.series.filter(s => s.st === 'awaiting_key').flatMap(s => s.needs || [])));
    const list = iss.filter(i => (HF.chip === 'all' || i.k === HF.chip) && (!HF.q || ((i.s ? i.s.l + ' ' + thName(i.s.t) : '') + ' ' + i.det).toLowerCase().includes(HF.q.toLowerCase())));
    const col = {error: 'var(--critical)', stale: 'var(--watch)', awaiting_key: 'var(--elevated)', collecting: 'var(--mute)'};
    body = `<div class="hs">${ks('Have a score', st.ok || 0, 'of ' + D.series.length + ' signals', 'var(--normal)')}${ks('Collecting history', st.collecting || 0, 'they get a score later', 'var(--watch)')}${ks('Need a key', st.awaiting_key || 0, keys.length + ' free key' + (keys.length === 1 ? '' : 's') + ' missing', st.awaiting_key ? 'var(--elevated)' : null)}${ks('Failed this run', (st.error || 0) + (D.errors || []).length, 'the next run tries again', st.error || (D.errors || []).length ? 'var(--critical)' : null)}${ks('Stale copy', cnt.stale || 0, 'last good copy shown', cnt.stale ? 'var(--watch)' : null)}</div>
      <div class="toolbar" style="margin:0">${[['all', 'All issues', iss.length], ['error', 'Failed', cnt.error || 0], ['stale', 'Stale', cnt.stale || 0], ['awaiting_key', 'Need a key', cnt.awaiting_key || 0], ['collecting', 'Collecting', cnt.collecting || 0]].map(([k, n, c]) => `<button class="chip ${HF.chip === k ? 'on' : ''}" data-hchip="${k}">${n}<b>${c}</b></button>`).join('')}<span class="sp"></span><label class="inp" style="width:240px">${ic('search', 's')}<input id="hq" type="search" placeholder="Filter issues" value="${esc(HF.q)}" aria-label="Filter issues"></label></div>
      <div class="tbl" style="flex:1"><table class="t"><thead><tr><th>Signal</th><th>Theatre</th><th>Issue</th><th>Detail</th><th>What to do</th></tr></thead><tbody>${list.map(i => `<tr ${i.s ? `data-open="${esc(i.s.id)}"` : ''}><td class="n">${i.s ? esc(i.s.l) + (i.s.s ? `<small>${esc(i.s.s)}</small>` : '') : 'Map layer'}</td><td>${i.s ? esc(thName(i.s.t)) : '–'}</td><td><span class="ty" style="color:${col[i.k]}">${esc(i.iss)}</span></td><td style="white-space:normal;color:var(--mute);max-width:280px">${esc(i.det)}</td><td style="white-space:normal;color:var(--mute);max-width:300px">${esc(i.fix)}</td></tr>`).join('') || `<tr><td colspan="5" class="empty">No issue matches.</td></tr>`}</tbody></table></div>`;
  } else if (sub === 'sources') {
    body = `<div class="tbl" style="flex:1"><table class="t"><thead><tr><th>Source</th><th>How often</th><th>Why that is enough, and the free limit</th></tr></thead><tbody>${(D.updates || []).map(u => `<tr style="cursor:default"><td class="n"><b style="font-weight:600">${esc(u.s)}</b></td><td>${esc(u.e)}</td><td style="white-space:normal;color:var(--mute)">${esc(u.l)}</td></tr>`).join('')}</tbody></table></div>`;
  } else if (sub === 'method') {
    const G = (D.model || {}).gates || {};
    body = `<div class="setscroll prose"><h3>1. Each signal against its own history</h3><p>WarWatch compares each signal with its own past. For daily data, the latest 7-day average is compared with the 7-day averages of the previous year. The last 30 days are left out of that comparison, so a slow build-up does not hide itself. When less than 120 days of history are available, the last 90 days are used. Monthly data is compared with the previous 36 months, with the usual month-to-month pattern removed.</p>
      <h3>2. Distance from normal</h3><p>The distance is a modified z-score: <span class="kw">0.6745 × (value − median) / MAD</span>. It is limited to ±5, so one bad value cannot control the result. Only movement in the warning direction counts. A calm signal never cancels an alarm in another signal. 2 SD or more is unusual; 3 SD or more is a strong signal.</p>
      <h3>3. One event counts one time</h3><p>Signals that move together (their recent changes correlate above 0.8) are averaged into one. Late data (published weeks or months after the fact) counts at 25%, because the aim is early warning.</p>
      <h3>4. Signal groups and signal pressure</h3><p>Each of the five groups (Logistics, Markets, People, Physical, News) combines its strongest signals with an ordered weighted average (orness 0.7). The strongest evidence gets the most weight. The groups are combined with the theatre's weights into one index (Mazziotta-Pareto). A profile where one group is very high reads higher than an even profile. This gives the <b>signal pressure</b> from 0 to 100: 50 is the Watch line and 90 is the Critical line. These lines are the top 10% and the top 1% of a simulated calm world.</p>
      <h3>5. The 30-day chance</h3><p>${D.model ? `A fitted model (v${esc(D.model.v)}, fitted ${esc(D.model.fitted)}) turns the signals and the conflict history of each theatre into the chance of a qualifying event in the next 30 days. It starts from the long-run rate of the theatre. Each signal family then moves the chance. ${PM ? `The model sets the levels: <b>Watch</b> from ${pct(BANDS[0])}, <b>Elevated</b> from ${pct(BANDS[1])}, <b>Critical</b> from ${pct(BANDS[2])}.` : 'The model runs in shadow mode now. The levels come from the signal pressure.'} On past theatre-months the model has a test AUC of ${G.auc != null ? G.auc.toFixed(2) : 'n/a'}${G.auc_lo != null ? ` (range ${G.auc_lo.toFixed(2)} to ${G.auc_hi.toFixed(2)})` : ''}. 0.5 is a coin flip.` : 'No fitted model is available in this build. The levels come from the signal pressure.'}</p>
      <h3>6. Why the chance and the pressure can disagree</h3><p>Signal pressure shows how unusual the signals are. The chance also asks whether signals like these came before events in the past. A theatre can have high pressure and a low chance. When this occurs, the theatre page tells you.</p>
      <h3>7. Regions and the world</h3><p>A region shows the highest level of its theatres, so one crisis is not averaged away. The chance for any theatre combines all theatres. The theatres move together, so this value is an upper limit.</p>
      <h3>8. Labels</h3><ul><li><b>Lagging only:</b> only late data is unusual. It shows a build-up that already started. It is not an early warning.</li><li><b>Coverage:</b> the share of signals that have a score now. Low coverage makes the result less certain.</li></ul>
      <p>The full method: <a href="https://github.com/khourix/warwatch/blob/main/docs/METHODOLOGY.md" target="_blank" rel="noopener">METHODOLOGY.md</a> and <a href="https://github.com/khourix/warwatch/blob/main/docs/MODEL.md" target="_blank" rel="noopener">MODEL.md</a>.</p>
      <h3>Reading the map</h3><ul><li>Hover a pin to see the chance and its causes. Click it to open the theatre.</li><li>Click an aircraft, ship, incident, fire or warning for details. Click a country to open its theatre.</li><li>Use the buttons at the top left of the map for layers, the legend, the time window and the label size.</li><li>Press <span class="kw">/</span> to search everything.</li></ul></div>`;
  } else {
    body = `<div class="setscroll prose">${D.unavailable.map(u => `<h3>${esc(u.n)}</h3><p>${esc(u.w)}</p>`).join('')}</div>`;
  }
  P.innerHTML = `<div class="set"><div class="setnav">${tabs.map(([k, n, icn, b, red]) => `<button class="${sub === k ? 'on' : ''}" data-nav="settings/${k}">${ic(icn, 's')}${n}${b ? `<b class="${red ? 'bad' : ''}">${b}</b>` : ''}</button>`).join('')}</div><div class="setb">${body}</div></div>`;
}
$('#pg-settings').addEventListener('click', e => {
  const n = e.target.closest('[data-nav]'); if (n) { nav(n.dataset.nav); return; }
  const c = e.target.closest('[data-hchip]'); if (c) { HF.chip = c.dataset.hchip; renderSettings(); return; }
  const o = e.target.closest('[data-open]'); if (o) { openModal(o.dataset.open, []); return; }
  const s = e.target.closest('[data-set]'); if (!s) return;
  const k = s.dataset.set, v = s.dataset.v;
  if (k === 'lead') { pref.lead = v; store.set('ww_lead', v); RANK.sort((a, b) => RANKL[D.theatres[b].level] - RANKL[D.theatres[a].level] || lead(b).v - lead(a).v); renderSB(); }
  if (k === 'lbl') { pref.lbl = +v; store.set('ww_lbl', v); }
  if (k === 'win') { pref.win = +v; store.set('ww_win', v); if (M) syncLayers(); }
  if (k === 'rm') { document.body.classList.toggle('rm', v === '1'); store.set('ww_rm', v); }
  if (k === 'sb') { pref.sb = v; store.set('ww_sb', v); $('#sb').classList.toggle('open', v === 'open'); renderSB(); }
  if (k === 'dock') { pref.dock = v; store.set('ww_dock', v); }
  renderSettings();
});
$('#pg-settings').addEventListener('input', e => { if (e.target.id === 'hq') { HF.q = e.target.value; const pos = e.target.selectionStart; renderSettings(); const q = $('#hq'); q.focus(); q.setSelectionRange(pos, pos); } });

/* ------------------------------------------------------------ start */
if (D.demo) $('#demo').hidden = false;
buildMap(); renderRail();
route(true);
</script>
<script>
// pick up the 30-minute rebuilds without a manual reload (only when the tab is visible and no detail view or pop-up is open)
const T0 = Date.now();
setInterval(() => { try { if (!document.hidden && document.getElementById('modal').style.display !== 'flex' && !document.querySelector('#pop.on') && Date.now() - T0 > 25 * 60e3) location.reload(); } catch (e) {} }, 60e3);
</script>
</body>
</html>
