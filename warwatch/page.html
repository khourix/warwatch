<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warwatch: war early-warning dashboard</title>
<style>
:root{
  --bg:#070b10; --panel:#0d141b; --panel2:#121b24; --line:#223140; --ink:#e6edf3; --mute:#8b9db0; --dim:#5d7083;
  --ocean:#0a1622; --land:#17232f; --land-th:#1f3144; --border:#6f8aa3; --border-th:#a9c7e2;
  --alert:#ff4d4f; --warn:#ff8a1f; --watch:#f5c518; --ok:#3ddc84; --na:#6b7a8a; --accent:#58a6ff;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
header{height:52px;flex:none;display:flex;align-items:center;gap:18px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.14em;font-size:15px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
nav{display:flex;gap:2px;flex:1;overflow:hidden}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:14px 11px 11px;color:var(--mute);font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:7px}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
nav .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.meta{color:var(--mute);font-size:12px;white-space:nowrap;text-align:right}
.demo{background:#5b1e1e;color:#ffd6d6;border-radius:4px;padding:1px 7px;margin-right:8px;font-weight:700}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 430px}
#mapwrap{position:relative;min-width:0;min-height:0;background:var(--ocean);overflow:hidden}
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none}
#map.drag{cursor:grabbing}
.c{fill:var(--land);stroke:var(--border);stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer;transition:fill .12s}
.c.th{fill:var(--land-th);stroke:var(--border-th);stroke-width:1.5px}
.c:hover{fill:#2c4560}
.c.a2{fill:#3a3a22}.c.a3{fill:#4d3418}.c.a4{fill:#561f24}
.c.th.a2{fill:#47472a}.c.th.a3{fill:#5e3f1c}.c.th.a4{fill:#6b2429}
.lab{font-weight:600;fill:#c8d6e4;paint-order:stroke;stroke:#050a0f;stroke-width:3px;stroke-linejoin:round;pointer-events:none;text-anchor:middle}
.lab.big{fill:#ffffff;font-weight:700}
.cityd{fill:#e6edf3;stroke:#05080c;stroke-width:1.5px}
.citylab{fill:#d5e2ee;font-size:11px;paint-order:stroke;stroke:#05080c;stroke-width:3px;pointer-events:none}
.mk{cursor:pointer}
.mk:hover .sc{filter:brightness(1.5)}
.hub{fill:none;stroke:#7dd3fc;stroke-width:1.2px;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:visibleStroke;cursor:pointer}
.pin text{fill:#fff;font-weight:700;paint-order:stroke;stroke:#05080c;stroke-width:3px;text-anchor:middle;pointer-events:none}
.pin{cursor:pointer}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}
.pulse{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.ovl{position:absolute;z-index:3}
#layers{left:12px;top:12px;background:rgba(13,20,27,.92);border:1px solid var(--line);border-radius:8px;padding:6px 10px 8px;font-size:12px;backdrop-filter:blur(4px)}
#layers h4{margin:2px 0 4px;font-size:11px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
#layers label{display:flex;align-items:center;gap:7px;padding:2px 0;cursor:pointer;color:var(--ink)}
#layers input{accent-color:var(--accent);margin:0}
#layers .sw{width:10px;height:10px;border-radius:2px;display:inline-block}
#layers.min label{display:none}
#zoom{right:12px;bottom:14px;display:flex;flex-direction:column;gap:4px}
#zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:rgba(13,20,27,.92);font-size:18px;line-height:1}
#zoom button:hover{background:var(--panel2)}
#legend{left:12px;bottom:12px;background:rgba(13,20,27,.88);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11.5px;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap;max-width:70%}
#legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
#tip{position:fixed;z-index:30;pointer-events:none;background:#05090d;border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:12px;max-width:300px;display:none;box-shadow:0 4px 14px #0008}
#card{right:12px;top:12px;width:320px;max-height:60%;overflow:auto;background:rgba(13,20,27,.97);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:none;font-size:13px}
#card h3{margin:0 24px 6px 0;font-size:14px}
#card .x{position:absolute;right:8px;top:6px;background:none;border:0;font-size:20px;color:var(--mute)}
#card p{margin:6px 0;color:var(--mute)}
#card .kv{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:4px 0}
#card .kv b{font-weight:600}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.ph{padding:12px 16px 10px;border-bottom:1px solid var(--line);flex:none}
.ph .row{display:flex;align-items:center;gap:10px}
.ph h2{margin:0;font-size:18px;flex:1}
.badge{display:inline-block;border-radius:5px;padding:2px 9px;font-weight:700;font-size:12px;letter-spacing:.04em;color:#0a0f14;white-space:nowrap}
.ph p{margin:5px 0 0;color:var(--mute);font-size:12.5px}
.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 12px;flex:none;border-bottom:1px solid var(--line)}
.g{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px 7px;text-align:left;position:relative;overflow:hidden}
.g:hover{border-color:#3a5167}
.g.on{border-color:var(--accent);background:#14212e}
.g .n{font-size:11.5px;color:var(--mute);display:flex;justify-content:space-between}
.g .z{font-size:19px;font-weight:700;line-height:1.15}
.g .bar{height:4px;background:#1c2a37;border-radius:2px;margin-top:3px;position:relative}
.g .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.g .bar u{position:absolute;top:-1px;bottom:-1px;width:1px;background:#6c8196}
.lh{padding:8px 16px 4px;color:var(--mute);font-size:11.5px;display:flex;justify-content:space-between;gap:10px;flex:none}
.lh b{color:var(--ink);font-size:12.5px}
.list{flex:1;min-height:0;overflow-y:auto;padding:0 8px 8px;scrollbar-width:thin;scrollbar-color:#2a3b4b transparent}
.sig{display:grid;grid-template-columns:8px 1fr auto;gap:9px;align-items:center;padding:6px 8px;border-radius:7px;cursor:pointer;border:1px solid transparent}
.sig:hover{background:var(--panel2);border-color:var(--line)}
.sig .pip{width:8px;height:30px;border-radius:3px}
.sig .t{font-size:12.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sig .s{font-size:11px;color:var(--dim)}
.sig .v{font-weight:700;font-size:14px;text-align:right;min-width:48px}
.sig .v small{display:block;font-weight:500;font-size:10.5px;color:var(--dim)}
.card2{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:9px;background:var(--panel2);cursor:pointer}
.card2:hover{border-color:#3a5167}
.card2 h3{margin:0;font-size:14px}
.cells{display:flex;gap:4px;grid-column:1/-1}
.cell{flex:1;border-radius:4px;padding:3px 0;text-align:center;font-size:10px;color:#0a0f14;font-weight:700}
.mk2{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 8px;border-radius:7px;text-decoration:none;color:var(--ink)}
.mk2:hover{background:var(--panel2)}
.mk2 small{color:var(--dim)}
.mk2 b{font-size:16px;text-align:right}
.note{color:var(--dim);font-size:11.5px;padding:6px 10px}
.empty{color:var(--mute);padding:18px 12px;font-size:13px}
/* modal */
#modal{position:fixed;inset:0;z-index:20;background:rgba(2,6,10,.72);display:none;align-items:center;justify-content:center;padding:18px}
#modal .box{background:var(--panel);border:1px solid #2c4156;border-radius:14px;width:min(860px,100%);max-height:100%;overflow:auto;padding:20px 24px;position:relative;box-shadow:0 20px 60px #000a}
#modal .x{position:absolute;right:14px;top:10px;background:none;border:0;font-size:26px;color:var(--mute)}
#modal h2{margin:0 36px 8px 0;font-size:19px;line-height:1.25}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:1px 10px;font-size:11.5px;color:var(--mute)}
.top{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin-bottom:12px}
.big{font-size:42px;font-weight:800;line-height:1;text-align:center}
.big small{display:block;font-size:12px;font-weight:600;margin-top:4px}
.top p{margin:0 0 6px;color:#c3d0dc}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two>div{min-width:0}
.ch{background:#0a1118;border:1px solid var(--line);border-radius:9px;padding:8px 10px 6px;margin-bottom:12px}
.ch h5{margin:0 0 2px;font-size:12px;color:var(--mute);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.ch h5 span{color:var(--ink);font-weight:600}
.ch svg{width:100%;height:auto;display:block}
table.st{border-collapse:collapse;width:100%;font-size:12.5px}
table.st td{padding:4px 0;border-top:1px solid var(--line)}
table.st td:last-child{text-align:right;font-weight:600}
.warnbox{background:#2a1f10;border:1px solid #6b4a1c;border-radius:8px;padding:8px 12px;margin-bottom:12px;color:#f2d3a2;font-size:13px}
/* system */
#system{display:none;flex:1;min-height:0;overflow:auto;padding:18px 22px}
#system .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;max-width:1500px}
#system h3{margin:0 0 8px;font-size:14px}
#system p,#system li{color:var(--mute);font-size:13px}
#system li{margin-bottom:5px}
#system ul{padding-left:18px;margin:0 0 14px}
#system b{color:var(--ink)}
.kw{font-family:ui-monospace,monospace;font-size:12px;background:var(--panel2);padding:1px 5px;border-radius:4px;color:#c3d0dc}
@media(max-width:900px){
  body{overflow:auto;display:block}
  header{height:auto;flex-wrap:wrap;padding:8px 10px}
  nav{order:3;flex:1 0 100%;overflow-x:auto}
  main{display:block}
  #mapwrap{height:58vh}
  aside{border-left:0}
  .list{overflow:visible}
  #system .cols,.two{grid-template-columns:1fr}
  #legend{display:none}
  .top{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="brand"><i></i>WARWATCH</div>
  <nav id="tabs"></nav>
  <div class="meta"><span class="demo" id="demo" hidden>DEMO DATA</span>Updated __GENERATED__</div>
</header>
<main id="main">
  <div id="mapwrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="ovl" id="layers"></div>
    <div class="ovl" id="legend"></div>
    <div class="ovl" id="zoom"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">&minus;</button><button id="zhome" title="Reset view" style="font-size:14px">&#8962;</button></div>
    <div class="ovl" id="card"></div>
  </div>
  <aside id="panel"></aside>
</main>
<section id="system"></section>
<div id="tip"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<script id="data" type="application/json">__DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LEVEL = {'Alert':'#ff4d4f','Warning':'#ff8a1f','Watch':'#f5c518','Normal':'#3ddc84','insufficient data':'#6b7a8a'};
const MEANING = {
  'Alert':'Three or more independent signal groups are unusual at once.',
  'Warning':'Two signal groups are unusual at once.',
  'Watch':'One group is strongly unusual, or two are mildly unusual.',
  'Normal':'Nothing is outside its usual range.',
  'insufficient data':'Too few groups have enough history to judge yet.'};
const T_WATCH = D.thresholds[0], T_SIG = D.thresholds[1];
const DOM = {}; D.domains.forEach(d => DOM[d.id] = d);
const SHORT = {logistics:'Logistics', financial:'Financial', behavioral:'Human', geospatial:'Geospatial', information:'Information', markets:'Markets'};
const TABS = [['overview','Overview']].concat(D.order.map(t => [t, D.theatres[t].name])).concat([['system','System']]);
const SERIES = {}; D.series.forEach(s => SERIES[s.id] = s);
const CLSCOL = {lift:'#4cc9f0', tanker:'#ffd166', isr:'#c77dff', fighter:'#ff5d73', other:'#9fb3c8'};
let tab = 'overview', selDom = null;

function zcol(z){ return z == null ? '#6b7a8a' : z >= T_SIG ? '#ff4d4f' : z >= T_WATCH ? '#ff8a1f' : z >= 1 ? '#d9c04a' : '#3ddc84'; }
function fmtz(z){ return z == null ? 'n/a' : (z > 0 ? '+' : '') + z.toFixed(1); }
function fmtv(v){
  if (v == null) return '';
  const a = Math.abs(v);
  if (a >= 1e9) return (v/1e9).toFixed(1)+'B';
  if (a >= 1e6) return (v/1e6).toFixed(1)+'M';
  if (a >= 1e4) return (v/1e3).toFixed(0)+'k';
  if (a >= 100) return v.toFixed(0);
  if (a >= 10) return v.toFixed(1);
  return v.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
}
function levelBadge(l){ return `<span class="badge" style="background:${LEVEL[l]}">${esc(l.toUpperCase())}</span>`; }
function tipShow(e, html){ const t = $('#tip'); t.innerHTML = html; t.style.display = 'block'; const w = t.offsetWidth, h = t.offsetHeight; let x = e.clientX + 14, y = e.clientY + 14; if (x + w > innerWidth - 6) x = e.clientX - w - 12; if (y + h > innerHeight - 6) y = e.clientY - h - 12; t.style.left = x + 'px'; t.style.top = y + 'px'; }
function tipHide(){ $('#tip').style.display = 'none'; }

/* ------------------------------------------------------------ tabs */
function buildTabs(){
  $('#tabs').innerHTML = TABS.map(([id, name]) => {
    const th = D.theatres[id];
    const dot = th ? `<span class="dot" style="background:${LEVEL[th.level]}"></span>` : '';
    return `<button data-tab="${id}" class="${id===tab?'on':''}">${dot}${esc(name)}</button>`;
  }).join('');
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.tab); });
function go(id, first){
  if (!TABS.some(t => t[0] === id)) id = 'overview';
  tab = id; selDom = null; location.hash = id; closeCard(); buildTabs();
  const sys = id === 'system';
  $('#main').style.display = sys ? 'none' : '';
  $('#system').style.display = sys ? 'block' : 'none';
  if (sys) { renderSystem(); return; }
  syncLayers(); renderPins(); renderPanel(); fitTab(!first);
}
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== tab) go(h); });
addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#modal').style.display === 'flex') closeModal(); else closeCard(); } });

/* ------------------------------------------------------------ map */
const M = D.map;
const svg = $('#map');
const NS = 'http://www.w3.org/2000/svg';
let view = {x:0, y:0, w: M ? M.w : 1000}, anim = null;
const layerState = {mil:true, nga:true, czib:true, choke:true, hubs:true, adv:false, cities:true, labels:true};
const LAYERS = [
  ['mil','Military aircraft','#4cc9f0'], ['nga','Hazard warnings (NGA)','#ff9f43'], ['czib','Airspace bulletins (EASA)','#ff4d9d'],
  ['choke','Chokepoints','#58a6ff'], ['hubs','GPS-jamming sample zones','#7dd3fc'], ['adv','US travel-advisory shading','#ff8a1f'],
  ['cities','Cities','#e6edf3'], ['labels','Country names','#8b9db0']];
const OBJ = {mil:[], nga:[], czib:[], choke:[], city:[], hub:[], country:[]};
const thOfCountry = {};
let scaleEls = [];

function mk(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function clientSize(){ const r = svg.getBoundingClientRect(); return [Math.max(r.width,1), Math.max(r.height,1)]; }
function applyView(){
  const [cw, ch] = clientSize(); const h = view.w * ch / cw;
  svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${h}`);
  const s = view.w / cw;
  scaleEls.forEach(e => e.setAttribute('transform', `scale(${s})`));
  document.querySelectorAll('.lab').forEach(t => { const a = +t.dataset.area; const th = t.dataset.th === '1'; const vis = layerState.labels && (Math.sqrt(a) / s > 38 || (th && tab !== 'overview' && Math.sqrt(a)/s > 14)); t.style.display = vis ? '' : 'none'; t.style.fontSize = (th && tab !== 'overview' ? 13 : 11) * s + 'px'; t.style.strokeWidth = 3 * s + 'px'; });
}
function clampView(){
  view.w = Math.min(Math.max(view.w, 140), M.w);
  const [cw, ch] = clientSize(); const h = view.w * ch / cw;
  view.x = Math.min(Math.max(view.x, 0), Math.max(0, M.w - view.w));
  view.y = Math.min(Math.max(view.y, 0), Math.max(0, M.h - h));
}
function fitBox(b){
  const [cw, ch] = clientSize();
  const bw = b[2] - b[0], bh = b[3] - b[1];
  const w = Math.max(bw, bh * cw / ch) * 1.06; const h = w * ch / cw;
  return {x: (b[0] + b[2]) / 2 - w / 2, y: (b[1] + b[3]) / 2 - h / 2, w};
}
function fitTab(animate){
  if (!M) return;
  const key = TABS.some(t => t[0] === tab) && D.map.theatres[tab] ? tab : 'global';
  const to = fitBox(M.theatres[tab === 'overview' ? 'global' : key].view);
  flyTo(to, animate);
}
function flyTo(to, animate){
  if (anim) cancelAnimationFrame(anim);
  if (!animate) { view = to; clampView(); applyView(); return; }
  const from = {...view}, t0 = performance.now(), dur = 450;
  const step = now => { let p = Math.min(1, (now - t0) / dur); p = 1 - Math.pow(1 - p, 3);
    view = {x: from.x + (to.x - from.x) * p, y: from.y + (to.y - from.y) * p, w: from.w + (to.w - from.w) * p}; applyView();
    if (p < 1) anim = requestAnimationFrame(step); };
  anim = requestAnimationFrame(step);
}
function zoomAt(f, cx, cy){
  const r = svg.getBoundingClientRect(); const [cw, ch] = [r.width, r.height];
  const fx = (cx - r.left) / cw, fy = (cy - r.top) / ch;
  const nw = Math.min(Math.max(view.w / f, 140), M.w); const real = view.w / nw;
  const h = view.w * ch / cw, nh = nw * ch / cw;
  view = {x: view.x + fx * (view.w - nw), y: view.y + fy * (h - nh), w: nw}; clampView(); applyView();
}
function buildMap(){
  if (!M) { svg.outerHTML = '<div class="empty">Basemap unavailable.</div>'; return; }
  svg.innerHTML = '';
  const g = mk('g', {id:'land'}, svg);
  const lab = mk('g', {id:'labels'}, svg);
  M.countries.forEach((c, i) => {
    const p = mk('path', {d: c.d, class: 'c', 'data-k': 'country:' + i, 'data-n': c.name}, g);
    c._el = p;
    OBJ.country.push(c);
    const t = mk('text', {x: c.cx, y: c.cy, class: 'lab', 'data-area': c.area}, lab); t.textContent = c.name; c._lab = t;
  });
  for (const th in M.theatres) (M.theatres[th].countries || []).forEach(n => { if (!thOfCountry[n]) thOfCountry[n] = th; });
  const mkLayer = id => mk('g', {id: 'L' + id}, svg);
  const gh = mkLayer('hubs'); M.hubs.forEach((h, i) => { const c = mk('circle', {cx: h.xy[0], cy: h.xy[1], r: h.r, class: 'hub', 'data-k': 'hub:' + i}, gh); OBJ.hub.push(h); });
  const gc = mkLayer('choke');
  M.choke.forEach((c, i) => { const m = mk('g', {transform: `translate(${c.xy[0]},${c.xy[1]})`, class: 'mk', 'data-k': 'choke:' + i}, gc); const s = mk('g', {class: 'sc'}, m);
    mk('circle', {r: 9, fill: 'none', stroke: '#58a6ff', 'stroke-width': 2}, s); mk('circle', {r: 3.5, fill: '#58a6ff'}, s); OBJ.choke.push(c); scaleEls.push(s); });
  const gn = mkLayer('nga');

function lineChart(pts, o){
  const W = 760, H = o.h || 170, L = 46, R = 10, T = 8, B = 20;
  const vals = pts.map(p => p[1]);
  let lo = Math.min(...vals, ...(o.extra || [])), hi = Math.max(...vals, ...(o.extra || []));
  if (o.min != null) lo = Math.min(lo, o.min); if (o.max != null) hi = Math.max(hi, o.max);
  if (hi === lo) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * .06; lo -= pad; hi += pad;
  const X = i => L + (pts.length < 2 ? 0 : i / (pts.length - 1)) * (W - L - R), Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" data-n="${pts.length}" data-l="${L}" data-r="${R}" data-w="${W}">`;
  (o.bands || []).forEach(b => { s += `<rect x="${L}" y="${Y(Math.min(b.b, hi))}" width="${W - L - R}" height="${Math.max(0, Y(Math.max(b.a, lo)) - Y(Math.min(b.b, hi)))}" fill="${b.c}"/>`; });
  [lo + pad, (lo + hi) / 2, hi - pad].forEach(v => { s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1d2b38"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" fill="#6c8196" font-size="11">${o.fy ? o.fy(v) : fmtv(v)}</text>`; });
  (o.lines || []).forEach(l => { if (l.y >= lo && l.y <= hi) s += `<line x1="${L}" x2="${W - R}" y1="${Y(l.y)}" y2="${Y(l.y)}" stroke="${l.c}" stroke-dasharray="${l.d || '4 4'}" stroke-width="1.2"/>${l.t ? `<text x="${W - R - 2}" y="${Y(l.y) - 3}" text-anchor="end" fill="${l.c}" font-size="10.5">${esc(l.t)}</text>` : ''}`; });
  s += `<polyline fill="none" stroke="${o.c || '#58a6ff'}" stroke-width="1.8" stroke-linejoin="round" points="${pts.map((p, i) => X(i).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ')}"/>`;
  if (o.dots) pts.forEach((p, i) => { if (o.dots(p[1])) s += `<circle cx="${X(i)}" cy="${Y(p[1])}" r="3" fill="${zcol(p[1])}"/>`; });
  const last = pts[pts.length - 1]; s += `<circle cx="${X(pts.length - 1)}" cy="${Y(last[1])}" r="4" fill="${o.c || '#58a6ff'}" stroke="#05080c" stroke-width="1.5"/>`;
  s += `<text x="${L}" y="${H - 5}" fill="#6c8196" font-size="11">${esc(pts[0][0])}</text><text x="${W - R}" y="${H - 5}" text-anchor="end" fill="#6c8196" font-size="11">${esc(last[0])}</text>`;
  s += `<line class="hl" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#a9c7e2" stroke-width="1" style="display:none"/></svg>`;
  return s;
}

  const th = s.t === 'global' ? 'Global' : D.theatres[s.t].name;
  const verdict = s.z == null ? 'No score yet' : s.z >= T_SIG ? 'Signal: unusual' : s.z >= T_WATCH ? 'Elevated' : 'Normal range';
  const dirTxt = s.dir === 'up' ? 'A warning is a <b>rise</b> above the usual level.' : s.dir === 'down' ? 'A warning is a <b>fall</b> below the usual level.' : 'A large move <b>in either direction</b> counts as a warning.';
  let h = `<button class="x" aria-label="Close">&times;</button><h2>${esc(s.l)}</h2><div class="chips"><span class="chip">${esc(th)}</span><span class="chip">${esc(DOM[s.d].name)}</span>${s.s ? `<span class="chip">${esc(s.s)}</span>` : ''}<span class="chip" style="color:${s.lag ? 'var(--warn)' : 'var(--ok)'}">${s.lag ? 'Confirms: published late' : 'Leads: fast data'}</span><span class="chip">${s.kind === 'daily' ? 'Daily' : 'Monthly'}</span></div>`;
  if (s.st === 'error') h += `<div class="warnbox"><b>Fetch failed.</b> ${esc(s.er)}${s.stale ? '' : ' No earlier copy is stored, so this signal is not scored.'}</div>`;
  if (s.stale) h += `<div class="warnbox">Showing the last good copy from <b>${esc(s.stale)}</b> because the latest fetch failed.</div>`;
  if (s.st === 'awaiting_key') h += `<div class="warnbox">This signal needs a free API key (<span class="kw">${esc(s.needs.join(', '))}</span>) that has not been added yet.</div>`;
  if (s.st === 'collecting') h += `<div class="warnbox">History is still building: <b>${s.n}</b> of the <b>${s.need}</b> ${s.kind === 'daily' ? 'days' : 'months'} needed before a score is reliable. It scores itself automatically.</div>`;
  h += `<div class="top"><div class="big" style="color:${zcol(s.z)}">${s.z == null ? 'n/a' : fmtz(s.z)}<small>${esc(verdict)}</small></div><div><p>${esc(s.why)}</p><p style="color:var(--mute)">${dirTxt} The number is how many standard deviations the latest reading sits from its own normal (a robust z-score). Watch starts at ${T_WATCH.toFixed(1)}, a signal at ${T_SIG.toFixed(1)}.</p></div></div>`;
  if (s.pts && s.pts.length > 1) {
    const unit = s.kind === 'daily' ? 'daily values' : 'monthly values';
    const vo = {h: 170, c: '#58a6ff'};
    if (s.base) { vo.bands = [{a: s.base.med - 2 * s.base.sd, b: s.base.med + 2 * s.base.sd, c: 'rgba(88,166,255,.12)'}, {a: s.base.med - 3 * s.base.sd, b: s.base.med + 3 * s.base.sd, c: 'rgba(88,166,255,.07)'}];
      vo.lines = [{y: s.base.med, c: '#7f93a8', t: '', d: '2 3'}, {y: s.base.med + 3 * s.base.sd, c: '#ff8a1f', t: '+3 SD'}, {y: s.base.med - 3 * s.base.sd, c: '#ff8a1f', t: '-3 SD'}];
      vo.extra = [s.base.med + 3 * s.base.sd, s.base.med - 3 * s.base.sd]; }
    h += chartBox('Raw values: ' + unit + (s.base ? ' (shaded: normal range of weekly averages, ±2 and ±3 SD)' : ''), s.pts, vo);
  }
  if (s.zh && s.zh.length > 1) {
    h += chartBox('Score history in standard deviations (what the dashboard would have shown each day)', s.zh,
      {h: 150, c: '#e6edf3', min: -4, max: 6, fy: v => v.toFixed(0), fyname: 'z', dots: v => v >= T_WATCH,
       bands: [{a: T_SIG, b: 99, c: 'rgba(255,77,79,.14)'}, {a: T_WATCH, b: T_SIG, c: 'rgba(255,138,31,.12)'}],
       lines: [{y: T_SIG, c: '#ff4d4f', t: 'signal ' + T_SIG.toFixed(1)}, {y: T_WATCH, c: '#ff8a1f', t: 'watch ' + T_WATCH.toFixed(1)}, {y: 0, c: '#52667a', t: '0', d: '2 3'}]});
  }
  h += `<div class="two"><div><table class="st">`;
  const row = (a, b) => `<tr><td>${a}</td><td>${b}</td></tr>`;
  if (s.z != null) {
    h += row(s.kind === 'daily' ? 'Latest 7-day average' : 'Latest month', esc(fmtv(s.val)));
    if (s.base) h += row('Normal level (median of 26 weeks)', esc(fmtv(s.base.med))) + row('One standard deviation', esc(fmtv(s.base.sd)));
    h += row('Distance from normal', `<span style="color:${zcol(s.z)}">${fmtz(s.z)} SD</span>`);
    h += row('Method', esc(s.method));
  }
  h += row('Observations held', s.n + (s.n ? ` (${esc(s.pts ? s.pts[0][0] : '')} to ${esc(s.last || '')})` : ''));
  h += row('Last observation', esc(s.last || 'none'));
  h += `</table></div><div><p style="margin:0 0 6px;color:var(--mute);font-size:12.5px">${s.kind === 'monthly' ? 'Monthly series are log-scaled and corrected for the calendar month (seasonality) before scoring, against the prior 36 months.' : 'Daily series are scored on the latest 7-day average against weekly averages of the prior 26 weeks.'} Scores are capped at ±12 SD.</p>${s.url ? `<p style="margin:0"><a target="_blank" rel="noopener" href="${esc(s.url)}">Open the data source &#8599;</a></p>` : ''}</div></div>`;
  $('#mbox').innerHTML = h; $('#modal').style.display = 'flex'; $('#mbox').scrollTop = 0;
}
function closeModal(){ $('#modal').style.display = 'none'; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('.x')) closeModal(); });

/* ------------------------------------------------------------ system tab */
function renderSystem(){
  const cnt = {}; D.series.forEach(s => cnt[s.st] = (cnt[s.st] || 0) + 1);
  const awaiting = D.series.filter(s => s.st === 'awaiting_key'), err = D.series.filter(s => s.st === 'error'), col = D.series.filter(s => s.st === 'collecting');
  const stale = D.series.filter(s => s.stale);
  const keys = {}; awaiting.forEach(s => s.needs.forEach(k => keys[k] = (keys[k] || 0) + 1));
  $('#system').innerHTML = `<div class="cols">
  <div><h3>Data health</h3><ul>
    <li><b>${cnt.ok || 0}</b> signals scored</li><li><b>${cnt.collecting || 0}</b> still collecting history</li>
    <li><b>${cnt.awaiting_key || 0}</b> waiting for a free key${Object.keys(keys).length ? ' (' + Object.keys(keys).map(k => `<span class="kw">${esc(k)}</span> ×${keys[k]}`).join(', ') + ')' : ''}</li>
    <li><b>${cnt.error || 0}</b> failed to fetch${stale.length ? `, <b>${stale.length}</b> showing a stale copy` : ''}</li></ul>
    ${err.length ? '<h3>Failures</h3><ul>' + err.map(s => `<li><b>${esc(s.id)}</b>: ${esc(s.er)}</li>`).join('') + '</ul>' : ''}
    ${D.errors.length ? '<h3>Map layers that failed</h3><ul>' + D.errors.map(e => `<li>${esc(e)}</li>`).join('') + '</ul>' : ''}
    ${col.length ? `<h3>Collecting history</h3><p>Snapshot sources (aircraft, GPS, advisories, hazard warnings) can only record what they see now, so they need ${col[0] ? '12 weeks' : ''} before a score is meaningful. ${col.length} signals are in this state.</p>` : ''}
  </div>
  <div><h3>How the level is decided</h3><ul>
    <li>Every signal is compared with its own history and scored in standard deviations (robust z-score).</li>
    <li>A group (logistics, financial, human, geospatial, information) scores as the mean of its two strongest signals, so a lone spike cannot fire a group.</li>
    <li>A group <b>fires</b> at ${T_SIG.toFixed(1)} SD and is <b>watched</b> at ${T_WATCH.toFixed(1)} SD.</li>
    <li>Level: <b>Watch</b> = one group fires or two are watched; <b>Warning</b> = two fire; <b>Alert</b> = three or more fire.</li>
    <li>Each theatre uses only its own indicators. Two or more groups must have data or the theatre says "insufficient data".</li>
    <li>Warning and Alert with only slow, late-published data are labelled <b>lagging only</b>: a confirmed build-up, not an early warning.</li>
    <li>This is an agreement counter, not a probability. A single signal is a prompt to look closer, never a forecast.</li></ul></div>
  <div><h3>Not available, and what replaces it</h3><ul>${D.unavailable.map(u => `<li><b>${esc(u.n)}</b>: ${esc(u.w)}</li>`).join('')}</ul></div></div>`;
}

/* ------------------------------------------------------------ start */
if (D.demo) $('#demo').hidden = false;
buildMap(); renderLayers(); syncLayers();
const h0 = location.hash.slice(1);
go(TABS.some(t => t[0] === h0) ? h0 : "overview", true);
</script>
</body>
</html>
