<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock">
<title>Warwatch: war early-warning dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:oklch(0.15 0 0); --panel:oklch(0.185 0.004 260); --panel2:oklch(0.225 0.005 260); --panel3:oklch(0.265 0.006 260);
  --line:oklch(0.3 0.006 260); --line2:oklch(0.4 0.01 255); --ink:oklch(0.96 0.004 250); --mute:oklch(0.74 0.01 255); --dim:oklch(0.6 0.01 255);
  --sel:oklch(0.27 0.03 215);
  --ocean:#090a0d; --land:url(#gLand); --land-th:url(#gLandTh); --border:#4b5762; --border-th:#8fa1b0; --border-th:#8fa1b0;
  --accent:oklch(0.83 0.13 205); --mint:oklch(0.87 0.17 160); --violet:oklch(0.72 0.17 300);
  --ok:oklch(0.76 0.12 160); --watch:oklch(0.84 0.14 90); --warn:oklch(0.74 0.16 55); --alert:oklch(0.67 0.21 25); --na:oklch(0.55 0.01 255);
  --mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13.5px/1.42 var(--sans);overflow:hidden}
#app{display:flex;height:100%}
#col{flex:1;min-width:0;display:flex;flex-direction:column}
.num,.badge,.v,.sco,.kpi b,.g .z,.meta,.gti b{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
/* sidebar */
#sb{width:212px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:width .22s ease;overflow:hidden}
#sb.min{width:56px}
#sb .brand{height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;font-weight:700;letter-spacing:.16em;font-size:13px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer}
#sb .brand i{width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint);flex:none}
#sbnav{flex:1;min-height:0;overflow:auto;padding:8px 8px;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.si{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;border:0;background:none;color:var(--mute);white-space:nowrap;text-align:left;width:100%;transition:background .15s,color .15s}
.si:hover{background:var(--panel2);color:var(--ink)}
.si.on{background:var(--sel);color:var(--accent)}
.si .tx{flex:1;overflow:hidden;text-overflow:ellipsis}
.si .dot{width:8px;height:8px;border-radius:50%;flex:none}
.sub{display:flex;flex-direction:column;gap:1px;margin:1px 0 4px 18px;padding-left:8px;border-left:1px solid var(--line)}
.sub .si{padding:5px 8px;font-size:12.5px;gap:8px}
.sub .si .sc{font-family:var(--mono);font-size:11px;color:var(--dim)}
.sgl{padding:10px 12px 3px;font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
#sb.min .tx,#sb.min .sub,#sb.min .sgl,#sb.min .brand span,#sb.min .chev{display:none}
#sbf{border-top:1px solid var(--line);padding:8px}
/* top bar */
header#top{height:56px;flex:none;display:flex;align-items:center;gap:18px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#tt{min-width:0}
#tt h1{margin:0;font-size:15px;font-weight:600;white-space:nowrap}
#tt small{display:block;color:var(--dim);font-size:11.5px;white-space:nowrap}
.gti{display:flex;align-items:center;gap:12px;padding:5px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.gti small{display:block;font-size:9.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.gti b{font-size:21px;line-height:1.05;font-weight:600}
.gti .bar{width:96px;height:5px;border-radius:3px;background:var(--panel3);position:relative;overflow:hidden}
.gti .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
#cnts{display:flex;gap:6px}
.cn{display:flex;align-items:center;gap:6px;padding:3px 9px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);font-size:12px;color:var(--mute);white-space:nowrap}
.cn b{font-family:var(--mono);color:var(--ink)}
.cn .dot{width:7px;height:7px;border-radius:50%}
#alr{display:flex;gap:6px;min-width:0;flex:1;overflow:hidden;align-items:center}
.ac{display:flex;align-items:center;gap:6px;padding:3px 9px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);font-size:12px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--ink)}
.ac:hover{border-color:var(--line2)}
.ac.new{animation:glow 2.4s ease-in-out 3}
#search{position:relative;width:230px;flex:none}
#search input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px 7px 32px;outline:none}
#search input:focus{border-color:var(--accent)}
#search .ic{position:absolute;left:10px;top:9px;color:var(--dim);width:15px;height:15px}
#results{position:absolute;right:0;top:40px;width:420px;max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:10px;display:none;z-index:25;box-shadow:0 12px 40px #000a}
#results h6{margin:0;padding:8px 12px 3px;font-size:10.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
#results .r{padding:6px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
#results .r:hover,#results .r.on{background:var(--panel2)}
#results .r small{color:var(--dim);white-space:nowrap}
.meta{color:var(--dim);font-size:11px;white-space:nowrap;text-align:right;line-height:1.35}
.demo{background:#5b1e1e;color:#ffd6d6;border-radius:4px;padding:1px 7px;margin-right:8px;font-weight:700}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(430px,33vw,610px)}
#mapwrap{position:relative;min-width:0;min-height:0;background:var(--ocean);overflow:hidden}
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none}
#map.drag{cursor:grabbing}
.c{fill:var(--land);stroke:var(--border);stroke-width:.9px;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer;transition:fill .12s}
.c.th{fill:var(--land-th);stroke:var(--border-th);stroke-width:1.5px}
.c:hover{fill:url(#gHover)}
.c.a2{fill:url(#gA2)}.c.a3{fill:url(#gA3)}.c.a4{fill:url(#gA4)}
.c.th.a2{fill:url(#gTA2)}.c.th.a3{fill:url(#gTA3)}.c.th.a4{fill:url(#gTA4)}
.lab{font-weight:600;fill:#b9c3cc;paint-order:stroke;stroke:url(#gInk);stroke-linejoin:round;pointer-events:none;text-anchor:middle;letter-spacing:.01em}
.lab.city{text-anchor:start;fill:#e6d9ae;font-weight:500}
.lab.sea{fill:#5f7b93;font-style:italic;font-weight:500}
.cityd{fill:#e6d9ae;stroke:url(#gInk);stroke-width:1.5px}
.mk{cursor:pointer}
.mk:hover .sc{filter:brightness(1.6)}
.hub{fill:none;stroke:#5fb4d8;stroke-width:1.2px;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:visibleStroke;cursor:pointer;opacity:.8}
.pin text{fill:#fff;font-weight:700;paint-order:stroke;stroke:url(#gInk);stroke-width:3px;text-anchor:middle;pointer-events:none;font-family:var(--mono)}
.pin text.nm{font-family:var(--sans);font-weight:600}
.pin{cursor:pointer}
.pin.hl .ring{opacity:1}
.ring{fill:none;stroke:#fff;stroke-width:2px;opacity:0;transition:opacity .15s;vector-effect:non-scaling-stroke}
.pin .ring{stroke-width:2.5px}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 3px oklch(0.83 0.13 205/.35)}}
@keyframes outline{0%,100%{box-shadow:0 0 0 0 var(--c)}50%{box-shadow:0 0 0 2px var(--c)}}
.pulse{animation:pulse 1.9s ease-out infinite;transform-box:fill-box;transform-origin:center}
.ovl{position:absolute;z-index:3}
#layers{left:12px;top:12px;background:rgba(20,21,24,.92);border:1px solid var(--line);border-radius:10px;padding:6px 10px 8px;font-size:12.5px;backdrop-filter:blur(6px);max-height:calc(100% - 90px);overflow:auto}
#layers h4{margin:2px 0 4px;font-size:10.5px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
#layers label{display:flex;align-items:center;gap:7px;padding:2px 0;cursor:pointer}
#layers input{accent-color:var(--accent);margin:0}
#layers .sw{width:9px;height:9px;border-radius:2px;display:inline-block}
#layers.min label,#layers.min .lsz{display:none}
.lsz{display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--mute)}
.lsz button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.lsz button.on{border-color:var(--accent);color:var(--accent)}
#zoom{right:12px;bottom:14px;display:flex;flex-direction:column;gap:4px}
#zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:rgba(20,21,24,.92);font-size:18px;line-height:1}
#zoom button:hover{background:var(--panel2)}
#legend{left:12px;bottom:12px;background:rgba(20,21,24,.9);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:11.5px;color:var(--mute);display:flex;gap:4px 12px;flex-wrap:wrap;max-width:72%}
#legend span{display:flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer;padding:1px 3px;border-radius:4px}
#legend span:hover{background:var(--panel2)}
#legend span.off{opacity:.35;text-decoration:line-through}
#tip{position:fixed;z-index:30;pointer-events:none;background:#0a0a0b;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:12.5px;max-width:320px;display:none;box-shadow:0 4px 14px #000a}
#card{right:12px;top:12px;width:340px;max-height:calc(100% - 24px);overflow:auto;background:rgba(20,21,24,.98);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;display:none;font-size:13px}
#card h3{margin:0 24px 2px 0;font-size:15px}
#card .sub{color:var(--mute);font-size:12px;margin-bottom:6px;display:block;border:0;margin-left:0;padding:0}
#card .x{position:absolute;right:8px;top:6px;background:none;border:0;font-size:22px;color:var(--mute)}
#card p{margin:8px 0;color:#bcc3ca}
#card .kv{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:4px 0}
#card .kv span{color:var(--mute)}
#card .kv b{font-weight:600;text-align:right}
#card .flag{background:#3a1416;border:1px solid #8c2a2f;color:#ffc9cb;border-radius:6px;padding:4px 8px;margin:6px 0;font-weight:600}
#card .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:4px 10px;font-size:12.5px;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--accent)}
aside#panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.ph{padding:12px 16px 10px;border-bottom:1px solid var(--line);flex:none}
.ph .row{display:flex;align-items:center;gap:10px}
.ph h2{margin:0;font-size:18px;font-weight:600;flex:1}
.crumbs{font-size:12px;color:var(--mute);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.crumbs a{color:var(--mute);text-decoration:none}.crumbs a:hover{color:var(--ink)}
.crumbs .ic{width:12px;height:12px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 8px;font-weight:600;font-size:11px;letter-spacing:.06em;color:#0b0b0c;white-space:nowrap}
.ph p{margin:6px 0 0;color:var(--mute);font-size:12.5px}
.kpis5{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.kp{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 9px;min-width:0}
.kp small{display:block;color:var(--dim);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.kp b{display:block;font-size:16px;line-height:1.25;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp b.sm{font-size:12.5px;font-family:var(--sans)}
.why{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:2px}
.why li{display:flex;gap:8px;align-items:baseline;font-size:12.5px;cursor:pointer;padding:2px 6px;border-radius:6px}
.why li:hover{background:var(--panel2)}
.why b{min-width:44px;text-align:right;font-family:var(--mono)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px;flex:none;border-bottom:1px solid var(--line)}
.g{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 9px 6px;text-align:left;position:relative;min-width:0;transition:border-color .15s,transform .15s}
.g:hover{border-color:var(--line2);transform:translateY(-1px)}
.g.on{border-color:var(--accent);background:var(--sel)}
.g.an{animation:outline 2.2s ease-in-out infinite;border-color:var(--c)}
.g .n{font-size:11px;color:var(--mute);display:flex;justify-content:space-between;gap:4px;white-space:nowrap;align-items:center}
.g .z{font-size:17px;font-weight:600;line-height:1.2;display:flex;align-items:center;gap:5px}
.g .z .ic{width:13px;height:13px}
.g .bar{height:5px;background:var(--panel3);border-radius:3px;margin-top:3px;position:relative;overflow:hidden}
.g .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.g .bar u{position:absolute;top:0;bottom:0;width:1px;background:#8a949e}
.g .w{font-size:10px;color:var(--dim);margin-top:2px}
.tool{display:flex;gap:6px;padding:8px 12px 4px;flex:none;align-items:center;flex-wrap:wrap}
.tool input[type=search]{flex:1;min-width:120px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 9px;outline:none}
.tool input:focus{border-color:var(--accent)}
.chip2{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--mute)}
.chip2.on{border-color:var(--accent);color:var(--ink);background:var(--sel)}
.lh{padding:8px 16px 4px;color:var(--mute);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex:none}
.lh b{color:var(--ink);font-size:12.5px;font-weight:600}
.list{flex:1;min-height:0;overflow-y:auto;padding:0 8px 10px;scrollbar-width:thin;scrollbar-color:#35363b transparent}
.sig{display:grid;grid-template-columns:16px 1fr 56px 74px 60px;gap:8px;align-items:center;padding:6px 8px;border-radius:7px;cursor:pointer;border:1px solid transparent;content-visibility:auto;contain-intrinsic-size:auto 44px}
.sig:hover{background:var(--panel2);border-color:var(--line)}
.sig.hd{cursor:default;position:sticky;top:0;background:var(--panel);z-index:2;padding:4px 8px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);content-visibility:visible}
.sig.hd:hover{background:var(--panel);border-color:transparent}
.sig.hd span[data-sk]{cursor:pointer;user-select:none;display:flex;gap:3px;align-items:center}
.sig.hd span[data-sk]:hover{color:var(--ink)}
.sig.hd .on{color:var(--accent)}
.sig .t{font-size:12.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sig .s{font-size:11px;color:var(--dim)}
.sig .v{font-weight:600;font-size:13.5px;text-align:right}
.sig .v small{display:block;font-weight:400;font-size:10px;color:var(--dim)}
.sig .ty{font-size:10.5px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);text-align:center;color:var(--mute)}
.sig .ty.ld{border-color:oklch(0.55 0.1 205);color:var(--accent)}
.sig .an{color:var(--c);animation:outline 2.2s ease-in-out infinite;border-radius:50%;display:flex;width:16px;height:16px;align-items:center;justify-content:center}
.sig .an .ic{width:13px;height:13px}
.sig.pinned{background:oklch(0.21 0.02 25)}
.sig svg{display:block}
.gh{padding:8px 8px 2px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
/* theatre cards */
.tc{margin:6px 0;padding:10px 12px 9px;border:1px solid var(--line);border-left:3px solid var(--lc);border-radius:10px;background:var(--panel2);cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s;contain:content;content-visibility:auto;contain-intrinsic-size:auto 138px}
.tc:hover,.tc.hl{transform:translateY(-2px);box-shadow:0 8px 22px #0008;border-color:var(--line2);border-left-color:var(--lc);background:var(--panel3)}
.tc-h{display:flex;align-items:center;gap:8px}
.tc-h h3{margin:0;font-size:14px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-h .rg{font-size:10.5px;color:var(--dim)}
.tc-h .sd{width:8px;height:8px;border-radius:50%;background:var(--lc);flex:none}
.tc.crit .sd{animation:pulsedot 1.6s ease-out infinite}
@keyframes pulsedot{0%{box-shadow:0 0 0 0 var(--lc)}100%{box-shadow:0 0 0 7px transparent}}
.tc-b{display:grid;grid-template-columns:56px 1fr 86px;gap:10px;align-items:center;margin:6px 0 6px}
.sco{font-size:25px;font-weight:600;line-height:1}
.sco small{font-size:10px;color:var(--dim);font-weight:400}
.trk{height:6px;border-radius:3px;background:var(--panel);position:relative;overflow:hidden}
.trk i{position:absolute;left:0;top:0;bottom:0;background:var(--lc);border-radius:3px;transition:width .5s ease}
.trk u{position:absolute;top:0;bottom:0;width:1px;background:#8a949e;opacity:.7}
.tc-m{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px}
.tc-m small{display:block;color:var(--dim);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}
.tc-m b{font-size:12px;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-f{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:11px;color:var(--dim)}
.tc-f .ti{display:flex;align-items:center;gap:4px;white-space:nowrap}
.tc-f .ic{width:13px;height:13px}
.heat{display:flex;gap:3px;align-items:flex-end;height:20px;flex:1}
.hc{flex:1;border-radius:3px;background:var(--c);min-height:4px;position:relative;opacity:.95}
.hc.na{background:var(--panel3);height:4px!important;opacity:.7}
.hc.an{animation:outline 2.2s ease-in-out infinite;outline:1.5px solid var(--c);outline-offset:1px}
.hc.an:after{content:"";position:absolute;left:50%;top:-8px;margin-left:-3px;border:3px solid transparent;border-bottom:5px solid var(--c);border-top:0}
.mk2{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 8px;border-radius:7px;text-decoration:none;color:var(--ink)}
.mk2:hover{background:var(--panel2)}
.mk2 small{color:var(--dim)}
.mk2 b{font-size:16px;text-align:right;font-family:var(--mono)}
.al{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;padding:7px 8px;border-radius:7px;cursor:pointer;transition:background .15s}
.al:hover,.al.hl{background:var(--panel2)}
.al.new{animation:glow 2.4s ease-in-out 3}
.al .icb{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#0b0b0c}
.al small{color:var(--dim)}
.note{color:var(--dim);font-size:12px;padding:6px 10px}
.empty{color:var(--mute);padding:16px 12px;font-size:13px}
.empty a{cursor:pointer}
.legendrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--mute)}
.legendrow span{display:flex;align-items:center;gap:5px}
.legendrow i{width:8px;height:8px;border-radius:50%;display:inline-block}
/* modal */
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px}
#modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:min(960px,100%);max-height:100%;overflow:auto;padding:18px 24px 20px;position:relative;box-shadow:0 20px 60px #000a}
#modal .x{position:absolute;right:14px;top:8px;background:none;border:0;font-size:26px;color:var(--mute)}
#modal .nav{display:flex;gap:6px;align-items:center;margin-bottom:6px;font-size:12.5px;color:var(--mute);flex-wrap:wrap;padding-right:34px}
#modal .nav a{color:var(--mute);cursor:pointer;text-decoration:none}
#modal .nav a:hover{color:var(--ink);text-decoration:underline}
#modal .nav .sp{flex:1}
#modal h2{margin:0 0 8px 0;font-size:20px;line-height:1.25}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:1px 10px;font-size:12px;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.kpi small{display:block;color:var(--dim);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.kpi b{font-size:20px;line-height:1.2;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:11.5px;color:var(--mute)}
.gauge{margin:0 0 12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px 6px}
.gauge .gt{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:5px}
.gauge svg{width:100%;height:34px;display:block}
.say{margin:0 0 12px;color:#c4cad0;font-size:13.5px;line-height:1.5}
.say b{color:var(--ink)}
.cwrap{background:#0e0e10;border:1px solid var(--line);border-radius:10px;padding:8px 12px 8px;margin-bottom:12px;position:relative}
.cwrap h5{margin:0 0 4px;font-size:12.5px;color:var(--mute);font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.rng{display:flex;gap:4px}
.rng button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:0 8px;font-size:11.5px;color:var(--mute)}
.rng button.on{border-color:var(--accent);color:var(--ink)}
.cwrap svg{width:100%;height:auto;display:block}
.cbub{position:absolute;pointer-events:none;background:#0a0a0b;border:1px solid var(--line2);border-radius:6px;padding:3px 8px;font-size:12px;display:none;white-space:nowrap;z-index:2}
.rel{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.rel div{display:flex;justify-content:space-between;gap:10px;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--line)}
.rel div:hover{background:var(--panel2)}
.rel div span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.warnbox{background:#2a2112;border:1px solid #6b4f22;border-radius:8px;padding:8px 12px;margin-bottom:12px;color:#f2d8a8;font-size:13px}
h3.sh{margin:14px 0 6px;font-size:12px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.two>div{min-width:0}
table.st{border-collapse:collapse;width:100%;font-size:12.5px}
table.st td{padding:4px 0;border-top:1px solid var(--line)}
table.st td:last-child{text-align:right;font-weight:600}
/* pages */
.page{display:none;flex:1;min-height:0;overflow:auto;padding:16px 22px}
.page h3{margin:0 0 8px;font-size:15px;font-weight:600}
.page p,.page li{color:var(--mute);font-size:13px}
.page li{margin-bottom:5px}
.page ul{padding-left:18px;margin:0 0 14px}
.page b{color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;max-width:1600px}
.kw{font-family:var(--mono);font-size:12px;background:var(--panel2);padding:1px 5px;border-radius:4px;color:#c4cad0}
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tbar select,.tbar input{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 9px;outline:none}
.tbar input{min-width:240px}
table.sg{border-collapse:collapse;width:100%;font-size:13px}
table.sg th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer;position:sticky;top:-16px;background:var(--bg);white-space:nowrap}
table.sg td{padding:6px 8px;border-bottom:1px solid #1d1d21;vertical-align:middle}
table.sg tr:hover td{background:var(--panel2);cursor:pointer}
.setrow{display:flex;gap:8px;align-items:center;margin:6px 0 12px}
.setrow button{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:3px 12px;color:var(--mute)}
.setrow button.on{border-color:var(--accent);color:var(--accent)}
.rm *{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:1280px){#cnts,.gti .bar{display:none}.meta{display:none}}
@media(max-width:900px){
  body{overflow:auto}
  #app{display:block;height:auto}
  #sb{width:100%;height:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--line)}
  #sb .brand{border-bottom:0}
  #sbnav{flex-direction:row;overflow-x:auto;padding:4px}
  #sb .sub,#sb .sgl,#sbf,#alr,#cnts{display:none}
  #sb .tx{display:inline}
  header#top{flex-wrap:wrap;height:auto;padding:8px 10px}
  #search{width:100%}
  main{display:block}
  #mapwrap{height:58vh}
  aside#panel{border-left:0}
  .list{overflow:visible}
  .cols,.two,.rel{grid-template-columns:1fr}
  #legend{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .page{overflow:visible}
}
.subtabs{display:flex;gap:4px;padding:8px 10px 0;flex-wrap:wrap}.subtabs button{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--mute);display:flex;align-items:center;gap:6px}.subtabs button.on{color:var(--ink);border-color:var(--accent)}.subtabs .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
</style>

<body>
<!-- Dark fills are drawn through gradients: browsers with a forced dark mode lighten plain dark fills, which washed out the map and its label outlines. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gLand"><stop offset="0" stop-color="#1b2128"/><stop offset="1" stop-color="#1b2128"/></linearGradient><linearGradient id="gLandTh"><stop offset="0" stop-color="#27313b"/><stop offset="1" stop-color="#27313b"/></linearGradient><linearGradient id="gHover"><stop offset="0" stop-color="#2c3640"/><stop offset="1" stop-color="#2c3640"/></linearGradient><linearGradient id="gA2"><stop offset="0" stop-color="#2a2a1c"/><stop offset="1" stop-color="#2a2a1c"/></linearGradient><linearGradient id="gA3"><stop offset="0" stop-color="#3a2b17"/><stop offset="1" stop-color="#3a2b17"/></linearGradient><linearGradient id="gA4"><stop offset="0" stop-color="#4a1f22"/><stop offset="1" stop-color="#4a1f22"/></linearGradient><linearGradient id="gTA2"><stop offset="0" stop-color="#333322"/><stop offset="1" stop-color="#333322"/></linearGradient><linearGradient id="gTA3"><stop offset="0" stop-color="#46341b"/><stop offset="1" stop-color="#46341b"/></linearGradient><linearGradient id="gTA4"><stop offset="0" stop-color="#552528"/><stop offset="1" stop-color="#552528"/></linearGradient><linearGradient id="gInk"><stop offset="0" stop-color="#050506"/><stop offset="1" stop-color="#050506"/></linearGradient></defs></svg>
<div id="app">
<aside id="sb"><div class="brand" id="brand"><i></i><span>WARWATCH</span></div><nav id="sbnav"></nav><div id="sbf"><button class="si" id="sbt" title="Collapse or expand the sidebar"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg><span class="tx">Collapse</span></button></div></aside>

  <div class="meta" id="meta"></div><span id="gen" hidden>__GENERATED__</span><span class="demo" id="demo" hidden>DEMO</span>
</header>
<main id="main">
  <div id="mapwrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="ovl" id="layers"></div>

    <div class="ovl" id="zoom"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">&minus;</button><button id="zhome" title="Reset view" style="font-size:14px">&#8962;</button></div>
    <div class="ovl" id="card"></div>

<script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LEVEL = {'Critical':'#f2545b','Elevated':'#f08a3c','Watch':'#e5c04b','Normal':'#46c28a','insufficient data':'#6b7280'};
const MEANING = {
  'Critical':'Top 1% of the readings seen in calm conditions, with several signals agreeing.',
  'Elevated':'Top 5% of calm-condition readings. Treat as a real change worth investigating.',
  'Watch':'Top 10% of calm-condition readings. This happens by chance about one day in ten, so look closer rather than conclude.',
  'Normal':'Within the range seen in calm conditions.',
  'insufficient data':'Too few signal groups have enough history to judge yet.'};
const T_WATCH = D.thresholds[0], T_SIG = D.thresholds[1];
const DOM = {}; D.domains.forEach(d => DOM[d.id] = d);
const SHORT = {logistics:'Logistics', financial:'Financial', behavioral:'Human', geospatial:'Geospatial', information:'Information'};
const THEATRES = D.order.filter(t => t !== 'global');
const REG = D.regions, regOf = {}; REG.forEach(r => r.kids.forEach(k => regOf[k] = r));
const RANKL = {'insufficient data':0, 'Normal':1, 'Watch':2, 'Elevated':3, 'Critical':4};
/* main tabs are regions; a single-theatre region opens that theatre, a multi-theatre one opens its most alarmed sub-theatre, with the others in a secondary row */
function regTarget(r){ return r.kids.slice().sort((a, b) => RANKL[D.theatres[b].level] - RANKL[D.theatres[a].level])[0]; }
const TABS = [['overview','Overview']].concat(THEATRES.map(t => [t, D.theatres[t].name])).concat([['global','Global'],['signals','Intelligence'],['assets','Assets'],['system','Settings']]);
const SERIES = {}; D.series.forEach(s => SERIES[s.id] = s);
const CLS = {lift:['Airlift','#4cc9f0'], tanker:['Tanker','#ffd166'], isr:['Surveillance / AWACS','#c77dff'], fighter:['Fighter','#ff5d73'],
  bomber:['Bomber','#ff8a1f'], uav:['Drone','#7ee081'], heli:['Helicopter','#9fd3ff'], other:['Other military','#9fb3c8']};
const CLSWHY = {
  lift:'Airlifters move troops and equipment. A surge, followed by empty return legs, marks a deployment.',
  tanker:'Tankers extend the range of fighters and bombers. Tankers plus fighters plus AWACS together mean strike packaging.',
  isr:'Surveillance and early-warning aircraft orbit before and during operations.',
  fighter:'Combat aircraft on transponders are usually deployments or air policing.',
  bomber:'Bombers are strategic signals or strike assets.',
  uav:'Long-endurance drones collect intelligence and can strike.',
  heli:'Military helicopters: local operations, rescue and special forces.',
  other:'Other military aircraft: trainers, liaison, VIP and special mission.'};
const SHIPK = {carrier:['Aircraft carrier','#ff4d4f'], amphib:['Amphibious group','#ff8a1f'], navy:['Naval vessel','#58a6ff'], tanker:['Tanker','#d9c04a'], cargo:['Cargo','#9fb3c8'], other:['Vessel','#9fb3c8']};
let tab = 'overview', selDom = null;
const F = {q:'', chip:'all', sk:'z', sd:-1};
const classOff = {};

function zcol(z){ return z == null ? '#6b7280' : z >= T_SIG ? '#f2545b' : z >= T_WATCH ? '#f08a3c' : z >= 1 ? '#e5c04b' : '#5db391'; }
function fmtz(z){ return z == null ? 'n/a' : (z > 0 ? '+' : '') + z.toFixed(1); }
function fmtv(v){
  if (v == null || isNaN(v)) return '';
  const a = Math.abs(v);
  if (a >= 1e9) return (v/1e9).toFixed(1)+'B';
  if (a >= 1e6) return (v/1e6).toFixed(1)+'M';
  if (a >= 1e4) return (v/1e3).toFixed(0)+'k';
  if (a >= 100) return v.toFixed(0);
  if (a >= 10) return v.toFixed(1);
  return v.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
}
function levelBadge(l){ return `<span class="badge" style="background:${LEVEL[l]}">${esc(l.toUpperCase())}</span>`; }
function thName(t){ return t === 'global' ? 'Global' : (D.theatres[t] ? D.theatres[t].name : t || 'Worldwide'); }
function tipShow(e, html){ const t = $('#tip'); t.innerHTML = html; t.style.display = 'block'; const w = t.offsetWidth, h = t.offsetHeight; let x = e.clientX + 14, y = e.clientY + 14; if (x + w > innerWidth - 6) x = e.clientX - w - 12; if (y + h > innerHeight - 6) y = e.clientY - h - 12; t.style.left = x + 'px'; t.style.top = y + 'px'; }
function tipHide(){ $('#tip').style.display = 'none'; }
function ago(d){ if (!d) return ''; const t = Date.parse(d.length <= 10 ? d + 'T00:00:00Z' : d); if (isNaN(t)) return d; const days = Math.round((Date.now() - t) / 864e5); return days <= 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago'; }
function spark(pts, col, w, h){
  w = w || 70; h = h || 24;
  if (!pts || pts.length < 3) return `<svg width="${w}" height="${h}"></svg>`;
  const v = pts.map(p => p[1]); let lo = Math.min(...v), hi = Math.max(...v); if (hi === lo) { hi += 1; lo -= 1; }
  const X = i => 1 + i / (v.length - 1) * (w - 2), Y = x => 2 + (1 - (x - lo) / (hi - lo)) * (h - 4);
  const d = v.map((x, i) => X(i).toFixed(1) + ',' + Y(x).toFixed(1)).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${d}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round"/><circle cx="${X(v.length-1).toFixed(1)}" cy="${Y(v[v.length-1]).toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
}

/* ------------------------------------------------------------ navigation */
const ICON = {
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  radar:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l6-6"/>',
  plane:'<path d="M10.5 13.5L3 12l1-2 7 .5L15 5l2 .5-1.5 6 5 .5.5 2-5.5.5L14 19l-2-.5z"/>',
  cog:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  panel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
  alert:'<path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.2v.1"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  up:'<path d="M4 16l6-6 4 4 6-7"/><path d="M15 7h5v5"/>',
  down:'<path d="M4 8l6 6 4-4 6 7"/><path d="M15 17h5v-5"/>',
  flat:'<path d="M4 12h16M16 8l4 4-4 4"/>',
  bell:'<path d="M6 9a6 6 0 0112 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 004 0"/>'
};
const ic = (n, c) => `<svg class="ic ${c || ''}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const fs = s => s == null ? '–' : Math.round(s);
function buildTabs(){
  const cur = regOf[tab];
  const item = (id, icon, label) => `<button class="si ${tab === id ? 'on' : ''}" data-tab="${id}" title="${label}">${ic(icon)}<span class="tx">${label}</span></button>`;
  let h = item('overview', 'grid', 'Overview') + `<div class="sgl">Theatres</div>`;
  REG.forEach(r => {
    const open = cur === r, target = r.kids.length > 1 && !open ? regTarget(r) : (open ? tab : r.kids[0]);
    h += `<button class="si ${open ? 'on' : ''}" data-tab="${target}" title="${esc(r.name)}"><span class="dot" style="background:${LEVEL[r.level]}"></span><span class="tx">${esc(r.name)}</span>${r.kids.length > 1 ? `<span class="chev">${ic('chev')}</span>` : ''}</button>`;
    if (open && r.kids.length > 1) h += `<div class="sub">` + r.kids.map(k => `<button class="si ${k === tab ? 'on' : ''}" data-tab="${k}"><span class="dot" style="background:${LEVEL[D.theatres[k].level]}"></span><span class="tx">${esc(D.theatres[k].name)}</span><span class="sc">${fs(D.theatres[k].score)}</span></button>`).join('') + `</div>`;
  });
  h += `<button class="si ${tab === 'global' ? 'on' : ''}" data-tab="global" title="Global markets and procurement"><span class="dot" style="background:${LEVEL[D.theatres.global.level]}"></span><span class="tx">Global markets</span></button>`;
  h += `<div class="sgl">Workspace</div>` + item('signals', 'radar', 'Intelligence') + item('assets', 'plane', 'Assets') + item('system', 'cog', 'Settings');
  $('#sbnav').innerHTML = h;
}
function subBar(){
  const r = regOf[tab]; if (!r || r.kids.length < 2) return '';
  return `<div class="subtabs">` + r.kids.map(k => `<button data-go="${k}" class="${k === tab ? 'on' : ''}"><span class="dot" style="background:${LEVEL[D.theatres[k].level]}"></span>${esc(D.theatres[k].name)}</button>`).join('') + `</div>`;
}
$('#sbnav').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); });
$('#brand').onclick = () => go('overview');
try { if (localStorage.getItem('ww_sb') === 'min') $('#sb').classList.add('min'); if (localStorage.getItem('ww_rm') === '1') document.body.classList.add('rm'); } catch (e) {}
$('#sbt').onclick = () => { const m = $('#sb').classList.toggle('min'); try { localStorage.setItem('ww_sb', m ? 'min' : ''); } catch (e) {} setTimeout(() => { if (M && tab !== 'signals' && tab !== 'system' && tab !== 'assets') { clampView(); applyView(); } }, 260); };
function renderTop(){
  const g = D.global || {}, gl = g.level || 'insufficient data', col = LEVEL[gl];
  const titles = {overview:'Global overview', signals:'Intelligence', assets:'Assets', system:'Settings'};
  const sub = {overview:`${THEATRES.length} theatres in ${REG.length} regions`, signals:`${D.series.length} signals, ${D.series.filter(s => s.z != null).length} scored`, assets:'Live objects on the map', system:'Display, data health and method'}[tab] || (regOf[tab] ? regOf[tab].name : 'Global markets and procurement');
  $('#tt').innerHTML = `<h1>${esc(titles[tab] || thName(tab))}</h1><small>${esc(sub)}</small>`;
  $('#gti').innerHTML = `<div><small>Global Threat Index</small><b style="color:${col}">${fs(g.score)}</b></div><div style="display:grid;gap:5px;justify-items:start"><div class="bar"><i style="width:${g.score || 0}%;background:${col}"></i></div>${levelBadge(gl)}</div>`;
  const cnt = {}; D.order.forEach(t => cnt[D.theatres[t].level] = (cnt[D.theatres[t].level] || 0) + 1);
  $('#cnts').innerHTML = ['Critical', 'Elevated', 'Watch'].map(l => `<span class="cn" title="Theatres at ${l}"><span class="dot" style="background:${LEVEL[l]}"></span>${l}<b>${cnt[l] || 0}</b></span>`).join('');
  $('#alr').innerHTML = ALERTS.slice(0, 2).map((a, i) => `<span class="ac ${a.date && Date.now() - Date.parse(a.date) < 864e5 ? 'new' : ''}" data-al="${i}" title="${esc(a.title)}">${ic('bell')}${esc(a.title.slice(0, 48))}</span>`).join('') + (ALERTS.length > 2 ? `<span class="cn">+${ALERTS.length - 2}</span>` : '');
  $('#meta').innerHTML = `${esc($("#gen").textContent)}<br>method v${esc(D.weights || '')}`;
}
$('#alr').addEventListener('click', e => { const a = e.target.closest('[data-al]'); if (a) openAlert(ALERTS[+a.dataset.al]); });

function go(id, first, dom){
  if (!TABS.some(t => t[0] === id)) id = 'overview';
  tab = id; selDom = dom || null; F.q = ''; F.chip = 'all'; location.hash = id; closeCard(); buildTabs(); renderTop();

  const th = thName(s.t);
  const verdict = s.z == null ? 'No score yet' : s.z >= T_SIG ? 'Signal: unusual' : s.z >= T_WATCH ? 'Elevated' : 'Normal range';
  const dirTxt = s.dir === 'up' ? 'A warning is a <b>rise</b> above the usual level.' : s.dir === 'down' ? 'A warning is a <b>fall</b> below the usual level.' : 'A large move <b>in either direction</b> counts as a warning.';
  const idx = modalList.indexOf(id);
  let h = `<button class="x" aria-label="Close">&times;</button><div class="nav"><a data-nav="overview">Overview</a>&rsaquo;<a data-nav="${s.t}">${esc(th)}</a>&rsaquo;<a data-nav="${s.t}" data-dom="${s.d}">${esc(DOM[s.d].name)}</a><span class="sp"></span>` +
    (modalList.length > 1 ? `<a data-step="-1" title="Previous (left arrow)">&lsaquo; Prev</a><span>${idx + 1} / ${modalList.length}</span><a data-step="1" title="Next (right arrow)">Next &rsaquo;</a>` : '') + `</div>` +
    `<h2>${esc(s.l)}</h2><div class="chips"><span class="chip">${esc(th)}</span><span class="chip">${esc(DOM[s.d].name)}</span>${s.s ? `<span class="chip">${esc(s.s)}</span>` : ''}<span class="chip" style="color:${s.lag ? 'var(--warn)' : 'var(--ok)'}">${s.lag ? 'Confirms: published late' : 'Leads: fast data'}</span><span class="chip">${s.kind === 'daily' ? 'Daily data' : 'Monthly data'}</span></div>`;
  if (s.st === 'error') h += `<div class="warnbox"><b>Fetch failed.</b> ${esc(s.er)}${s.stale ? '' : ' No earlier copy is stored, so this signal is not scored.'}</div>`;
  if (s.stale) h += `<div class="warnbox">Showing the last good copy from <b>${esc(s.stale)}</b> because the latest fetch failed.</div>`;
  if (s.st === 'awaiting_key') h += `<div class="warnbox">This signal needs a free API key (<span class="kw">${esc(s.needs.join(', '))}</span>) that has not been added yet.</div>`;
  if (s.st === 'collecting') h += `<div class="warnbox">History is still building: <b>${s.n}</b> of the <b>${s.need}</b> ${s.kind === 'daily' ? 'days' : 'months'} needed before a score is reliable. It scores itself automatically.</div>`;
  const vals = (s.pts || []).map(p => p[1]);
  const last = vals.length ? vals[vals.length - 1] : null;
  let vs = '', trig = '';
  if (s.z != null) {
    const base = s.base;
    if (base) {
      const dv = base.med ? (s.val - base.med) / Math.abs(base.med) * 100 : null;
      vs = dv == null ? '' : (dv >= 0 ? '+' : '') + dv.toFixed(Math.abs(dv) < 10 ? 1 : 0) + '%';
      const up = base.med + T_SIG * base.sd, dn = base.med - T_SIG * base.sd;
      trig = s.dir === 'up' ? `A 7-day average above <b>${fmtv(up)}</b> would count as a signal.` : s.dir === 'down' ? `A 7-day average below <b>${fmtv(dn)}</b> would count as a signal.` : `A 7-day average above <b>${fmtv(up)}</b> or below <b>${fmtv(dn)}</b> would count as a signal.`;
    }
  }
  h += `<div class="kpis"><div class="kpi"><small>${s.kind === 'daily' ? '7-day average' : 'Latest month'}</small><b>${s.z != null ? fmtv(s.val) : last != null ? fmtv(last) : 'n/a'}</b><span>${esc(s.last ? 'to ' + s.last : '')}</span></div>` +
    `<div class="kpi"><small>Normal level</small><b>${s.base ? fmtv(s.base.med) : 'n/a'}</b><span>${s.base ? 'median of ' + s.base.n + ' weeks' : s.kind === 'monthly' ? 'seasonal baseline' : ''}</span></div>` +
    `<div class="kpi"><small>vs normal</small><b style="color:${zcol(s.z)}">${vs || 'n/a'}</b><span>${s.base ? '1 SD = ' + fmtv(s.base.sd) : ''}</span></div>` +
    `<div class="kpi"><small>Standard deviations</small><b style="color:${zcol(s.z)}">${fmtz(s.z)}</b><span>${esc(verdict)}</span></div>` +
    `<div class="kpi"><small>Percentile</small><b>${vals.length > 8 ? pctRank(vals, last) + '%' : 'n/a'}</b><span>of last ${vals.length} readings</span></div></div>`;
  if (s.z != null) {
    const lo = -3, hi = 6, X = z => 4 + (Math.max(lo, Math.min(hi, z)) - lo) / (hi - lo) * 92;
    h += `<div class="gauge"><div class="gt"><span>Distance from normal (standard deviations)</span><span>watch ${T_WATCH.toFixed(1)} &middot; signal ${T_SIG.toFixed(1)}</span></div><svg viewBox="0 0 100 14" preserveAspectRatio="none"><rect x="4" y="5" width="${X(T_WATCH) - 4}" height="4" fill="#1f5a3a"/><rect x="${X(T_WATCH)}" y="5" width="${X(T_SIG) - X(T_WATCH)}" height="4" fill="#8a4d12"/><rect x="${X(T_SIG)}" y="5" width="${96 - X(T_SIG)}" height="4" fill="#8a2a2d"/><rect x="${X(s.z) - .6}" y="1" width="1.2" height="12" fill="${zcol(s.z)}"/></svg></div>`;
  }
  h += `<p class="say"><b>${esc(s.why)}</b><br><span style="color:var(--mute)">${dirTxt}${trig ? ' ' + trig : ''}</span></p>`;
  if (s.pts && s.pts.length > 1) {
    const vo = {h: 200, c: '#58a6ff'};
    if (s.base) { vo.bands = [{a: s.base.med - 2 * s.base.sd, b: s.base.med + 2 * s.base.sd, c: 'rgba(88,166,255,.13)'}, {a: s.base.med - 3 * s.base.sd, b: s.base.med + 3 * s.base.sd, c: 'rgba(88,166,255,.07)'}];
      vo.lines = [{y: s.base.med, c: '#7f93a8', t: 'normal', d: '2 3'}, {y: s.base.med + 3 * s.base.sd, c: '#ff8a1f', t: '+3 SD'}, {y: s.base.med - 3 * s.base.sd, c: '#ff8a1f', t: '-3 SD'}];
      vo.extra = [s.base.med + 3 * s.base.sd, s.base.med - 3 * s.base.sd]; }
    h += chartBlock((s.kind === 'daily' ? 'Daily values' : 'Monthly values') + (s.base ? ' and the normal range (shaded: weekly averages at ±2 and ±3 SD)' : ''), s.pts, vo, s.pts.length > 40 ? [['30', '30'], ['90', '90'], ['all', 'All']] : null);
  }
  if (s.zh && s.zh.length > 1) {
    h += chartBlock('Score history in standard deviations (what the dashboard would have shown each day)', s.zh,
      {h: 170, c: '#e6edf3', min: -3, max: 6, fy: v => v.toFixed(0), unit: 'SD', dots: v => v >= T_WATCH, area: false, extrema: false,
       bands: [{a: T_SIG, b: 99, c: 'rgba(255,77,79,.15)'}, {a: T_WATCH, b: T_SIG, c: 'rgba(255,138,31,.13)'}],
       lines: [{y: T_SIG, c: '#ff4d4f', t: 'signal ' + T_SIG.toFixed(1)}, {y: T_WATCH, c: '#ff8a1f', t: 'watch ' + T_WATCH.toFixed(1)}, {y: 0, c: '#52667a', t: '', d: '2 3'}]}, null);
  }
  const rel = modalList.filter(x => x !== id).slice(0, 8).map(x => SERIES[x]);
  h += `<div class="two"><div><h3 class="sh">About this reading</h3><table class="st">`;
  const row = (a, b) => `<tr><td>${a}</td><td>${b}</td></tr>`;
  if (s.z != null) { h += row('Method', esc(s.method)); if (s.base) h += row('Baseline spread (1 SD)', esc(fmtv(s.base.sd))); }
  h += row('Observations held', s.n + (s.pts && s.pts.length ? ` (${esc(s.pts[0][0])} to ${esc(s.last || '')})` : '')) + row('Last observation', esc(s.last || 'none') + (s.last ? ' (' + ago(s.last) + ')' : '')) + row('Needed to score', s.need + (s.kind === 'daily' ? ' days' : ' months'));
  h += `</table><p style="margin:8px 0 0;color:var(--mute);font-size:12.5px">${s.kind === 'monthly' ? 'Monthly series are log-scaled and corrected for the calendar month before scoring, against the prior 36 months.' : 'Daily series are scored on the latest 7-day average against weekly averages of the prior 26 weeks.'} Scores are capped at ±12 SD.</p><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">${s.url ? `<a class="btn" target="_blank" rel="noopener" href="${esc(s.url)}">Open the data source &#8599;</a>` : ''}<a class="btn" href="#" data-nav="${s.t}" data-dom="${s.d}">Show in ${esc(th)} &rsaquo;</a></div></div>`;
  h += `<div><h3 class="sh">Other signals in this group</h3><div class="rel">${rel.map(r => `<div data-open="${esc(r.id)}"><span>${esc(r.l.replace(/ \(.*$/, ''))}</span><b style="color:${zcol(r.z)}">${fmtz(r.z)}</b></div>`).join('') || '<span style="color:var(--dim)">No other signals in this group.</span>'}</div></div></div>`;
  $('#mbox').innerHTML = h; $('#modal').style.display = 'flex'; $('#mbox').scrollTop = 0;
}
function stepModal(d){ if (!modalList.length) return; const i = (modalList.indexOf(modalId) + d + modalList.length) % modalList.length; openModal(modalList[i]); }
function closeModal(){ $('#modal').style.display = 'none'; }
$('#modal').addEventListener('click', e => {
  if (e.target.id === 'modal' || e.target.closest('.x')) { closeModal(); return; }
  const st = e.target.closest('[data-step]'); if (st) { stepModal(+st.dataset.step); return; }
  const op = e.target.closest('[data-open]'); if (op) { openModal(op.dataset.open); return; }
  const nv = e.target.closest('[data-nav]'); if (nv) { e.preventDefault(); closeModal(); go(nv.dataset.nav, false, nv.dataset.dom); return; }
  const rg = e.target.closest('[data-rng]'); if (rg) {
    const blk = rg.closest('.cwrap'), c = CH[blk.dataset.blk]; const k = rg.dataset.rng; const pts = k === 'all' ? c.pts : c.pts.slice(-(+k));
    blk.querySelector('.cbody').innerHTML = areaChart(pts, c.o); blk.querySelectorAll('[data-rng]').forEach(b => b.classList.toggle('on', b === rg));
  }
});

/* ------------------------------------------------------------ signals table and system */
let sortKey = 'z', sortDir = -1; const TF = {th: '', dom: '', st: '', q: ''};
function renderSignalsPage(){
  const P = $('#signals');
  const rows = D.series.filter(s => (!TF.th || s.t === TF.th) && (!TF.dom || s.d === TF.dom) && (!TF.st || (TF.st === 'scored' ? s.z != null : TF.st === 'rising' ? s.z != null && s.z >= 1 : TF.st === 'leading' ? !s.lag : TF.st === 'confirming' ? s.lag : s.z == null)) &&
    (!TF.q || (s.l + ' ' + s.s + ' ' + s.id).toLowerCase().includes(TF.q.toLowerCase())));
  const key = { z: s => s.z ?? -99, l: s => s.l.toLowerCase(), t: s => thName(s.t), d: s => s.d, lag: s => s.lag ? 1 : 0 }[sortKey];
  rows.sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * sortDir; });
  const sel = (id, opts, cur) => `<select id="${id}">${opts.map(([v, n]) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
  P.innerHTML = `<h3>Intelligence: all signals (${rows.length} of ${D.series.length})</h3><div class="tbar"><input id="tq" type="search" placeholder="Search signals" value="${esc(TF.q)}">` +
    sel('tth', [['', 'All theatres']].concat(D.order.map(t => [t, thName(t)])), TF.th) + sel('tdom', [['', 'All groups']].concat(D.domains.map(d => [d.id, d.name])), TF.dom) +
    sel('tst', [['', 'Any status'], ['scored', 'Scored'], ['rising', 'Rising (1+ SD)'], ['leading', 'Leading'], ['confirming', 'Confirming'], ['none', 'No score yet']], TF.st) + `</div>` +
    `<table class="sg"><thead><tr><th data-sort="l">Signal</th><th data-sort="t">Theatre</th><th data-sort="d">Group</th><th data-sort="lag">Type</th><th>Trend</th><th data-sort="z">SD</th></tr></thead><tbody>` +
    rows.map(s => `<tr data-open="${esc(s.id)}"><td>${esc(s.l)}${s.s ? ` <span style="color:var(--dim)">· ${esc(s.s)}</span>` : ''}</td><td>${esc(thName(s.t))}</td><td>${esc(SHORT[s.d])}</td><td>${s.lag ? 'confirms' : 'leads'}</td><td>${spark(s.pts && s.pts.slice(-60), s.z == null ? '#6b7a8a' : zcol(s.z), 80, 22)}</td><td style="font-weight:700;color:${zcol(s.z)}">${s.z != null ? fmtz(s.z) : s.st === 'awaiting_key' ? 'key' : s.st === 'collecting' ? s.n + '/' + s.need : s.st === 'error' ? 'error' : 'n/a'}</td></tr>`).join('') + `</tbody></table>`;
  const ids = rows.map(r => r.id);
  P.querySelectorAll('tr[data-open]').forEach(tr => tr.onclick = () => openModal(tr.dataset.open, ids));
  P.querySelectorAll('th[data-sort]').forEach(th => th.onclick = () => { if (sortKey === th.dataset.sort) sortDir = -sortDir; else { sortKey = th.dataset.sort; sortDir = sortKey === 'z' ? -1 : 1; } renderSignalsPage(); });
  [['tth', 'th'], ['tdom', 'dom'], ['tst', 'st']].forEach(([id, k]) => $('#' + id).onchange = e => { TF[k] = e.target.value; renderSignalsPage(); });
  $('#tq').oninput = e => { TF.q = e.target.value; const pos = e.target.selectionStart; renderSignalsPage(); const q = $('#tq'); q.focus(); q.setSelectionRange(pos, pos); };
}
function renderSystem(){
  setTimeout(() => { const P = $('#system'); P.insertAdjacentHTML('afterbegin', `<h3>Display</h3><div class="setrow">Map label size <button data-sz="0.9" class="${lblScale < 1 ? 'on' : ''}">Small</button><button data-sz="1.15" class="${lblScale > 1 && lblScale < 1.3 ? 'on' : ''}">Medium</button><button data-sz="1.4" class="${lblScale >= 1.3 ? 'on' : ''}">Large</button>&nbsp;&nbsp;Motion <button data-rm="0" class="${document.body.classList.contains('rm') ? '' : 'on'}">On</button><button data-rm="1" class="${document.body.classList.contains('rm') ? 'on' : ''}">Reduced</button></div>`); }, 0);
  const cnt = {}; D.series.forEach(s => cnt[s.st] = (cnt[s.st] || 0) + 1);
  const awaiting = D.series.filter(s => s.st === 'awaiting_key'), err = D.series.filter(s => s.st === 'error');
  const stale = D.series.filter(s => s.stale);
  const keys = {}; awaiting.forEach(s => s.needs.forEach(k => keys[k] = (keys[k] || 0) + 1));
  const lk = s => `<a href="#" data-open="${esc(s.id)}">${esc(s.l)}</a>`;
  $('#system').innerHTML = `<div class="cols">
  <div><h3>Data health</h3><ul>
    <li><b>${cnt.ok || 0}</b> signals scored</li><li><b>${cnt.collecting || 0}</b> still collecting history (<a href="#" data-sg="none">see which</a>)</li>
    <li><b>${cnt.awaiting_key || 0}</b> waiting for a free key${Object.keys(keys).length ? ' (' + Object.keys(keys).map(k => `<span class="kw">${esc(k)}</span> x${keys[k]}`).join(', ') + ')' : ''}</li>
    <li><b>${cnt.error || 0}</b> failed to fetch${stale.length ? `, <b>${stale.length}</b> showing a stale copy` : ''}</li></ul>
    ${err.length ? '<h3>Failures</h3><ul>' + err.map(s => `<li>${lk(s)}: ${esc(s.er)}</li>`).join('') + '</ul>' : ''}
    ${awaiting.length ? '<h3>Waiting for a key</h3><ul>' + awaiting.map(s => `<li>${lk(s)} <span class="kw">${esc(s.needs.join(', '))}</span></li>`).join('') + '</ul>' : ''}
    ${D.errors.length ? '<h3>Map layers that failed</h3><ul>' + D.errors.map(e => `<li>${esc(e)}</li>`).join('') + '</ul>' : ''}
    <p><a href="#" data-go="signals">Browse all ${D.series.length} signals &rsaquo;</a></p>
  </div>
  <div><h3>How the level is decided</h3><ul>
    <li>Each signal is compared with its own last 90 days (36 months for monthly data) using a <b>modified z-score</b>: 0.6745 &times; (value &minus; median) / MAD, capped at &plusmn;5. One bad data point cannot dominate.</li>
    <li>Signals that move together (recent changes correlate above 0.8) are averaged into one, so the same event is not counted twice.</li>
    <li>A domain looks at its strongest groups with weights that favour agreement (OWA, orness 0.3): one spike is not enough, several signals are.</li>
    <li>The five domains are combined with the theatre's <b>versioned weights</b> into a Mazziotta-Pareto index; a lopsided profile reads higher than an even one.</li>
    <li>Levels come from calm-world percentiles (simulated, then stretched to match how spread out the real signals are): <b>Watch</b> = top 10%, <b>Elevated</b> = top 5%, <b>Critical</b> = top 1%. The threat score is 50 at the Watch line and 90 at the Critical line.</li>
    <li>Confidence falls when many of a theatre's signals have no score yet. A signal missing for more than two days is not carried forward.</li>
    <li>Elevated or Critical driven only by late-published data is labelled <b>lagging only</b>: a confirmed build-up, not an early warning.</li>
    <li>This is a statistical alarm, not a probability of war. Full method: <a href="https://github.com/khourix/warwatch/blob/main/docs/METHODOLOGY.md" target="_blank" rel="noopener">METHODOLOGY.md</a>.</li></ul>
    <h3>Reading the map</h3><ul><li>Click any aircraft, ship, incident or warning for details. Click a country to open its theatre.</li><li>Click a legend item to hide or show an aircraft type. Use the layer list to switch layers, and the label-size buttons if text is hard to read.</li><li>Press <span class="kw">/</span> to search everything.</li></ul></div>
  <div><h3>How often each source is read</h3><ul>${(D.updates || []).map(u => `<li><b>${esc(u.s)}</b>: ${esc(u.e)}<br><span style="color:var(--dim)">${esc(u.l)}</span></li>`).join('')}</ul>
  <h3>Not available, and what replaces it</h3><ul>${D.unavailable.map(u => `<li><b>${esc(u.n)}</b>: ${esc(u.w)}</li>`).join('')}</ul></div></div>`;
}
$('#system').addEventListener('click', e => { const sz = e.target.closest('[data-sz]'); if (sz) { lblScale = +sz.dataset.sz; try { localStorage.setItem('ww_lbl', lblScale); } catch (x) {} renderLayers(); applyView(); renderSystem(); return; } const rm = e.target.closest('[data-rm]'); if (rm) { document.body.classList.toggle('rm', rm.dataset.rm === '1'); try { localStorage.setItem('ww_rm', rm.dataset.rm); } catch (x) {} renderSystem(); return; } const o = e.target.closest('[data-open]'); if (o) { e.preventDefault(); openModal(o.dataset.open, []); return; } const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); go(g.dataset.go); return; } if (e.target.closest('[data-sg]')) { e.preventDefault(); TF.st = 'none'; go('signals'); } });

/* ------------------------------------------------------------ start */
if (D.demo) $('#demo').hidden = false;
buildMap(); renderLayers(); syncLayers();
const h0 = location.hash.slice(1);
go(TABS.some(t => t[0] === h0) ? h0 : 'overview', true);
</script>
<script>
// pick up the 30-minute rebuilds without a manual reload (only when the tab is visible and no card or chart is open)
setInterval(() => { try { if (!document.hidden && $('#modal').style.display !== 'flex' && Date.now() - T0 > 25 * 60e3) location.reload(); } catch (e) {} }, 60e3);
</script>
</body>
